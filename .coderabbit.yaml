# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  profile: "quiet"
  request_changes_workflow: true
  high_level_summary: false
  poem: false
  review_status: true
  review_details: false
  enable_prompt_for_ai_agents: false
  abort_on_close: true
  disable_cache: true
  auto_review:
    enabled: false
    drafts: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0
    base_branches: []
    labels: []
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
      - "renovate[bot]"
    description_keyword: ""
  path_instructions:
    - path: "**"
      instructions: |
        Treat inline actionable comments as merge-blocking review findings.
        Open them only for Critical or High severity correctness, security,
        compatibility, data-loss, release-integrity, or test-validity defects.
        Keep Medium and Low observations advisory in the review summary rather
        than opening actionable threads. Follow the repository AGENTS.md Code
        Review Rules and include concrete evidence and a proving verification.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []

chat:
  auto_reply: false

knowledge_base:
  opt_out: true
  web_search:
    enabled: false
  code_guidelines:
    enabled: true
