name: Prepare ha-mcp compatibility attestation

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Exact stable homeassistant-ai/ha-mcp version (for example 7.14.2)
        required: true
        type: string

concurrency:
  group: upstream-compatibility-attestation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Upstream observation runs without the signing environment, its secrets, or
  # any write token.  Its only output is a bounded, hash-bound artifact.
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      runtime_sha256: ${{ steps.stage.outputs.runtime_sha256 }}
      release_sha256: ${{ steps.stage.outputs.release_sha256 }}
    env:
      VERSION: ${{ inputs.upstream_version }}
      UPSTREAM_REPOSITORY: https://github.com/homeassistant-ai/ha-mcp.git
      UPSTREAM_IMAGE_REPOSITORY: ghcr.io/homeassistant-ai/ha-mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock

      - name: Validate exact stable version and fixed source locations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$UPSTREAM_REPOSITORY" = "https://github.com/homeassistant-ai/ha-mcp.git"
          test "$UPSTREAM_IMAGE_REPOSITORY" = "ghcr.io/homeassistant-ai/ha-mcp"

      - name: Resolve exact source tag and reviewed implementation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPOSITORY" "$RUNNER_TEMP/ha-mcp"
          git -C "$RUNNER_TEMP/ha-mcp" fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          source_commit="$(git -C "$RUNNER_TEMP/ha-mcp" rev-list -n 1 "v${VERSION}")"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          git -C "$RUNNER_TEMP/ha-mcp" checkout --detach "$source_commit"
          grep -q 'name="ha_config_get_dashboard"' "$RUNNER_TEMP/ha-mcp/src/ha_mcp/tools/tools_config_dashboards.py"
          grep -q 'include_screenshot is None or include_screenshot is False' "$RUNNER_TEMP/ha-mcp/src/ha_mcp/read_only.py"
          grep -q 'json.dumps(config, sort_keys=True, separators=(",", ":"))' "$RUNNER_TEMP/ha-mcp/src/ha_mcp/utils/config_hash.py"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve immutable official image and provenance
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tagged="${UPSTREAM_IMAGE_REPOSITORY}:${VERSION}"
          inspect="$RUNNER_TEMP/upstream-inspect.txt"
          docker buildx imagetools inspect "$tagged" > "$inspect"
          index_digest="$(awk '$1 == "Digest:" {print $2; exit}' "$inspect")"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable="${UPSTREAM_IMAGE_REPOSITORY}@${index_digest}"
          # Provenance comes only from the digest-verified attestation payloads;
          # index annotations only locate them.
          python scripts/verify_upstream_image_provenance.py \
            --index-digest "$index_digest" \
            --version "$VERSION" \
            --source-commit "${{ steps.source.outputs.source_commit }}" \
            --output "$RUNNER_TEMP/upstream-provenance.json"
          python - "$RUNNER_TEMP/upstream-provenance.json" "$RUNNER_TEMP/platforms.json" "$RUNNER_TEMP/attested.json" "$index_digest" <<'PY'
          import json, pathlib, sys
          provenance = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if provenance["image_index_digest"] != sys.argv[4]:
              raise SystemExit("attested image index differs from the resolved index")
          if provenance["slsa_provenance"] != "present_per_platform":
              raise SystemExit("SLSA provenance is missing for an upstream platform")
          platforms = provenance["platform_digests"]
          if not {"linux/amd64", "linux/arm64"}.issubset(platforms):
              raise SystemExit("required upstream platforms are missing")
          pathlib.Path(sys.argv[2]).write_text(json.dumps({
              "platform_digests": platforms,
              "attestation_count": len(provenance["attested_platforms"]),
              "slsa_provenance": provenance["slsa_provenance"],
              "sbom": provenance["sbom"],
          }, sort_keys=True))
          pathlib.Path(sys.argv[3]).write_text(json.dumps({
              "revision": provenance["workflow_sha"],
              "created": provenance["attested_labels"].get("created", ""),
          }, sort_keys=True))
          PY
          revision="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["revision"])' "$RUNNER_TEMP/attested.json")"
          attested_created="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["created"])' "$RUNNER_TEMP/attested.json")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          docker pull --platform linux/amd64 "$immutable"
          # Image labels are informational; they must agree with the attestation.
          label_revision="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_version="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          created="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')"
          source_label="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          dirty_label="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "io.hass-mcp.build.dirty" }}')"
          test "$label_revision" = "$revision"
          test "$image_version" = "$VERSION"
          if [[ -n "$attested_created" ]]; then
            test "$created" = "$attested_created"
          fi
          test "$source_label" = "https://github.com/homeassistant-ai/ha-mcp"
          if [[ -n "$dirty_label" && "$dirty_label" != "false" ]]; then
            echo "::error::The official upstream image reports a dirty build."
            exit 1
          fi
          dirty_label="${dirty_label:-absent}"
          git -C "$RUNNER_TEMP/ha-mcp" fetch origin "$revision"
          git -C "$RUNNER_TEMP/ha-mcp" merge-base --is-ancestor "${{ steps.source.outputs.source_commit }}" "$revision"
          unexpected="$(git -C "$RUNNER_TEMP/ha-mcp" diff --name-only "${{ steps.source.outputs.source_commit }}" "$revision" -- . ':!homeassistant-addon/CHANGELOG.md' ':!homeassistant-addon/config.yaml')"
          test -z "$unexpected"
          {
            echo "index_digest=$index_digest"
            echo "image_revision=$revision"
            echo "created=$created"
            echo "source_label=$source_label"
            echo "dirty_label=$dirty_label"
          } >> "$GITHUB_OUTPUT"

      - name: Start disposable read-only Home Assistant fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fake_ha_dashboard_contract_server.py --port 18123 > "$RUNNER_TEMP/fake-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18123/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Extract runtime contract from the exact published image
        shell: bash
        run: |
          set -euo pipefail
          image="${UPSTREAM_IMAGE_REPOSITORY}@${{ steps.image.outputs.index_digest }}"
          docker run --detach --rm --network host --name upstream-compatibility-review \
            --read-only --tmpfs /tmp --tmpfs /home/mcpuser/.ha-mcp \
            -e HOMEASSISTANT_URL=http://127.0.0.1:18123 \
            -e HOMEASSISTANT_TOKEN=synthetic-upstream-compatibility-token \
            -e MCP_HOST=127.0.0.1 -e MCP_PORT=18086 -e MCP_SECRET_PATH=/mcp \
            -e HA_MCP_DISABLE_SETTINGS_UI=true \
            "$image" ha-mcp-web
          for attempt in $(seq 1 60); do
            curl --silent --output /dev/null http://127.0.0.1:18086/mcp && break
            sleep 1
          done
          mkdir -p .compat
          python scripts/inspect_upstream_dashboard_runtime.py \
            --endpoint http://127.0.0.1:18086/mcp \
            --version "$VERSION" \
            --output .compat/runtime-evidence.json

      - name: Generate bounded release evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$VERSION" "${{ steps.source.outputs.source_commit }}" "${{ steps.image.outputs.index_digest }}" "${{ steps.image.outputs.image_revision }}" "${{ steps.image.outputs.created }}" "${{ steps.image.outputs.source_label }}" "${{ steps.image.outputs.dirty_label }}" "$RUNNER_TEMP/platforms.json" <<'PY'
          import json, pathlib, sys
          version, source_commit, index_digest, revision, created, source_label, dirty_label, platforms_path = sys.argv[1:]
          platforms = json.loads(pathlib.Path(platforms_path).read_text())
          value = {
              "version": version,
              "source_tag": f"v{version}",
              "source_commit": source_commit,
              "image_index_digest": index_digest,
              "image_revision": revision,
              "image_created": created,
              "image_source": source_label,
              "dirty_label": dirty_label,
              "platform_digests": platforms["platform_digests"],
              "slsa_provenance": platforms["slsa_provenance"],
              "sbom": platforms["sbom"],
              "official_repository": "homeassistant-ai/ha-mcp",
              "official_image": "ghcr.io/homeassistant-ai/ha-mcp",
          }
          pathlib.Path(".compat/release-evidence.json").write_text(json.dumps(value, sort_keys=True))
          PY

      - name: Stage bounded release evidence for signing
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/release-evidence"
          mkdir -- "$staging"
          cp -- .compat/runtime-evidence.json .compat/release-evidence.json "$staging/"
          {
            echo "runtime_sha256=$(sha256sum -- "$staging/runtime-evidence.json" | cut -d ' ' -f 1)"
            echo "release_sha256=$(sha256sum -- "$staging/release-evidence.json" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Retain bounded release evidence for signing
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: upstream-attestation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Write bounded attestation summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Upstream compatibility attestation"
            echo "- Version: ${VERSION}"
            echo "- Fixed source: homeassistant-ai/ha-mcp"
            echo "- Fixed image: ghcr.io/homeassistant-ai/ha-mcp"
            echo "- Contract family: ha_mcp_dashboard_read_v2"
            echo "- Image push: false"
            echo "- Engineering release: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up disposable runtime
        if: always()
        shell: bash
        run: |
          docker rm -f upstream-compatibility-review >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/fake-ha.pid" ]]; then kill "$(cat "$RUNNER_TEMP/fake-ha.pid")" >/dev/null 2>&1 || true; fi
          rm -rf .compat

  # Signing holds the environment-scoped seed but no write token.  It installs
  # only the hash-locked runtime parsers the signer re-validates evidence with.
  sign:
    needs: evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: upstream-attestation-signing
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.stage.outputs.manifest_sha256 }}
    env:
      VERSION: ${{ inputs.upstream_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock

      - name: Download bounded release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.evidence.outputs.artifact_id }}
          path: .compat

      - name: Verify bounded release evidence
        env:
          RUNTIME_SHA256: ${{ needs.evidence.outputs.runtime_sha256 }}
          RELEASE_SHA256: ${{ needs.evidence.outputs.release_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          present="$(cd .compat && find . -mindepth 1 -printf '%P\n' | sort)"
          test "$present" = "$(printf '%s\n' release-evidence.json runtime-evidence.json)"
          test ! -L .compat/runtime-evidence.json
          test ! -L .compat/release-evidence.json
          [[ "$RUNTIME_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum -- .compat/runtime-evidence.json | cut -d ' ' -f 1)" = "$RUNTIME_SHA256"
          test "$(sha256sum -- .compat/release-evidence.json | cut -d ' ' -f 1)" = "$RELEASE_SHA256"

      - name: Sign and verify data-only registry update
        env:
          UPSTREAM_TRUST_REGISTRY_SIGNING_KEY: ${{ secrets.UPSTREAM_TRUST_REGISTRY_SIGNING_KEY }}
          UPSTREAM_TRUST_REGISTRY_PUBLIC_KEY: ${{ secrets.UPSTREAM_TRUST_REGISTRY_PUBLIC_KEY }}
          UPSTREAM_TRUST_REGISTRY_KEY_ID: ${{ secrets.UPSTREAM_TRUST_REGISTRY_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_TRUST_REGISTRY_SIGNING_KEY"
          test -n "$UPSTREAM_TRUST_REGISTRY_PUBLIC_KEY"
          test -n "$UPSTREAM_TRUST_REGISTRY_KEY_ID"
          python scripts/prepare_upstream_compatibility_attestation.py --version "$VERSION"

      - name: Remove bounded signing inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -- .compat/runtime-evidence.json .compat/release-evidence.json
          rmdir -- .compat

      - name: Stage exact signed data-only update
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            upstream-trust/upstream-dashboard-registry.json \
            upstream-trust/upstream-dashboard-registry.sig.json \
            "docs/evidence/upstream-compatibility/ha-mcp-${VERSION}.json" \
            docs/generated/UPSTREAM_TRUST_REGISTRY_INDEX.md | sort)"
          changed="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          test -n "$changed"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$expected"))"
          test -z "$unexpected"
          staging="$RUNNER_TEMP/signed"
          mkdir -p -- "$staging/files"
          while IFS= read -r relative; do
            test -f "$relative"
            test ! -L "$relative"
            install -D -m 0644 -- "$relative" "$staging/files/$relative"
          done <<< "$changed"
          (cd "$staging/files" && sha256sum -- $changed) > "$staging/SHA256SUMS"
          echo "manifest_sha256=$(sha256sum -- "$staging/SHA256SUMS" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Retain exact signed data-only update
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: upstream-attestation-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 1

  # Publication holds the write token but no signing environment or secret,
  # and runs no Python or package installation.
  publish:
    needs: sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.upstream_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact signed data-only update
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: ${{ runner.temp }}/signed

      - name: Verify and apply exact signed data-only update
        env:
          MANIFEST_SHA256: ${{ needs.sign.outputs.manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/signed"
          expected="$(printf '%s\n' \
            upstream-trust/upstream-dashboard-registry.json \
            upstream-trust/upstream-dashboard-registry.sig.json \
            "docs/evidence/upstream-compatibility/ha-mcp-${VERSION}.json" \
            docs/generated/UPSTREAM_TRUST_REGISTRY_INDEX.md | sort)"
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test ! -L "$signed/SHA256SUMS"
          test "$(sha256sum -- "$signed/SHA256SUMS" | cut -d ' ' -f 1)" = "$MANIFEST_SHA256"
          listed="$(cut -c 67- "$signed/SHA256SUMS" | sort)"
          test -n "$listed"
          test -z "$(comm -23 <(printf '%s\n' "$listed") <(printf '%s\n' "$expected"))"
          test "$(cd "$signed/files" && find . -mindepth 1 ! -type d -printf '%P\n' | sort)" = "$listed"
          test -z "$(cd "$signed/files" && find . -mindepth 1 ! -type d ! -type f)"
          (cd "$signed/files" && sha256sum --strict --check --quiet ../SHA256SUMS)
          while IFS= read -r relative; do
            install -D -m 0644 -- "$signed/files/$relative" "$relative"
          done <<< "$listed"
          rm -rf -- "$signed"

      - name: Enforce data-only diff
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="data/upstream-attestation-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- \
            upstream-trust/upstream-dashboard-registry.json \
            upstream-trust/upstream-dashboard-registry.sig.json \
            "docs/evidence/upstream-compatibility/ha-mcp-${VERSION}.json" \
            docs/generated/UPSTREAM_TRUST_REGISTRY_INDEX.md
          unexpected="$(git diff --cached --name-only | grep -Ev '^(upstream-trust/upstream-dashboard-registry(\.sig)?\.json|docs/evidence/upstream-compatibility/ha-mcp-[0-9]+\.[0-9]+\.[0-9]+\.json|docs/generated/UPSTREAM_TRUST_REGISTRY_INDEX\.md)$' || true)"
          test -z "$unexpected"
          git commit -m "Attest ha-mcp ${VERSION} dashboard read compatibility"
          # Checkout credentials are not persisted; the token reaches git only
          # through the gh credential helper for this one push.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open data-only draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr create --draft --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "Attest ha-mcp ${VERSION} dashboard read compatibility" \
            --body "Data-only signed compatibility attestation for exact ha-mcp ${VERSION}. No Engineering code, image, tool allowlist, or argument builder is changed."
