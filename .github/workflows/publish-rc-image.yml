name: Publish reviewed Engineering release

on:
  workflow_run:
    workflows: [Merge owner-authorized pull request]
    types: [completed]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact reviewed unpublished release commit retained on main
        required: true
        type: string
      expected_version:
        description: Exact Engineering version already materialized by that commit
        required: true
        type: string
      recovery_run_id:
        description: Failed authorized publication run that produced an untagged digest
        required: false
        type: string
      recovery_run_attempt:
        description: Exact failed attempt, including one predating a later rerun (optional)
        required: false
        type: string
      recovery_source_digest:
        description: Exact untagged OCI digest from that failed authorized run
        required: false
        type: string
      recovery_build_time:
        description: Exact UTC build timestamp bound by that digest's provenance
        required: false
        type: string

permissions: {}

concurrency:
  group: hass-mcp-engineering-release-publication
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/jeter-1/hass-mcp-engineering-beta

jobs:
  validate:
    name: Complete validation gate
    needs: detect-release
    if: needs.detect-release.outputs.release_action == 'publish'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  detect-release:
    name: Detect Engineering release transition
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: read
      contents: read
    outputs:
      release_action: ${{ steps.detect.outputs.release_action }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
      validation_base: ${{ steps.detect.outputs.validation_base }}
      expected_version: ${{ steps.detect.outputs.expected_version }}
      release_mode: ${{ steps.detect.outputs.release_mode }}
      source_mode: ${{ steps.detect.outputs.source_mode }}
      recovery_run_id: ${{ steps.detect.outputs.recovery_run_id }}
      recovery_run_attempt: ${{ steps.detect.outputs.recovery_run_attempt }}
      recovery_source_digest: ${{ steps.detect.outputs.recovery_source_digest }}
      recovery_build_time: ${{ steps.detect.outputs.recovery_build_time }}
      source_handoff: ${{ steps.handoff.outputs.source_handoff }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'workflow_run'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.lock
      - name: Install locked eligibility parser dependencies
        if: github.event_name == 'workflow_run'
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock
      - name: Independently verify completed merge handoff
        id: handoff
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 scripts/publication_handoff.py verify \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_RUN_ATTEMPT" \
            --authority "$WORKFLOW_AUTHORITY_SHA" --github-output "$GITHUB_OUTPUT"
      - id: detect
        shell: bash
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_EXPECTED_VERSION: ${{ inputs.expected_version }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_RELEASE_SHA: ${{ inputs.release_sha }}
          EVENT_RECOVERY_BUILD_TIME: ${{ inputs.recovery_build_time }}
          EVENT_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          EVENT_RECOVERY_RUN_ATTEMPT: ${{ inputs.recovery_run_attempt }}
          EVENT_RECOVERY_SOURCE_DIGEST: ${{ inputs.recovery_source_digest }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TRIGGER_SHA: ${{ github.sha }}
          HANDOFF_ACTION: ${{ steps.handoff.outputs.release_action }}
          HANDOFF_RELEASE_SHA: ${{ steps.handoff.outputs.release_sha }}
          HANDOFF_BASE_SHA: ${{ steps.handoff.outputs.validation_base }}
        run: |
          set -euo pipefail

          release_sha="$TRIGGER_SHA"
          validation_base="$EVENT_BEFORE"
          release_mode="protected_main_push"
          expected_version=""
          source_mode="build"
          recovery_run_id=""
          recovery_run_attempt=""
          recovery_source_digest=""
          recovery_build_time=""
          trigger_checkout_sha="$(git rev-parse HEAD)"

          if [[ "$trigger_checkout_sha" != "$TRIGGER_SHA" ]]; then
            echo "::error::The detector checkout is not the exact triggering commit."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$HANDOFF_ACTION" == "none" ]]; then
              echo "release_action=none" >> "$GITHUB_OUTPUT"
              echo "Verified merge handoff requires no publication; full publication CI is not needed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [[ "$HANDOFF_ACTION" == "inspect" && "$HANDOFF_RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$HANDOFF_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            release_sha="$HANDOFF_RELEASE_SHA"
            validation_base="$HANDOFF_BASE_SHA"
            release_mode="protected_merge_handoff"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_ACTOR" != "jeter-1" || "$EVENT_TRIGGERING_ACTOR" != "jeter-1" ]]; then
              echo "::error::Only the repository owner may request or rerun manual publication recovery."
              exit 1
            elif [[ "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication recovery must be dispatched from protected main."
              exit 1
            elif [[ ! "$EVENT_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Manual publication recovery requires an exact lowercase commit SHA."
              exit 1
            elif [[ ! "$EVENT_EXPECTED_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]; then
              echo "::error::Manual publication recovery requires a bounded exact version."
              exit 1
            fi

            recovery_field_count=0
            [[ -n "$EVENT_RECOVERY_RUN_ID" ]] && recovery_field_count=$((recovery_field_count + 1))
            [[ -n "$EVENT_RECOVERY_SOURCE_DIGEST" ]] && recovery_field_count=$((recovery_field_count + 1))
            [[ -n "$EVENT_RECOVERY_BUILD_TIME" ]] && recovery_field_count=$((recovery_field_count + 1))
            if [[ -n "$EVENT_RECOVERY_RUN_ATTEMPT" ]]; then
              if [[ "$recovery_field_count" -ne 3 || ! "$EVENT_RECOVERY_RUN_ATTEMPT" =~ ^([1-9][0-9]?|100)$ ]]; then
                echo "::error::An exact recovery attempt requires all digest recovery fields and an attempt from 1 through 100."
                exit 1
              fi
              recovery_run_attempt="$EVENT_RECOVERY_RUN_ATTEMPT"
            fi
            if [[ "$recovery_field_count" -ne 0 && "$recovery_field_count" -ne 3 ]]; then
              echo "::error::Digest recovery requires run ID, source digest, and build time together."
              exit 1
            elif [[ "$recovery_field_count" -eq 3 ]]; then
              if [[ ! "$EVENT_RECOVERY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
                echo "::error::Digest recovery requires a bounded exact prior run ID."
                exit 1
              elif [[ ! "$EVENT_RECOVERY_SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Digest recovery requires an exact lowercase sha256 digest."
                exit 1
              elif [[ ! "$EVENT_RECOVERY_BUILD_TIME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
                echo "::error::Digest recovery requires an exact UTC RFC3339 build timestamp."
                exit 1
              fi
              source_mode="resume_digest"
              recovery_run_id="$EVENT_RECOVERY_RUN_ID"
              recovery_source_digest="$EVENT_RECOVERY_SOURCE_DIGEST"
              recovery_build_time="$EVENT_RECOVERY_BUILD_TIME"
            fi

            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            protected_main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [[ "$TRIGGER_SHA" != "$protected_main_sha" ]]; then
              echo "::error::Manual publication recovery was not triggered from the current protected-main head."
              exit 1
            elif ! git cat-file -e "${EVENT_RELEASE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::The requested manual recovery commit is unavailable."
              exit 1
            elif ! git merge-base --is-ancestor "$EVENT_RELEASE_SHA" "$protected_main_sha"; then
              echo "::error::The requested manual recovery commit is not retained on protected main."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$EVENT_RELEASE_SHA" >/dev/null; then
              echo "::error::The requested manual recovery commit is not on protected main's first-parent history."
              exit 1
            elif ! git diff --quiet "$EVENT_RELEASE_SHA..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source or deployment metadata drifted after the requested release commit."
              exit 1
            elif git cat-file -e "${protected_main_sha}:.release/next-version" 2>/dev/null; then
              echo "::error::Current protected main contains an unmaterialized release declaration."
              exit 1
            fi

            release_sha="$EVENT_RELEASE_SHA"
            validation_base="$(git rev-parse "${release_sha}^1")"
            release_mode="manual_recovery"
            expected_version="$EVENT_EXPECTED_VERSION"
          elif [[ "$EVENT_NAME" != "push" || "$EVENT_REF" != "refs/heads/main" ]]; then
            echo "::error::Unsupported publication event or branch."
            exit 1
          fi

          current_version="$(git show "${release_sha}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
          previous_version=""
          if [[ "$validation_base" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${validation_base}^{commit}" 2>/dev/null; then
            previous_version="$(git show "${validation_base}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
          fi
          if git cat-file -e "${release_sha}:.release/next-version" 2>/dev/null; then
            echo "::error::Main contains an unmaterialized release declaration. Release state must be finalized in the reviewed pull request."
            exit 1
          elif git cat-file -e "${validation_base}:.release/next-version" 2>/dev/null; then
            echo "::error::A legacy staged declaration reached main. Finalize the release state in one reviewed pull request."
            exit 1
          elif [[ -n "$current_version" && -n "$previous_version" && "$current_version" != "$previous_version" ]]; then
            if [[ "$release_mode" == "manual_recovery" && "$current_version" != "$expected_version" ]]; then
              echo "::error::The requested version does not match the exact recovery commit."
              exit 1
            fi
            expected_version="$current_version"
            {
              echo "release_action=publish"
              echo "release_sha=$release_sha"
              echo "validation_base=$validation_base"
              echo "expected_version=$expected_version"
              echo "release_mode=$release_mode"
              echo "source_mode=$source_mode"
              echo "recovery_run_id=$recovery_run_id"
              echo "recovery_run_attempt=$recovery_run_attempt"
              echo "recovery_source_digest=$recovery_source_digest"
              echo "recovery_build_time=$recovery_build_time"
            } >> "$GITHUB_OUTPUT"
            echo "A reviewed final-version commit is eligible for ${release_mode} publication using ${source_mode}." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$release_mode" == "manual_recovery" ]]; then
            echo "::error::The requested recovery commit has no bounded Engineering version transition."
            exit 1
          else
            echo "release_action=none" >> "$GITHUB_OUTPUT"
            echo "No reviewed Engineering version transition is present." >> "$GITHUB_STEP_SUMMARY"
          fi

  recovery-source:
    name: Validate digest-recovery source run
    needs:
      - detect-release
    if: needs.detect-release.outputs.release_action == 'publish'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_workflow_sha: ${{ steps.recovery.outputs.source_workflow_sha }}
      source_run_attempt: ${{ steps.recovery.outputs.source_run_attempt }}
      source_event_name: ${{ steps.recovery.outputs.source_event_name }}
    steps:
      - if: needs.detect-release.outputs.source_mode == 'resume_digest'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read and validate failed publication run
        id: recovery
        if: needs.detect-release.outputs.source_mode == 'resume_digest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ needs.detect-release.outputs.recovery_run_id }}
          RECOVERY_RUN_ATTEMPT: ${{ needs.detect-release.outputs.recovery_run_attempt }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ || ! "$WORKFLOW_AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Digest recovery lacks bounded read-only source authority."
            exit 1
          fi
          verifier="$RUNNER_TEMP/verify_publication_source_image.py"
          if ! git show "${WORKFLOW_AUTHORITY_SHA}:scripts/verify_publication_source_image.py" > "$verifier" || [[ ! -s "$verifier" ]]; then
            echo "::error::The digest-recovery verifier is unavailable from current workflow authority."
            exit 1
          fi
          recovery_run_json="$RUNNER_TEMP/recovery-run.json"
          recovery_route="repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}"
          attempt_arguments=()
          if [[ -n "$RECOVERY_RUN_ATTEMPT" ]]; then
            [[ "$RECOVERY_RUN_ATTEMPT" =~ ^([1-9][0-9]?|100)$ ]]
            recovery_route="${recovery_route}/attempts/${RECOVERY_RUN_ATTEMPT}"
            attempt_arguments=(--expected-run-attempt "$RECOVERY_RUN_ATTEMPT")
          fi
          gh api "$recovery_route" > "$recovery_run_json"
          python "$verifier" verify-recovery-run \
            --run-json "$recovery_run_json" \
            --expected-run-id "$RECOVERY_RUN_ID" "${attempt_arguments[@]}" \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-owner "jeter-1" \
            --github-output "$GITHUB_OUTPUT"

  promote:
    name: Publish and verify reviewed release
    needs:
      - validate
      - detect-release
      - recovery-source
    if: needs.detect-release.outputs.release_action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      digest: ${{ steps.source.outputs.digest }}
      image_published: ${{ steps.publish_tags.outputs.publication_disposition == 'complete' }}
      image_publication_disposition: ${{ steps.publish_tags.outputs.publication_disposition || 'none' }}
      image_verified: ${{ steps.verify.outputs.image_verified }}
      tag_created: ${{ steps.finalize.outputs.tag_created }}
      tag_verified: ${{ steps.finalize.outputs.tag_verified }}
      github_release_created: ${{ steps.release.outputs.github_release_created }}
      github_release_verified: ${{ steps.release.outputs.github_release_verified }}
      release_complete: ${{ steps.release.outputs.release_complete }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.detect-release.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            hass_mcp_engineering_beta/requirements.*
            tests/requirements.*

      - name: Install release validation dependencies
        shell: bash
        env:
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]
          # The protected verifier's dependencies also work when an older,
          # guarded recovery source predates lock files. Never resolve afresh.
          git show "${WORKFLOW_AUTHORITY_SHA}:tests/requirements.lock" \
            > "$RUNNER_TEMP/release-validation.lock"
          python -m pip --isolated install --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple -r "$RUNNER_TEMP/release-validation.lock"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Materialize protected publication policy
        shell: bash
        env:
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/publication-policy"
          for policy in publication_handoff.py publication_claim.py validate_ci_provenance.py validate_ready_authorization.py; do
            git show "${WORKFLOW_AUTHORITY_SHA}:scripts/${policy}" > "$RUNNER_TEMP/publication-policy/${policy}"
          done

      - name: Validate protected release commit
        id: prepare
        shell: bash
        env:
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          COMPLETE_CI_RESULT: ${{ needs.validate.result }}
          SOURCE_VALIDATION_RECEIPT: ${{ needs.validate.outputs.source_validation }}
          DETECTED_EXPECTED_VERSION: ${{ needs.detect-release.outputs.expected_version }}
          DETECTED_RECOVERY_BUILD_TIME: ${{ needs.detect-release.outputs.recovery_build_time }}
          DETECTED_RECOVERY_RUN_ID: ${{ needs.detect-release.outputs.recovery_run_id }}
          DETECTED_RECOVERY_SOURCE_DIGEST: ${{ needs.detect-release.outputs.recovery_source_digest }}
          DETECTED_RELEASE_MODE: ${{ needs.detect-release.outputs.release_mode }}
          DETECTED_RELEASE_SHA: ${{ needs.detect-release.outputs.release_sha }}
          DETECTED_SOURCE_MODE: ${{ needs.detect-release.outputs.source_mode }}
          DETECTED_VALIDATION_BASE: ${{ needs.detect-release.outputs.validation_base }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SOURCE_EVENT_NAME: ${{ needs.recovery-source.outputs.source_event_name }}
          RECOVERY_SOURCE_RUN_ATTEMPT: ${{ needs.recovery-source.outputs.source_run_attempt }}
          RECOVERY_SOURCE_WORKFLOW_SHA: ${{ needs.recovery-source.outputs.source_workflow_sha }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          source_main_sha="$(git rev-parse HEAD)"
          if [[ "$source_main_sha" != "$DETECTED_RELEASE_SHA" ]]; then
            echo "::error::The workflow checkout is not the exact detected release commit."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          protected_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if ! bash scripts/assert_protected_release_ancestor.sh \
            "$source_main_sha" "$protected_main_sha"; then
            echo "::error::The triggering release commit is not retained in protected-main history."
            exit 1
          fi

          validation_base="$DETECTED_VALIDATION_BASE"
          if [[ ! "$validation_base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${validation_base}^{commit}" 2>/dev/null; then
            echo "::error::The protected release transition has no valid prior main commit."
            exit 1
          fi
          if [[ "$DETECTED_RELEASE_MODE" == "manual_recovery" ]]; then
            if [[ "$EVENT_ACTOR" != "jeter-1" || "$EVENT_TRIGGERING_ACTOR" != "jeter-1" || "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication recovery authority changed before publication."
              exit 1
            elif [[ "$TRIGGER_SHA" != "$protected_main_sha" ]]; then
              echo "::error::Protected main moved after manual publication recovery was authorized."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$source_main_sha" >/dev/null; then
              echo "::error::The manual recovery commit is not on protected main's first-parent history."
              exit 1
            elif [[ "$(git rev-parse "${source_main_sha}^1")" != "$validation_base" ]]; then
              echo "::error::The manual recovery validation base is not the release commit's first parent."
              exit 1
            elif ! git diff --quiet "$source_main_sha..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source or deployment metadata drifted before publication."
              exit 1
            elif git cat-file -e "${protected_main_sha}:.release/next-version" 2>/dev/null; then
              echo "::error::Current protected main contains an unmaterialized release declaration."
              exit 1
            fi
            protected_version="$(git show "${protected_main_sha}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
            if [[ "$protected_version" != "$DETECTED_EXPECTED_VERSION" ]]; then
              echo "::error::Protected main no longer advertises the authorized recovery version."
              exit 1
            fi
          elif [[ "$DETECTED_RELEASE_MODE" == "protected_merge_handoff" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_handoff.py" guard \
              --release "$DETECTED_RELEASE_SHA" --authority "$TRIGGER_SHA"
          elif [[ "$DETECTED_RELEASE_MODE" != "protected_main_push" ]]; then
            echo "::error::The detected release mode is unsupported."
            exit 1
          fi
          if [[ -f .release/next-version ]]; then
            echo "::error::Publication is forbidden while a staged declaration remains on main."
            exit 1
          fi

          current_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          deployed_version="$(git show "${validation_base}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
          version="$current_version"
          if [[ -z "$version" || "$version" != "$DETECTED_EXPECTED_VERSION" || -z "$deployed_version" || "$deployed_version" == "$version" ]]; then
            echo "::error::The protected release commit does not contain a bounded version transition."
            exit 1
          fi

          python scripts/promote_next_release.py \
            --validate-transition "$deployed_version" "$version"
          actual_paths="$RUNNER_TEMP/actual-release-paths"
          git diff --name-only "$validation_base..HEAD" | LC_ALL=C sort > "$actual_paths"
          for required_path in \
            hass_mcp_engineering_beta/config.yaml \
            hass_mcp_engineering_beta/ha_mcp_engineering/version.py \
            scripts/validate_addon_metadata.py
          do
            if ! grep -Fxq "$required_path" "$actual_paths"; then
              echo "::error::The reviewed release did not update ${required_path}."
              exit 1
            fi
          done
          if grep -Fxq .release/next-version "$actual_paths"; then
            echo "::error::The reviewed release transition includes an unmaterialized declaration."
            exit 1
          fi

          python scripts/promote_next_release.py --validate-authority "$version"
          python scripts/validate_promotion_candidate.py --repo-root . --require-materialized
          release_notes_path="$(python scripts/promote_next_release.py --resolve-release-notes "$version")"
          if [[ ! "$release_notes_path" =~ ^docs/[A-Za-z0-9._/-]+_RELEASE_NOTES\.md$ || ! -f "$release_notes_path" ]]; then
            echo "::error::The resolved release-notes authority is not a bounded existing repository path."
            exit 1
          fi
          release_tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::The immutable release tag ${release_tag} already exists."
            exit 1
          fi

          release_probe_error="$RUNNER_TEMP/github-release-probe-error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" >/dev/null 2>"$release_probe_error"; then
            echo "::error::A GitHub Release already exists for ${release_tag}."
            exit 1
          elif ! grep -Fq "HTTP 404" "$release_probe_error"; then
            cat "$release_probe_error" >&2
            echo "::error::Unable to prove that the GitHub Release tag is unused."
            exit 1
          fi

          bash scripts/assert_registry_tags_absent.sh \
            "${IMAGE_REPOSITORY}:${version}"

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The reviewed pre-versioned release checkout is not clean."
            exit 1
          fi
          release_sha="$(git rev-parse HEAD)"
          source_workflow_sha="$TRIGGER_SHA"
          source_run_attempt="$CURRENT_RUN_ATTEMPT"
          source_event_name="$EVENT_NAME"

          if [[ "$DETECTED_SOURCE_MODE" == "resume_digest" ]]; then
            if [[ "$DETECTED_RELEASE_MODE" != "manual_recovery" ]]; then
              echo "::error::An existing digest may be resumed only through owner-authorized manual recovery."
              exit 1
            fi
            source_workflow_sha="$RECOVERY_SOURCE_WORKFLOW_SHA"
            source_run_attempt="$RECOVERY_SOURCE_RUN_ATTEMPT"
            source_event_name="$RECOVERY_SOURCE_EVENT_NAME"
            if [[ ! "$source_workflow_sha" =~ ^[0-9a-f]{40}$ || ! "$source_run_attempt" =~ ^[1-9][0-9]{0,2}$ || ( "$source_event_name" != "workflow_dispatch" && "$source_event_name" != "workflow_run" && "$source_event_name" != "push" ) ]]; then
              echo "::error::The read-only recovery-source job did not provide exact failed-run authority."
              exit 1
            fi
            {
              echo "source_workflow_sha=$source_workflow_sha"
              echo "source_run_attempt=$source_run_attempt"
              echo "source_event_name=$source_event_name"
            } >> "$GITHUB_OUTPUT"
            if ! git cat-file -e "${source_workflow_sha}^{commit}" 2>/dev/null; then
              echo "::error::The failed publication workflow commit is unavailable."
              exit 1
            elif ! git merge-base --is-ancestor "$source_workflow_sha" "$protected_main_sha"; then
              echo "::error::The failed publication workflow commit is no longer retained on protected main."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$source_workflow_sha" >/dev/null; then
              echo "::error::The failed publication workflow commit is not on protected main's first-parent history."
              exit 1
            elif ! git cat-file -e "${source_workflow_sha}:.github/workflows/publish-rc-image.yml" 2>/dev/null; then
              echo "::error::The failed run is not bound to the reviewed publication workflow."
              exit 1
            elif ! git diff --quiet "$source_workflow_sha..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source drifted after the failed digest build."
              exit 1
            fi
            build_time="$DETECTED_RECOVERY_BUILD_TIME"
          elif [[ "$DETECTED_SOURCE_MODE" == "build" ]]; then
            if [[ -n "$DETECTED_RECOVERY_RUN_ID" || -n "$DETECTED_RECOVERY_SOURCE_DIGEST" || -n "$DETECTED_RECOVERY_BUILD_TIME" ]]; then
              echo "::error::Fresh publication cannot carry partial digest-recovery evidence."
              exit 1
            fi
            build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            {
              echo "source_workflow_sha=$source_workflow_sha"
              echo "source_run_attempt=$source_run_attempt"
              echo "source_event_name=$source_event_name"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::The detected publication source mode is unsupported."
            exit 1
          fi

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ || ! "$source_workflow_sha" =~ ^[0-9a-f]{40}$ || ! "$source_run_attempt" =~ ^[1-9][0-9]{0,2}$ || ! "$build_time" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::Release provenance is not a bounded commit SHA and UTC RFC3339 timestamp."
            exit 1
          fi

          bash scripts/assert_registry_tags_absent.sh \
            "${IMAGE_REPOSITORY}:sha-${release_sha}"

          python scripts/validate_addon_metadata.py \
            --repo-root . \
            --base-ref "$validation_base" \
            --expected-version "$version" \
            --deployed-version "$deployed_version"
          python -m compileall -q hass_mcp_admin hass_mcp_engineering_beta tests
          # Use the current protected verifier even when recovery selects an
          # older release source without this helper. Missing/failed/mismatched
          # same-run evidence refuses publication, rather than weakening CI.
          validation_verifier="$RUNNER_TEMP/publication-validation.py"
          git show "${TRIGGER_SHA}:scripts/publication_validation.py" > "$validation_verifier"
          validation_mode="$(python "$validation_verifier" decide \
            --repo-root . --installed-lock "$RUNNER_TEMP/release-validation.lock")"
          if [[ "$validation_mode" == "validate_release_source" ]]; then
            # Historical stable-v1 behavior modules intentionally do not match
            # the Engineering test*.py discovery pattern.
            python -m unittest discover -s tests -v
          elif [[ "$validation_mode" == "reuse_same_run" ]]; then
            echo "Reusing exact-source full discovery from this run's successful complete CI."
          else
            echo "::error::Unknown source-validation disposition."
            exit 1
          fi
          echo "full_suite_validation=$validation_mode" >> "$GITHUB_OUTPUT"
          git diff --check "$validation_base..HEAD"

          {
            echo "source_main_sha=$source_main_sha"
            echo "current_version=$current_version"
            echo "deployed_version=$deployed_version"
            echo "release_mode=$DETECTED_RELEASE_MODE"
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "release_notes_path=$release_notes_path"
            echo "release_sha=$release_sha"
            echo "build_time=$build_time"
            echo "source_mode=$DETECTED_SOURCE_MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact release architectures
        id: platforms
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/release-platform-verifier.py"
          [[ "$WORKFLOW_AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git show "${WORKFLOW_AUTHORITY_SHA}:scripts/verify_publication_source_image.py" > "$verifier"
          python "$verifier" release-platforms \
            --release-repo . --expected-release-sha "$RELEASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: needs.detect-release.outputs.source_mode == 'build'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Revalidate publication authority before registry access
        shell: bash
        env:
          DETECTED_EXPECTED_VERSION: ${{ needs.detect-release.outputs.expected_version }}
          DETECTED_RELEASE_MODE: ${{ needs.detect-release.outputs.release_mode }}
          DETECTED_RELEASE_SHA: ${{ needs.detect-release.outputs.release_sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          PREPARED_RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          PREPARED_RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          PREPARED_VERSION: ${{ steps.prepare.outputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_sha="$(git rev-parse HEAD)"
          if [[ "$release_sha" != "$DETECTED_RELEASE_SHA" || "$release_sha" != "$PREPARED_RELEASE_SHA" ]]; then
            echo "::error::The pre-publication checkout is not the exact detected release commit."
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          protected_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if ! bash scripts/assert_protected_release_ancestor.sh \
            "$release_sha" "$protected_main_sha"; then
            echo "::error::The release commit is no longer retained in protected-main history."
            exit 1
          fi

          if [[ "$DETECTED_RELEASE_MODE" == "manual_recovery" ]]; then
            if [[ "$EVENT_ACTOR" != "jeter-1" || "$EVENT_TRIGGERING_ACTOR" != "jeter-1" || "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication recovery authority changed before registry access."
              exit 1
            elif [[ "$TRIGGER_SHA" != "$protected_main_sha" ]]; then
              echo "::error::Protected main moved before registry access."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$release_sha" >/dev/null; then
              echo "::error::The manual recovery commit left protected main's first-parent history."
              exit 1
            elif ! git diff --quiet "$release_sha..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source or deployment metadata drifted before registry access."
              exit 1
            elif git cat-file -e "${protected_main_sha}:.release/next-version" 2>/dev/null; then
              echo "::error::Current protected main contains an unmaterialized release declaration."
              exit 1
            fi

            protected_version="$(git show "${protected_main_sha}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
            if [[ "$protected_version" != "$DETECTED_EXPECTED_VERSION" ]]; then
              echo "::error::Protected main no longer advertises the authorized recovery version."
              exit 1
            fi
          elif [[ "$DETECTED_RELEASE_MODE" == "protected_merge_handoff" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_handoff.py" guard \
              --release "$DETECTED_RELEASE_SHA" --authority "$TRIGGER_SHA"
          elif [[ "$DETECTED_RELEASE_MODE" != "protected_main_push" ]]; then
            echo "::error::The detected release mode is unsupported."
            exit 1
          fi

          remote_tag_probe="$RUNNER_TEMP/prepublication-remote-tag-probe"
          set +e
          git ls-remote --exit-code --tags origin \
            "refs/tags/${PREPARED_RELEASE_TAG}" >"$remote_tag_probe" 2>&1
          remote_tag_status=$?
          set -e
          if [[ "$remote_tag_status" -eq 0 ]]; then
            echo "::error::The immutable release tag ${PREPARED_RELEASE_TAG} appeared before image publication."
            exit 1
          elif [[ "$remote_tag_status" -ne 2 ]]; then
            echo "::error::Unable to prove that the immutable release tag is absent before image publication."
            exit 1
          fi

          release_probe_error="$RUNNER_TEMP/prepublication-github-release-probe-error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREPARED_RELEASE_TAG}" >/dev/null 2>"$release_probe_error"; then
            echo "::error::A GitHub Release for ${PREPARED_RELEASE_TAG} appeared before image publication."
            exit 1
          elif ! grep -Fq "HTTP 404" "$release_probe_error"; then
            echo "::error::Unable to prove that the GitHub Release is absent before image publication."
            exit 1
          fi

          bash scripts/assert_registry_tags_absent.sh \
            "${IMAGE_REPOSITORY}:${PREPARED_VERSION}" \
            "${IMAGE_REPOSITORY}:sha-${PREPARED_RELEASE_SHA}"

      - name: Consume create-only publication attempt authority
        id: attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_MODE: ${{ needs.detect-release.outputs.source_mode }}
          RECOVERY_RUN_ID: ${{ needs.detect-release.outputs.recovery_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.prepare.outputs.source_run_attempt }}
          SOURCE_WORKFLOW_SHA: ${{ steps.prepare.outputs.source_workflow_sha }}
          SOURCE_EVENT: ${{ steps.prepare.outputs.source_event_name }}
          SOURCE_HANDOFF: ${{ needs.detect-release.outputs.source_handoff }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_MODE" == "build" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_claim.py" create \
              --release "$RELEASE_SHA" --version "$VERSION" \
              --handoff "$SOURCE_HANDOFF" --github-output "$GITHUB_OUTPUT"
          elif [[ "$SOURCE_MODE" == "resume_digest" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_claim.py" resume \
              --release "$RELEASE_SHA" --version "$VERSION" \
              --run-id "$RECOVERY_RUN_ID" --attempt "$SOURCE_RUN_ATTEMPT" \
              --workflow-sha "$SOURCE_WORKFLOW_SHA" --event "$SOURCE_EVENT" \
              --github-output "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Log in to GHCR
        if: needs.detect-release.outputs.source_mode == 'build'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release commit without a temporary tag
        id: build
        if: needs.detect-release.outputs.source_mode == 'build'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./hass_mcp_engineering_beta
          platforms: ${{ steps.platforms.outputs.build_platforms }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/jeter-1/hass-mcp-engineering-beta,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_VERSION=${{ steps.prepare.outputs.version }}
            HAMCP_BUILD_SHA=${{ steps.prepare.outputs.release_sha }}
            HAMCP_BUILD_TIME=${{ steps.prepare.outputs.build_time }}
            HAMCP_BUILD_DIRTY=false
          labels: |
            org.opencontainers.image.source=https://github.com/jeter-1/hass-mcp-admin
            org.opencontainers.image.revision=${{ steps.prepare.outputs.release_sha }}
            org.opencontainers.image.created=${{ steps.prepare.outputs.build_time }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            io.hass-mcp.build.dirty=false

      - name: Resolve immutable source image
        id: source
        shell: bash
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          RECOVERY_DIGEST: ${{ needs.detect-release.outputs.recovery_source_digest }}
          SOURCE_MODE: ${{ needs.detect-release.outputs.source_mode }}
        run: |
          set -euo pipefail

          digest=""
          source_image_published=false
          source_image_reused=false
          if [[ "$SOURCE_MODE" == "build" ]]; then
            if [[ ! "$BUILT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ || -n "$RECOVERY_DIGEST" ]]; then
              echo "::error::Fresh publication did not produce one exact immutable source digest."
              exit 1
            fi
            digest="$BUILT_DIGEST"
            source_image_published=true
          elif [[ "$SOURCE_MODE" == "resume_digest" ]]; then
            if [[ -n "$BUILT_DIGEST" || ! "$RECOVERY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Digest recovery attempted to build or lacks its exact prior digest."
              exit 1
            fi
            digest="$RECOVERY_DIGEST"
            source_image_reused=true
          else
            echo "::error::The immutable source-image mode is unsupported."
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "source_image_published=$source_image_published"
            echo "source_image_reused=$source_image_reused"
          } >> "$GITHUB_OUTPUT"

      - name: Verify digest-addressed image architectures and raw attestations anonymously
        id: verify_source
        shell: bash
        env:
          BUILD_TIME: ${{ steps.prepare.outputs.build_time }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.digest }}
          EXPECTED_EVENT_NAME: ${{ steps.prepare.outputs.source_event_name }}
          EXPECTED_HANDOFF: ${{ steps.attempt.outputs.source_handoff }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.prepare.outputs.source_run_attempt }}
          EXPECTED_RUN_ID: ${{ needs.detect-release.outputs.recovery_run_id || github.run_id }}
          EXPECTED_WORKFLOW_SHA: ${{ steps.prepare.outputs.source_workflow_sha }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          anonymous_config="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$anonymous_config"
          source_image="${IMAGE_REPOSITORY}@${EXPECTED_DIGEST}"
          manifest_json="$RUNNER_TEMP/source-manifest.json"
          verifier="$RUNNER_TEMP/verify_publication_source_image.py"

          if [[ ! "$WORKFLOW_AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The source verifier has no exact workflow-authority commit."
            exit 1
          elif ! git show "${WORKFLOW_AUTHORITY_SHA}:scripts/verify_publication_source_image.py" > "$verifier" || [[ ! -s "$verifier" ]]; then
            echo "::error::The source verifier is unavailable from exact workflow authority."
            exit 1
          fi

          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect --raw \
            "$source_image" > "$manifest_json"
          platform_env="$RUNNER_TEMP/source-platforms.env"
          python "$verifier" extract-manifest \
            --release-repo . --expected-release-sha "$RELEASE_SHA" \
            --manifest-json "$manifest_json" \
            --expected-digest "$EXPECTED_DIGEST" \
            --output-env "$platform_env"
          # The verifier emits only fixed platform keys with exact sha256 values.
          source "$platform_env"

          image_arguments=()
          IFS=',' read -ra platforms <<< '${{ steps.platforms.outputs.build_platforms }}'
          for platform in "${platforms[@]}"; do
            case "$platform" in
              linux/amd64) digest="$SOURCE_AMD64_DIGEST" ;;
              linux/arm64) digest="$SOURCE_ARM64_DIGEST" ;;
              linux/arm/v7) digest="$SOURCE_ARMV7_DIGEST" ;;
              *) echo "::error::Unexpected release platform"; exit 1 ;;
            esac
            image_json="$RUNNER_TEMP/source-${platform//\//-}.json"
            DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
              --format '{{json .Image}}' "${IMAGE_REPOSITORY}@${digest}" > "$image_json"
            image_arguments+=(--image-json "$platform=$image_json")
          done
          python "$verifier" verify-source \
            --release-repo . \
            --manifest-json "$manifest_json" \
            --image-repository "$IMAGE_REPOSITORY" \
            "${image_arguments[@]}" \
            --expected-digest "$EXPECTED_DIGEST" \
            --expected-release-sha "$RELEASE_SHA" \
            --expected-version "$VERSION" \
            --expected-build-time "$BUILD_TIME" \
            --expected-run-id "$EXPECTED_RUN_ID" \
            --expected-run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA" \
            --expected-event-name "$EXPECTED_EVENT_NAME" \
            --expected-handoff "$EXPECTED_HANDOFF" \
            --repository "$GITHUB_REPOSITORY" \
            --owner "jeter-1" \
            --github-output "$GITHUB_OUTPUT"

      - name: Revalidate publication authority before final image tags
        shell: bash
        env:
          DETECTED_EXPECTED_VERSION: ${{ needs.detect-release.outputs.expected_version }}
          DETECTED_RELEASE_MODE: ${{ needs.detect-release.outputs.release_mode }}
          DETECTED_RELEASE_SHA: ${{ needs.detect-release.outputs.release_sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          PREPARED_RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          PREPARED_RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          PREPARED_VERSION: ${{ steps.prepare.outputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          release_sha="$(git rev-parse HEAD)"
          if [[ "$release_sha" != "$DETECTED_RELEASE_SHA" || "$release_sha" != "$PREPARED_RELEASE_SHA" ]]; then
            echo "::error::The final-tag checkout is not the exact detected release commit."
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          protected_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if ! bash scripts/assert_protected_release_ancestor.sh \
            "$release_sha" "$protected_main_sha"; then
            echo "::error::The release commit is no longer retained in protected-main history."
            exit 1
          fi

          if [[ "$DETECTED_RELEASE_MODE" == "manual_recovery" ]]; then
            if [[ "$EVENT_ACTOR" != "jeter-1" || "$EVENT_TRIGGERING_ACTOR" != "jeter-1" || "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication recovery authority changed before final image tags."
              exit 1
            elif [[ "$TRIGGER_SHA" != "$protected_main_sha" ]]; then
              echo "::error::Protected main moved before final image tags."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$release_sha" >/dev/null; then
              echo "::error::The manual recovery commit left protected main's first-parent history."
              exit 1
            elif ! git diff --quiet "$release_sha..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source or deployment metadata drifted before final image tags."
              exit 1
            elif git cat-file -e "${protected_main_sha}:.release/next-version" 2>/dev/null; then
              echo "::error::Current protected main contains an unmaterialized release declaration."
              exit 1
            fi

            protected_version="$(git show "${protected_main_sha}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
            if [[ "$protected_version" != "$DETECTED_EXPECTED_VERSION" ]]; then
              echo "::error::Protected main no longer advertises the authorized recovery version."
              exit 1
            fi
          elif [[ "$DETECTED_RELEASE_MODE" == "protected_merge_handoff" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_handoff.py" guard \
              --release "$DETECTED_RELEASE_SHA" --authority "$TRIGGER_SHA"
          elif [[ "$DETECTED_RELEASE_MODE" != "protected_main_push" ]]; then
            echo "::error::The detected release mode is unsupported."
            exit 1
          fi

          remote_tag_probe="$RUNNER_TEMP/final-image-remote-tag-probe"
          set +e
          git ls-remote --exit-code --tags origin \
            "refs/tags/${PREPARED_RELEASE_TAG}" >"$remote_tag_probe" 2>&1
          remote_tag_status=$?
          set -e
          if [[ "$remote_tag_status" -eq 0 ]]; then
            echo "::error::The immutable release tag ${PREPARED_RELEASE_TAG} appeared before final image tags."
            exit 1
          elif [[ "$remote_tag_status" -ne 2 ]]; then
            echo "::error::Unable to prove that the immutable release tag is absent before final image tags."
            exit 1
          fi

          release_probe_error="$RUNNER_TEMP/final-image-github-release-probe-error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREPARED_RELEASE_TAG}" >/dev/null 2>"$release_probe_error"; then
            echo "::error::A GitHub Release for ${PREPARED_RELEASE_TAG} appeared before final image tags."
            exit 1
          elif ! grep -Fq "HTTP 404" "$release_probe_error"; then
            echo "::error::Unable to prove that the GitHub Release is absent before final image tags."
            exit 1
          fi

          bash scripts/assert_registry_tags_absent.sh \
            "${IMAGE_REPOSITORY}:${PREPARED_VERSION}" \
            "${IMAGE_REPOSITORY}:sha-${PREPARED_RELEASE_SHA}"

      - name: Create release image tags with bounded GHCR checks
        id: publish_tags
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          VERSION: ${{ steps.prepare.outputs.version }}
          WORKFLOW_AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$WORKFLOW_AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The workflow-authority commit is not an exact SHA."
            exit 1
          fi
          publisher="$RUNNER_TEMP/publish_registry_tags_guarded.py"
          if ! git show "${WORKFLOW_AUTHORITY_SHA}:scripts/publish_registry_tags_guarded.py" > "$publisher" || [[ ! -s "$publisher" ]]; then
            echo "::error::The guarded GHCR publisher is unavailable from the exact workflow-authority commit."
            exit 1
          fi

          python "$publisher" \
            --repository "$IMAGE_REPOSITORY" \
            --source-digest "$SOURCE_DIGEST" \
            --target-tag "sha-${RELEASE_SHA}" \
            --target-tag "$VERSION"

      - name: Verify immutable release tags anonymously
        id: verify
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.source.outputs.digest }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail

          anonymous_config="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$anonymous_config"
          version_image="${IMAGE_REPOSITORY}:${VERSION}"
          sha_image="${IMAGE_REPOSITORY}:sha-${RELEASE_SHA}"
          version_inspect="$RUNNER_TEMP/version-inspect.txt"
          sha_inspect="$RUNNER_TEMP/sha-inspect.txt"

          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
            "$version_image" > "$version_inspect"
          DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
            "$sha_image" > "$sha_inspect"

          version_digest="$(awk '$1 == "Digest:" { print $2; exit }' "$version_inspect")"
          sha_digest="$(awk '$1 == "Digest:" { print $2; exit }' "$sha_inspect")"
          if [[ -z "$EXPECTED_DIGEST" || "$version_digest" != "$EXPECTED_DIGEST" || "$sha_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::The version and release-commit tags do not share the published immutable digest."
            exit 1
          fi
          {
            echo "image_verified=true"
            echo "manifest_digest=$version_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Finalize release commit and annotated tag
        id: finalize
        shell: bash
        env:
          DETECTED_EXPECTED_VERSION: ${{ needs.detect-release.outputs.expected_version }}
          DETECTED_RELEASE_MODE: ${{ needs.detect-release.outputs.release_mode }}
          DETECTED_RELEASE_SHA: ${{ needs.detect-release.outputs.release_sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          TRIGGER_SHA: ${{ github.sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD_TIME: ${{ steps.prepare.outputs.build_time }}
          IMAGE_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::The published checkout moved from the reviewed release commit."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git_name="$(git config --get user.name)"
          git_email="$(git config --get user.email)"
          if [[ -z "$git_name" || -z "$git_email" ]]; then
            echo "::error::Annotated-tag identity is empty."
            exit 1
          fi

          annotation="$(printf 'HA MCP Engineering Server %s\nVersion: %s\nSource SHA: %s\nImage digest: %s\nBuild timestamp: %s' "$VERSION" "$VERSION" "$RELEASE_SHA" "$IMAGE_DIGEST" "$BUILD_TIME")"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$annotation"
          local_tag="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if [[ "$local_tag" != "$RELEASE_SHA" ]]; then
            echo "::error::The local annotated tag does not resolve to release_sha."
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          protected_main_sha="$(git rev-parse refs/remotes/origin/main)"
          bash scripts/assert_protected_release_ancestor.sh \
            "$RELEASE_SHA" "$protected_main_sha"
          if [[ "$DETECTED_RELEASE_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::The detected release identity changed before the annotated-tag write."
            exit 1
          elif [[ "$DETECTED_RELEASE_MODE" == "manual_recovery" ]]; then
            if [[ "$EVENT_ACTOR" != "jeter-1" || "$EVENT_TRIGGERING_ACTOR" != "jeter-1" || "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication recovery authority changed before the annotated-tag write."
              exit 1
            elif [[ "$TRIGGER_SHA" != "$protected_main_sha" ]]; then
              echo "::error::Protected main moved before the annotated-tag write."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$RELEASE_SHA" >/dev/null; then
              echo "::error::The manual recovery commit left protected main's first-parent history."
              exit 1
            elif ! git diff --quiet "$RELEASE_SHA..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source or deployment metadata drifted before the annotated-tag write."
              exit 1
            elif git cat-file -e "${protected_main_sha}:.release/next-version" 2>/dev/null; then
              echo "::error::Current protected main contains an unmaterialized release declaration."
              exit 1
            fi

            protected_version="$(git show "${protected_main_sha}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
            if [[ "$protected_version" != "$DETECTED_EXPECTED_VERSION" ]]; then
              echo "::error::Protected main no longer advertises the authorized recovery version."
              exit 1
            fi
          elif [[ "$DETECTED_RELEASE_MODE" == "protected_merge_handoff" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_handoff.py" guard \
              --release "$DETECTED_RELEASE_SHA" --authority "$TRIGGER_SHA"
          elif [[ "$DETECTED_RELEASE_MODE" != "protected_main_push" ]]; then
            echo "::error::The detected release mode is unsupported."
            exit 1
          fi

          remote_tag_probe="$RUNNER_TEMP/pre-push-remote-tag-probe"
          set +e
          git ls-remote --exit-code --tags origin \
            "refs/tags/${RELEASE_TAG}" >"$remote_tag_probe" 2>&1
          remote_tag_status=$?
          set -e
          if [[ "$remote_tag_status" -eq 0 ]]; then
            echo "::error::The immutable release tag appeared before the annotated-tag write."
            exit 1
          elif [[ "$remote_tag_status" -ne 2 ]]; then
            echo "::error::Unable to prove that the immutable release tag remains absent."
            exit 1
          fi

          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          promoted_main="$(git rev-parse refs/remotes/origin/main)"
          promoted_tag="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [[ "$promoted_tag" != "$RELEASE_SHA" ]]; then
            echo "::error::The annotated release tag does not resolve to the release commit."
            exit 1
          fi
          bash scripts/assert_protected_release_ancestor.sh \
            "$RELEASE_SHA" "$promoted_main"
          echo "tag_verified=true" >> "$GITHUB_OUTPUT"

      - name: Create and verify GitHub Release
        id: release
        shell: bash
        env:
          DETECTED_EXPECTED_VERSION: ${{ needs.detect-release.outputs.expected_version }}
          DETECTED_RELEASE_MODE: ${{ needs.detect-release.outputs.release_mode }}
          DETECTED_RELEASE_SHA: ${{ needs.detect-release.outputs.release_sha }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.prepare.outputs.release_notes_path }}
          SOURCE_MAIN_SHA: ${{ steps.prepare.outputs.source_main_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD_TIME: ${{ steps.prepare.outputs.build_time }}
          IMAGE_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          promoted_main="$(git rev-parse refs/remotes/origin/main)"
          promoted_tag="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [[ "$promoted_tag" != "$RELEASE_SHA" ]]; then
            echo "::error::The GitHub Release cannot be created because its annotated tag moved."
            exit 1
          fi
          bash scripts/assert_protected_release_ancestor.sh \
            "$RELEASE_SHA" "$promoted_main"

          release_title="HA MCP Engineering Server ${VERSION}"
          release_body="$RUNNER_TEMP/github-release-notes.md"
          python - "$RELEASE_NOTES_PATH" "$release_body" "$VERSION" "$SOURCE_MAIN_SHA" "$RELEASE_SHA" "$BUILD_TIME" "$IMAGE_DIGEST" <<'PY'
          from pathlib import Path
          import sys

          notes_path, output_path, version, source_sha, release_sha, build_time, digest = sys.argv[1:]
          notes = Path(notes_path).read_text(encoding="utf-8").rstrip()
          identity = f"""## Immutable publication identity

          - Source main commit: `{source_sha}`
          - Release commit: `{release_sha}`
          - Version image: `ghcr.io/jeter-1/hass-mcp-engineering-beta:{version}`
          - Commit image: `ghcr.io/jeter-1/hass-mcp-engineering-beta:sha-{release_sha}`
          - OCI manifest digest: `{digest}`
          - Build timestamp: `{build_time}`
          - Architectures: `${{ steps.platforms.outputs.build_platforms }}`
          - SLSA provenance and SBOM attestations: verified
          """
          Path(output_path).write_text(
              f"{notes}\n\n{identity}", encoding="utf-8", newline=""
          )
          PY

          expected_prerelease=false
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
            release_flags+=(--prerelease)
          fi

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          protected_main_sha="$(git rev-parse refs/remotes/origin/main)"
          promoted_tag="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [[ "$promoted_tag" != "$RELEASE_SHA" ]]; then
            echo "::error::The GitHub Release cannot be created because its annotated tag moved."
            exit 1
          fi
          bash scripts/assert_protected_release_ancestor.sh \
            "$RELEASE_SHA" "$protected_main_sha"
          if [[ "$DETECTED_RELEASE_SHA" != "$RELEASE_SHA" ]]; then
            echo "::error::The detected release identity changed before the GitHub Release write."
            exit 1
          elif [[ "$DETECTED_RELEASE_MODE" == "manual_recovery" ]]; then
            if [[ "$EVENT_ACTOR" != "jeter-1" || "$EVENT_TRIGGERING_ACTOR" != "jeter-1" || "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual publication recovery authority changed before the GitHub Release write."
              exit 1
            elif [[ "$TRIGGER_SHA" != "$protected_main_sha" ]]; then
              echo "::error::Protected main moved before the GitHub Release write."
              exit 1
            elif ! git rev-list --first-parent "$protected_main_sha" | grep -Fx "$RELEASE_SHA" >/dev/null; then
              echo "::error::The manual recovery commit left protected main's first-parent history."
              exit 1
            elif ! git diff --quiet "$RELEASE_SHA..$protected_main_sha" -- hass_mcp_engineering_beta; then
              echo "::error::Engineering source or deployment metadata drifted before the GitHub Release write."
              exit 1
            elif git cat-file -e "${protected_main_sha}:.release/next-version" 2>/dev/null; then
              echo "::error::Current protected main contains an unmaterialized release declaration."
              exit 1
            fi

            protected_version="$(git show "${protected_main_sha}:hass_mcp_engineering_beta/config.yaml" | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p')"
            if [[ "$protected_version" != "$DETECTED_EXPECTED_VERSION" ]]; then
              echo "::error::Protected main no longer advertises the authorized recovery version."
              exit 1
            fi
          elif [[ "$DETECTED_RELEASE_MODE" == "protected_merge_handoff" ]]; then
            python "$RUNNER_TEMP/publication-policy/publication_handoff.py" guard \
              --release "$DETECTED_RELEASE_SHA" --authority "$TRIGGER_SHA"
          elif [[ "$DETECTED_RELEASE_MODE" != "protected_main_push" ]]; then
            echo "::error::The detected release mode is unsupported."
            exit 1
          fi

          release_probe_error="$RUNNER_TEMP/github-release-final-probe-error"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>"$release_probe_error"; then
            echo "::error::A GitHub Release appeared before exact finalization."
            exit 1
          elif ! grep -Fq "HTTP 404" "$release_probe_error"; then
            cat "$release_probe_error" >&2
            echo "::error::Unable to prove that the GitHub Release tag remains unused."
            exit 1
          fi

          release_url="$(gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_title" \
            --notes-file "$release_body" \
            --target "$RELEASE_SHA" \
            --verify-tag \
            "${release_flags[@]}")"
          echo "github_release_created=true" >> "$GITHUB_OUTPUT"

          release_json="$RUNNER_TEMP/github-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          python - "$release_json" "$release_body" "$RELEASE_TAG" "$release_title" "$release_url" "$expected_prerelease" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_body = Path(sys.argv[2]).read_text(encoding="utf-8").rstrip()
          expected_tag, expected_title, expected_url = sys.argv[3:6]
          expected_prerelease = sys.argv[6] == "true"
          failures = []
          if payload.get("tag_name") != expected_tag:
              failures.append("tag")
          if payload.get("name") != expected_title:
              failures.append("title")
          if payload.get("html_url") != expected_url:
              failures.append("url")
          if payload.get("body", "").rstrip() != expected_body:
              failures.append("body")
          if payload.get("draft") is not False:
              failures.append("draft")
          if payload.get("prerelease") is not expected_prerelease:
              failures.append("prerelease")
          if not isinstance(payload.get("id"), int) or not payload.get("published_at"):
              failures.append("publication_identity")
          if failures:
              raise SystemExit(
                  "GitHub Release verification failed: " + ", ".join(failures)
              )
          PY
          {
            echo "github_release_verified=true"
            echo "release_complete=true"
            echo "release_url=$release_url"
          } >> "$GITHUB_OUTPUT"

      - name: Write promotion and reconciliation summary
        if: always()
        shell: bash
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          IMAGE_PUBLISHED: ${{ steps.publish_tags.outputs.publication_disposition == 'complete' }}
          IMAGE_PUBLICATION_DISPOSITION: ${{ steps.publish_tags.outputs.publication_disposition || 'none' }}
          KNOWN_RELEASE_TAGS_CREATED: ${{ steps.publish_tags.outputs.known_created_tag_count || '0' }}
          IMAGE_VERIFIED: ${{ steps.verify.outputs.image_verified || 'false' }}
          TAG_CREATED: ${{ steps.finalize.outputs.tag_created || 'false' }}
          TAG_VERIFIED: ${{ steps.finalize.outputs.tag_verified || 'false' }}
          GITHUB_RELEASE_CREATED: ${{ steps.release.outputs.github_release_created || 'false' }}
          GITHUB_RELEASE_VERIFIED: ${{ steps.release.outputs.github_release_verified || 'false' }}
          GITHUB_RELEASE_URL: ${{ steps.release.outputs.release_url || 'not-created' }}
          RELEASE_COMPLETE: ${{ steps.release.outputs.release_complete || 'false' }}
          SOURCE_IMAGE_PUBLISHED: ${{ steps.source.outputs.source_image_published || 'false' }}
          SOURCE_IMAGE_REUSED: ${{ steps.source.outputs.source_image_reused || 'false' }}
          SOURCE_MODE: ${{ needs.detect-release.outputs.source_mode }}
          SOURCE_IMAGE_VERIFIED: ${{ steps.verify_source.outputs.source_image_verified || 'false' }}
          ATTEMPT_AUTHORITY_OUTCOME: ${{ steps.attempt.outcome || 'not_attempted' }}
        run: |
          {
            if [[ "$RELEASE_COMPLETE" == "true" ]]; then
              echo "### Engineering release promoted"
            else
              echo "### Engineering release promotion requires reconciliation"
            fi
            echo "- Version: $VERSION"
            echo "- Tag: $RELEASE_TAG"
            echo "- Release commit: $RELEASE_SHA"
            echo "- Publication attempt authority step: $ATTEMPT_AUTHORITY_OUTCOME"
            if [[ -n "$VERSION" ]]; then
              echo "- Attempt record to inspect: refs/tags/engineering-publication-attempt/v${VERSION}"
              echo "- A failed or interrupted claim can have consumed build authority even when no image tag exists. Inspect its exact run and attempt; do not delete the marker or blindly rerun the build."
            fi
            echo "- Version image: ${IMAGE_REPOSITORY}:${VERSION}"
            echo "- Commit image: ${IMAGE_REPOSITORY}:sha-${RELEASE_SHA}"
            echo "- OCI digest: $DIGEST"
            echo "- Architectures: ${{ steps.platforms.outputs.build_platforms }}"
            echo "- Digest-addressed source image: ${IMAGE_REPOSITORY}@${DIGEST}"
            echo "- temporary_registry_tag_created: false"
            echo "- source_image_published: $SOURCE_IMAGE_PUBLISHED"
            echo "- source_image_reused: $SOURCE_IMAGE_REUSED"
            echo "- source_mode: $SOURCE_MODE"
            echo "- source_image_verified: $SOURCE_IMAGE_VERIFIED"
            echo "- image_published: $IMAGE_PUBLISHED"
            echo "- image_publication_disposition: $IMAGE_PUBLICATION_DISPOSITION"
            echo "- known_release_tags_created: $KNOWN_RELEASE_TAGS_CREATED"
            echo "- image_verified: $IMAGE_VERIFIED"
            echo "- manifest_digest: ${DIGEST:-not-published}"
            echo "- tag_created: $TAG_CREATED"
            echo "- tag_verified: $TAG_VERIFIED"
            echo "- github_release_created: $GITHUB_RELEASE_CREATED"
            echo "- github_release_verified: $GITHUB_RELEASE_VERIFIED"
            echo "- github_release_url: $GITHUB_RELEASE_URL"
            echo "- release_complete: $RELEASE_COMPLETE"
            echo "- The publication job did not push, force-push, or overwrite main."
            if [[ "$RELEASE_COMPLETE" == "true" ]]; then
              echo "- Operator action: refresh the Home Assistant add-on store if needed, then update Engineering Beta."
            elif [[ "$TAG_VERIFIED" == "true" ]]; then
              echo "- Failed phase: GitHub Release creation or verification."
              echo "- Recovery: verify the existing annotated tag, release commit, digest, OCI provenance, and canonical release notes before creating or correcting only the GitHub Release. Do not rebuild or overwrite the immutable image or tag."
            elif [[ "$IMAGE_PUBLICATION_DISPOSITION" == "partial" || "$IMAGE_PUBLICATION_DISPOSITION" == "unknown" ]]; then
              echo "- Failed phase: final image tag creation or reconciliation."
              echo "- Recovery: inspect both final tags and their anonymous digests before any retry. The version tag may exist when disposition is unknown. Do not rebuild, overwrite, or continue release finalization until registry state is reconciled."
            elif [[ "$IMAGE_PUBLISHED" == "true" ]]; then
              echo "- Failed phase: tag finalization or later verification."
              echo "- Recovery: verify the existing digest, OCI revision, version, and anonymous access before retrying only tag finalization. Do not rebuild or overwrite the immutable image tag."
            else
              echo "- Failed phase: validation, build, publication, or anonymous verification."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
