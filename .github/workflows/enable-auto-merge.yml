name: Merge owner-authorized pull request

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - closed
      - converted_to_draft
      - edited
      - ready_for_review
      - reopened
      - synchronize

permissions: {}

jobs:
  retire-stale-ready-run:
    name: retire-stale-ready-run
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'synchronize' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'closed' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'converted_to_draft' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'reopened' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'edited' &&
        github.event.changes.base != null &&
        (github.event.pull_request.base.ref == 'main' ||
         github.event.changes.base.ref.from == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: authorized-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Retire the in-flight Ready-authorized run
        run: >-
          echo "The pull-request lifecycle changed; any in-flight
          Ready-authorized merge run has been cancelled. No persistent
          auto-merge request is retained."

  merge-authorized-head:
    name: merge-authorized-head
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'ready_for_review' &&
       github.actor == 'jeter-1' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.actor == 'jeter-1' &&
       github.event.issue.pull_request != null &&
       github.event.comment.body == '@merge')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: authorized-merge-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Resolve trusted pull-request context
        id: context
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          if ! jq -e --arg repository "$REPOSITORY" \
            '.state == "open" and .draft == false and .base.ref == "main" and .head.repo.full_name == $repository' \
            <<< "$pr_json" >/dev/null; then
            echo "::error::The merge request is not an eligible open pull request."
            exit 1
          fi
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha' <<< "$pr_json")"
          if [[ "$EVENT_NAME" == "pull_request_target" && "$head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "::error::The pull-request head moved beyond the authorized Ready event."
            exit 1
          fi
          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.context.outputs.base_sha }}
          persist-credentials: false

      - name: Wait for the exact-head deterministic validate check
        shell: bash
        env:
          AUTHORIZED_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHORIZED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          VALIDATE_MAX_ATTEMPTS: "105"
          VALIDATE_POLL_SECONDS: "20"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$VALIDATE_MAX_ATTEMPTS"); do
            current_pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            if ! jq -e \
              --arg base_sha "$AUTHORIZED_BASE_SHA" \
              --arg head_sha "$AUTHORIZED_HEAD_SHA" \
              '.base.ref == "main" and
               .base.sha == $base_sha and
               .head.sha == $head_sha' \
              <<< "$current_pr_json" >/dev/null; then
              echo "::error::The pull-request base or head moved while deterministic validation was pending."
              exit 1
            fi

            checks_json="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPOSITORY}/commits/${AUTHORIZED_HEAD_SHA}/check-runs?check_name=validate&filter=latest&per_page=100")"
            check_count="$(jq -r '.total_count' <<< "$checks_json")"
            if [[ "$check_count" == "1" ]]; then
              check_binding_count="$(jq -r \
                --arg base_sha "$AUTHORIZED_BASE_SHA" \
                --arg head_sha "$AUTHORIZED_HEAD_SHA" \
                --arg pr_number "$PR_NUMBER" \
                '[.check_runs[0].pull_requests[]? |
                  select((.number | tostring) == $pr_number and
                         .base.ref == "main" and
                         .base.sha == $base_sha and
                         .head.sha == $head_sha)] | length' \
                <<< "$checks_json")"
              check_head_sha="$(jq -r '.check_runs[0].head_sha // ""' <<< "$checks_json")"
              if [[ "$check_head_sha" != "$AUTHORIZED_HEAD_SHA" || "$check_binding_count" != "1" ]]; then
                echo "::error::The deterministic validate check is not bound to the authorized PR base and head."
                exit 1
              fi
              check_status="$(jq -r '.check_runs[0].status' <<< "$checks_json")"
              check_conclusion="$(jq -r '.check_runs[0].conclusion // ""' <<< "$checks_json")"
              if [[ "$check_status" == "completed" && "$check_conclusion" == "success" ]]; then
                break
              fi
              if [[ "$check_status" == "completed" ]]; then
                echo "::error::The exact-head deterministic validate check did not succeed."
                exit 1
              fi
            elif [[ "$check_count" != "0" ]]; then
              echo "::error::The exact-head deterministic validate check was ambiguous."
              exit 1
            fi

            if [[ "$attempt" -eq "$VALIDATE_MAX_ATTEMPTS" ]]; then
              echo "::error::The exact-head deterministic validate check did not finish within 35 minutes."
              exit 1
            fi
            sleep "$VALIDATE_POLL_SECONDS"
          done

      - name: Revalidate Ready authority and merge the exact head
        shell: bash
        env:
          AUTHORIZED_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHORIZED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline?per_page=100" \
            | jq -s 'add' > /tmp/ready-authorization-timeline.json; then
            echo "::error::Could not read pull-request Ready lifecycle evidence."
            exit 1
          fi
          python3 scripts/validate_ready_authorization.py \
            --timeline /tmp/ready-authorization-timeline.json \
            --output /tmp/ready-authorization.json

          if [[ "$(git rev-parse HEAD)" != "$AUTHORIZED_BASE_SHA" ]]; then
            echo "::error::Trusted merge policy did not match the PR base."
            exit 1
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --arg base_sha "$AUTHORIZED_BASE_SHA" \
            --arg head_sha "$AUTHORIZED_HEAD_SHA" \
            '.state == "open" and
             .draft == false and
             .base.ref == "main" and
             .base.sha == $base_sha and
             .head.repo.full_name == $repository and
             .head.sha == $head_sha' \
            <<< "$pr_json" >/dev/null; then
            echo "::error::The pull-request eligibility or exact head changed after Ready authorization."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --merge \
            --match-head-commit "$AUTHORIZED_HEAD_SHA"
          echo "Josh's Ready authorization and deterministic checks are current; pull request #${PR_NUMBER} was merged at ${AUTHORIZED_HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
