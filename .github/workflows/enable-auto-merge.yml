name: Arm authorized pull request auto-merge

on:
  pull_request_target:
    types:
      - ready_for_review
      - synchronize

permissions: {}

jobs:
  revoke-auto-merge-on-head-change:
    name: revoke-auto-merge-on-head-change
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Withdraw Ready authorization from the changed head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(
            gh pr view "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"
          if [[ "$auto_merge_enabled" == "true" ]]; then
            gh pr merge "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --disable-auto
            echo "Auto-merge was disarmed because the pull-request head changed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auto-merge was already disarmed for the changed pull-request head." >> "$GITHUB_STEP_SUMMARY"
          fi

  authorize-auto-merge:
    name: authorize-auto-merge
    if: >-
      github.event.action == 'ready_for_review' &&
      github.actor == 'jeter-1' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Arm GitHub native auto-merge for the authorized exact head
        shell: bash
        env:
          AUTHORIZED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RECEIPT_MAX_ATTEMPTS: "105"
          RECEIPT_POLL_SECONDS: "20"
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ "$current_head_sha" != "$AUTHORIZED_HEAD_SHA" ]]; then
            echo "::error::The pull-request head moved after Ready for review was authorized."
            exit 1
          fi

          for attempt in $(seq 1 "$RECEIPT_MAX_ATTEMPTS"); do
            current_head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [[ "$current_head_sha" != "$AUTHORIZED_HEAD_SHA" ]]; then
              echo "::error::The pull-request head moved while review authorization was pending."
              exit 1
            fi

            receipt_state="$(
              gh api "repos/${REPOSITORY}/commits/${AUTHORIZED_HEAD_SHA}/status" \
                --jq '[.statuses[] | select(.context == "codex-review-receipt")][0].state // "missing"'
            )"
            case "$receipt_state" in
              success)
                break
                ;;
              missing|pending)
                if [[ "$attempt" -eq "$RECEIPT_MAX_ATTEMPTS" ]]; then
                  echo "::error::The exact-head Codex review receipt did not succeed within 35 minutes."
                  exit 1
                fi
                sleep "$RECEIPT_POLL_SECONDS"
                ;;
              failure|error)
                echo "::error::The exact-head Codex review receipt failed."
                exit 1
                ;;
              *)
                echo "::error::The exact-head Codex review receipt returned an unknown state."
                exit 1
                ;;
            esac
          done

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --auto \
            --merge \
            --match-head-commit "$AUTHORIZED_HEAD_SHA"
          echo "Exact-head Codex receipt succeeded; auto-merge is armed for pull request #${PR_NUMBER} at ${AUTHORIZED_HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
