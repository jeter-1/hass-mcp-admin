name: Merge owner-authorized pull request

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - closed
      - converted_to_draft
      - edited
      - ready_for_review
      - reopened
      - synchronize

permissions: {}

jobs:
  retire-stale-ready-run:
    name: retire-stale-ready-run
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'synchronize' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'closed' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'converted_to_draft' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'reopened' &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event.action == 'edited' &&
        github.event.changes.base != null &&
        (github.event.pull_request.base.ref == 'main' ||
         github.event.changes.base.ref.from == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: authorized-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Retire in-flight and inherited Ready authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          auto_merge_enabled="$(
            gh pr view "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"
          if [[ "$auto_merge_enabled" == "true" ]]; then
            gh pr merge "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --disable-auto
            echo "An inherited persistent auto-merge request was disarmed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No inherited persistent auto-merge request was armed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Any in-flight Ready-authorized merge run was cancelled by the shared concurrency group." >> "$GITHUB_STEP_SUMMARY"

  merge-authorized-head:
    name: merge-authorized-head
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.action == 'ready_for_review' &&
       github.actor == 'jeter-1' &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.actor == 'jeter-1' &&
       github.event.issue.pull_request != null &&
       github.event.comment.body == '@merge')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: authorized-merge-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Resolve trusted pull-request context
        id: context
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          if ! jq -e --arg repository "$REPOSITORY" \
            '.state == "open" and .draft == false and .base.ref == "main" and .head.repo.full_name == $repository' \
            <<< "$pr_json" >/dev/null; then
            echo "::error::The merge request is not an eligible open pull request."
            exit 1
          fi
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha' <<< "$pr_json")"
          if [[ "$EVENT_NAME" == "pull_request_target" && "$head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "::error::The pull-request head moved beyond the authorized Ready event."
            exit 1
          fi
          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.context.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for the exact-head deterministic validate check
        shell: bash
        env:
          AUTHORIZED_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHORIZED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          VALIDATE_MAX_ATTEMPTS: "105"
          VALIDATE_POLL_SECONDS: "20"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$VALIDATE_MAX_ATTEMPTS"); do
            current_pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            if ! jq -e \
              --arg base_sha "$AUTHORIZED_BASE_SHA" \
              --arg head_sha "$AUTHORIZED_HEAD_SHA" \
              '.base.ref == "main" and
               .base.sha == $base_sha and
               .head.sha == $head_sha' \
              <<< "$current_pr_json" >/dev/null; then
              echo "::error::The pull-request base or head moved while deterministic validation was pending."
              exit 1
            fi

            if ! provenance_json="$(python3 scripts/validate_ci_provenance.py \
              --repository "$REPOSITORY" --pr-number "$PR_NUMBER" \
              --base-sha "$AUTHORIZED_BASE_SHA" --head-sha "$AUTHORIZED_HEAD_SHA")"; then
              echo "$provenance_json"
              exit 1
            fi
            if [[ "$(jq -r '.status' <<< "$provenance_json")" == "success" ]]; then
              echo "$provenance_json"
              break
            fi

            if [[ "$attempt" -eq "$VALIDATE_MAX_ATTEMPTS" ]]; then
              echo "::error::The exact-head deterministic validate check did not finish within 35 minutes."
              exit 1
            fi
            sleep "$VALIDATE_POLL_SECONDS"
          done

      - name: Revalidate Ready authority and merge the exact head
        shell: bash
        env:
          AUTHORIZED_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHORIZED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/timeline?per_page=100" \
            | jq -s 'add' > /tmp/ready-authorization-timeline.json; then
            echo "::error::Could not read pull-request Ready lifecycle evidence."
            exit 1
          fi
          python3 scripts/validate_ready_authorization.py \
            --timeline /tmp/ready-authorization-timeline.json \
            --output /tmp/ready-authorization.json

          if [[ "$(git rev-parse HEAD)" != "$AUTHORIZED_BASE_SHA" ]]; then
            echo "::error::Trusted merge policy did not match the PR base."
            exit 1
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --arg base_sha "$AUTHORIZED_BASE_SHA" \
            --arg head_sha "$AUTHORIZED_HEAD_SHA" \
            '.state == "open" and
             .draft == false and
             .base.ref == "main" and
             .base.sha == $base_sha and
             .head.repo.full_name == $repository and
             .head.sha == $head_sha' \
            <<< "$pr_json" >/dev/null; then
            echo "::error::The pull-request eligibility or exact head changed after Ready authorization."
            exit 1
          fi

          python3 scripts/validate_ci_provenance.py \
            --repository "$REPOSITORY" --pr-number "$PR_NUMBER" \
            --base-sha "$AUTHORIZED_BASE_SHA" --head-sha "$AUTHORIZED_HEAD_SHA" \
            --require-success

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --merge \
            --match-head-commit "$AUTHORIZED_HEAD_SHA"
          echo "The exact Ready-authorized head was merged; publication requires its verified merge receipt." >> "$GITHUB_STEP_SUMMARY"

      - name: Bind completed merge to publication receipt
        shell: bash
        env:
          AUTHORIZED_BASE_SHA: ${{ steps.context.outputs.base_sha }}
          AUTHORIZED_HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          python3 scripts/publication_handoff.py produce \
            --ready /tmp/ready-authorization.json \
            --output "$RUNNER_TEMP/publication-handoff.json"
          echo "Josh's Ready-authorized merge completed; the receipt binds its actual merge commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain exact publication handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: publication-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-handoff.json
          if-no-files-found: error
          retention-days: 90
