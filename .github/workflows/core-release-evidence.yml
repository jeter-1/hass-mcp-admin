name: Automated Core release evidence
run-name: Core evidence ${{ inputs.core_version || github.event_name }}

# HAMCP-279: CI evidence only; the existing owner-gated workflow owns signing.
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      core_version:
        description: Exact stable release; empty selects newest eligible release
        type: string
        default: ''
      dry_run:
        description: Artifact only; no candidate branch or signing-workflow dispatch
        type: boolean
        default: true
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/core*evidence*.py'
      - 'scripts/core_lane_bindings.py'
      - 'scripts/core_registry_contract_lane.py'
      - 'scripts/real_ha_contract_tests.py'
      - 'scripts/seq15_contract_acceptance.py'
      - 'scripts/alarmo_inspection_contract_acceptance.py'
      - 'ci/core-*.json'
      - 'tests/test_core_release_evidence.py'
      - '.github/workflows/core-release-evidence.yml'
permissions:
  contents: read
concurrency:
  group: core-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.repository == 'jeter-1/hass-mcp-admin')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      refused: ${{ steps.prepare.outputs.refused }}
      release: ${{ steps.prepare.outputs.release }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      registry_exists: ${{ steps.prepare.outputs.registry_exists }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.14'
      - name: Install locked dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock
      - name: Detect and compare exact sources
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RELEASE: ${{ inputs.core_version }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT_NAME" == pull_request ]]; then args+=(--acceptance); fi
          python scripts/core_evidence_workflow.py prepare --directory "$RUNNER_TEMP/core-evidence-input" --release "$REQUESTED_RELEASE" "${args[@]}"
      - name: Retain bounded preparation and comparison
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: core-evidence-preparation
          path: ${{ runner.temp }}/core-evidence-input/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain selected-release attempt marker
        if: github.event_name != 'pull_request' && steps.prepare.outputs.refused != 'true' && steps.prepare.outputs.release != '' && steps.prepare.outputs.release != 'none'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: core-release-attempt-${{ steps.prepare.outputs.release }}
          path: ${{ runner.temp }}/core-evidence-input/predecessor.json
          if-no-files-found: error
          retention-days: 90
  attempt:
    name: core-release-attempt-${{ needs.prepare.outputs.release }}
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.refused != 'true' && needs.prepare.outputs.release != '' && needs.prepare.outputs.release != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo 'Selected-release receipt retained in this job name.'
  refusal:
    # A distinct retained failed job makes refusal terminal and notifies the owner.
    name: core-release-refused-${{ needs.prepare.outputs.release }}
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.refused == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: core-evidence-preparation
          path: ${{ runner.temp }}/core-evidence-input
      - name: Fail once with the binding PR requirement
        run: python3 scripts/core_evidence_workflow.py refuse --directory "$RUNNER_TEMP/core-evidence-input"
  lanes:
    name: Core evidence ${{ matrix.case }} ${{ matrix.ha_version }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      HA_CONTRACT_LANE: ${{ matrix.lane }}
      HA_CONTRACT_VERSION: ${{ matrix.ha_version }}
      HA_CONTRACT_IMAGE: ${{ matrix.ha_image }}
      HA_FIXTURE_WRITER_IMAGE: ghcr.io/home-assistant/home-assistant:2026.7.2@sha256:1476924357b46e80735c13e94232ba5c853cac052e9df4bb28d50fa56348097b
      REAL_HA_EXPECTED_VERSION: ${{ matrix.ha_version }}
      REAL_HA_UPSTREAM_IMAGE: ${{ matrix.ha_mcp_image }}
      REAL_HA_UPSTREAM_VERSION: ${{ matrix.ha_mcp_version }}
      REAL_HA_UPSTREAM_SOURCE_COMMIT: ${{ matrix.ha_mcp_source_commit }}
      REAL_HA_UPSTREAM_SOURCE_SHA256: ${{ matrix.ha_mcp_source_sha256 }}
      REAL_HA_UPSTREAM_CONTAINER: beta25-real-ha-upstream-${{ matrix.lane }}
      REAL_HA_UPSTREAM_PORT: '18086'
      HA_WRITER_CONTAINER: beta25-real-ha-writer-${{ matrix.lane }}
      HA_CONTRACT_CONTAINER: beta25-real-ha-${{ matrix.lane }}
      HA_CONTRACT_NETWORK: beta-rc2-contract-${{ matrix.lane }}
      REAL_HA_SEQ13_LANES: enabled
      REAL_HA_SEQ15_LANES: enabled
      CASE: ${{ matrix.case }}
      CORE_EVIDENCE_CONTEXT_SHA256: ${{ matrix.context_sha256 }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - name: Download same-run binding package
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: core-evidence-preparation
        path: ${{ runner.temp }}/core-evidence-input
    - name: Bind exact context path
      shell: bash
      run: |-
        set -euo pipefail
        echo "CORE_EVIDENCE_CONTEXT=$RUNNER_TEMP/core-evidence-input/${CASE}.json" >> "$GITHUB_ENV"
        echo "CORE_EVIDENCE_RESULTS=$RUNNER_TEMP/core-evidence-results" >> "$GITHUB_ENV"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.12.14
        cache: pip
        cache-dependency-path: hass_mcp_engineering_beta/requirements.lock
    - name: Install Engineering client dependencies
      run: 'python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock'
    - name: Verify run binding before disposable setup
      run: python -c "from scripts.core_release_evidence import context; assert context() is not None"
      env:
        PYTHONPATH: scripts
    - name: Prepare exact source and disposable migration configuration
      shell: bash
      run: |
        set -euo pipefail
        source_archive="$RUNNER_TEMP/ha-mcp-source-$HA_CONTRACT_LANE.tar.gz"
        source_parent="$RUNNER_TEMP/ha-mcp-source-$HA_CONTRACT_LANE"
        contract_dir="$RUNNER_TEMP/beta25-real-ha-$HA_CONTRACT_LANE"
        device_fixture="$contract_dir/beta23-device-fixture.json"
        token_file="$RUNNER_TEMP/beta25-real-ha-$HA_CONTRACT_LANE.token"
        {
          echo "REAL_HA_CONTRACT_DIR=$contract_dir"
          echo "REAL_HA_DEVICE_FIXTURE=$device_fixture"
          echo "REAL_HA_TOKEN_FILE=$token_file"
        } >> "$GITHUB_ENV"
        mkdir -p "$source_parent" "$contract_dir/custom_components"
        curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
          "https://codeload.github.com/homeassistant-ai/ha-mcp/legacy.tar.gz/$REAL_HA_UPSTREAM_SOURCE_COMMIT" \
          --output "$source_archive"
        printf '%s  %s\n' \
          "$REAL_HA_UPSTREAM_SOURCE_SHA256" \
          "$source_archive" | sha256sum --check --strict
        tar -xzf "$source_archive" -C "$source_parent"
        source_root="$(find "$source_parent" -mindepth 1 -maxdepth 1 -type d -print -quit)"
        test -n "$source_root"
        test "$(find "$source_parent" -mindepth 1 -maxdepth 1 -type d | wc -l)" = 1
        printf 'HA_MCP_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
        cp -R \
          tests/fixtures/real_ha_device_migration/custom_components/beta23_device_fixture \
          "$contract_dir/custom_components/"
        cp -R "$source_root/custom_components/ha_mcp_tools" \
          "$contract_dir/custom_components/"
        printf '%s\n' \
          'default_config:' \
          'automation: !include automations.yaml' \
          'http:' \
          '  server_port: 8123' \
          'input_boolean: {}' \
          'input_number: {}' \
          'script: !include scripts.yaml' \
          > "$contract_dir/configuration.yaml"
        : > "$contract_dir/automations.yaml"
        : > "$contract_dir/scripts.yaml"
        # A dedicated bridge isolates this disposable topology from every
        # unrelated container while the explicit loopback-only published
        # ports let the bounded host-side contract client reach Core and
        # ha-mcp. Docker's --internal networks intentionally suppress those
        # published-port routes and therefore cannot serve this acceptance
        # topology.
        docker network create --driver bridge "$HA_CONTRACT_NETWORK"
        expected_network_internal="$(
          python -c 'import json,pathlib; print(str(json.loads(pathlib.Path("tests/fixtures/ha_core_2026_9_disposable_lane.json").read_text(encoding="utf-8"))["docker_internal"]).lower())'
        )"
        actual_network_internal="$(
          docker network inspect --format '{{.Internal}}' "$HA_CONTRACT_NETWORK"
        )"
        test "$actual_network_internal" = "$expected_network_internal"
    - name: Seed seq-15 disposable scene configuration
      shell: bash
      run: |
        set -euo pipefail
        test ! -e "$REAL_HA_CONTRACT_DIR/scenes.yaml"
        printf '%s\n' 'scene: !include scenes.yaml' >> "$REAL_HA_CONTRACT_DIR/configuration.yaml"
        printf '%s\n' '- name: Seq15 Id Assignment' '  entities:' '    input_boolean.seq15_seed_member: "off"' > "$REAL_HA_CONTRACT_DIR/scenes.yaml"
    - name: Persist migration fixture with exact Home Assistant 2026.7.2
      shell: bash
      env:
        REAL_HA_URL: http://127.0.0.1:18123
      run: |
        set -euo pipefail
        docker pull "$HA_FIXTURE_WRITER_IMAGE"
        docker run -d --name "$HA_WRITER_CONTAINER" \
          --network "$HA_CONTRACT_NETWORK" -p 127.0.0.1:18123:8123 \
          -v "$REAL_HA_CONTRACT_DIR:/config" "$HA_FIXTURE_WRITER_IMAGE"
        python scripts/real_ha_contract_tests.py --prepare-migration-fixture
        docker stop --time 30 "$HA_WRITER_CONTAINER"
        docker rm "$HA_WRITER_CONTAINER"
    - name: Stage exact Alarmo and independent interval observer for the Core slot
      if: matrix.alarmo
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REAL_HA_CORE_SOURCE_COMMIT: ${{ matrix.core_source_commit }}
        REAL_HA_CORE_SOURCE_SHA256: ${{ matrix.core_source_sha256 }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/alarmo-169e134f.tar.gz"
        overlay="$RUNNER_TEMP/alarmo-fixture-$HA_CONTRACT_LANE"
        core_archive="$RUNNER_TEMP/alarmo-core-source-$HA_CONTRACT_LANE.tar.gz"
        {
          printf 'REAL_HA_ALARMO_RESULT=%s\n' "$RUNNER_TEMP/alarmo-integration-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_ALARMO_IMAGE_RESULT=%s\n' "$RUNNER_TEMP/alarmo-image-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_ALARMO_CLEANUP_RESULT=%s\n' "$RUNNER_TEMP/alarmo-cleanup-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_ENTITY_METADATA_RESULT=%s\n' "$RUNNER_TEMP/entity-metadata-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_CORE_ARCHIVE=%s\n' "$core_archive"
        } >> "$GITHUB_ENV"
        # Bounded retry on 429/5xx/network only; the download and prepare-archive both check the pinned digest.
        python3 -I -S scripts/github_retry.py download \
          --url 'https://codeload.github.com/nielsfaber/alarmo/tar.gz/169e134f4b70d87aae36ba54a72a398ecc960afd' --output "$archive" \
          --sha256 ab980cb4710024d1a46a9b9e8a254627aeb63096f74cb3b0a612f16f8a231a9d
        python scripts/alarmo_inspection_contract_acceptance.py --prepare-archive "$archive" --destination "$overlay"
        cp -R "$overlay/custom_components/alarmo" "$REAL_HA_CONTRACT_DIR/custom_components/"
        # Only this owned synthetic store needs the migration writer directory permissions.
        python3 -I -S scripts/core_evidence_host.py stage --mode 600 \
          --source "$overlay/.storage/alarmo.storage" --destination "$REAL_HA_CONTRACT_DIR/.storage/alarmo.storage"
        cp -R tests/fixtures/alarmo_interval_observer/custom_components/alarmo_interval_observer \
          "$REAL_HA_CONTRACT_DIR/custom_components/"
        printf '%s\n' 'alarmo_interval_observer:' "  core_version: \"$HA_CONTRACT_VERSION\"" \
          'beta23_device_fixture:' "  baseline_core_version: \"$HA_CONTRACT_VERSION\"" \
          >> "$REAL_HA_CONTRACT_DIR/configuration.yaml"
        printf 'REAL_HA_ALARMO_FIXTURE_RECEIPT=%s\n' "$overlay/alarmo-inspection-fixture.json" >> "$GITHUB_ENV"
        # Committed lane provenance pins the archive digest; older records hash
        # GitHub's legacy.tar.gz form and newer ones its tar.gz form. Only these
        # two fixed forms are tried, and only the exact digest is accepted. A
        # digest mismatch is never retried; each form is re-verified below.
        matched=""
        for form in legacy.tar.gz tar.gz; do
          if python3 -I -S scripts/github_retry.py download \
               --url "https://codeload.github.com/home-assistant/core/$form/$REAL_HA_CORE_SOURCE_COMMIT" --output "$core_archive" \
               --sha256 "$REAL_HA_CORE_SOURCE_SHA256" \
             && printf '%s  %s\n' "$REAL_HA_CORE_SOURCE_SHA256" "$core_archive" | sha256sum --check --strict --status; then
            matched="$form"
            break
          fi
        done
        test -n "$matched"
        echo "Core source archive form: $matched"
    - name: Start disposable exact target Home Assistant Core
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'kitchen_sink:' >> "$REAL_HA_CONTRACT_DIR/configuration.yaml"
        docker pull "$HA_CONTRACT_IMAGE"
        docker run -d --name "$HA_CONTRACT_CONTAINER" \
          --network "$HA_CONTRACT_NETWORK" -p 127.0.0.1:8123:8123 \
          -v "$REAL_HA_CONTRACT_DIR:/config" "$HA_CONTRACT_IMAGE"
        echo "HA contract version: $HA_CONTRACT_VERSION"
        docker image inspect "$HA_CONTRACT_IMAGE" \
          --format='HA contract image digest: {{index .RepoDigests 0}}'
    - name: Bind the Core slot's disposable image and source
      if: matrix.alarmo
      run: python scripts/alarmo_inspection_contract_acceptance.py --verify-publication
    - name: Verify exact ha-mcp component inside disposable Home Assistant
      shell: bash
      run: |
        set -euo pipefail
        source_root="$HA_MCP_SOURCE_ROOT"
        docker pull "$REAL_HA_UPSTREAM_IMAGE"
        docker cp "$source_root" \
          "$HA_CONTRACT_CONTAINER:/tmp/ha-mcp-source"
        docker cp scripts/disposable_ha_websockets_probe.py \
          "$HA_CONTRACT_CONTAINER:/tmp/disposable_ha_websockets_probe.py"
        docker exec "$HA_CONTRACT_CONTAINER" python \
          /tmp/disposable_ha_websockets_probe.py \
          --source-root /tmp/ha-mcp-source \
          --upstream-version "$REAL_HA_UPSTREAM_VERSION" \
          --output /tmp/ha-mcp-disposable-ha.json
        docker cp \
          "$HA_CONTRACT_CONTAINER:/tmp/ha-mcp-disposable-ha.json" \
          "$RUNNER_TEMP/ha-mcp-$REAL_HA_UPSTREAM_VERSION-disposable-$HA_CONTRACT_LANE.json"
    - name: Stage seq-13 contract evidence paths
      if: matrix.alarmo && env.REAL_HA_SEQ13_LANES == 'enabled'
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'REAL_HA_LABEL_REGISTRY_RESULT=%s\n' "$RUNNER_TEMP/seq13-label-registry-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_AVAILABILITY_EXPOSURE_RESULT=%s\n' "$RUNNER_TEMP/seq13-availability-exposure-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_CONFIGURATION_DELETE_RESULT=%s\n' "$RUNNER_TEMP/seq13-configuration-delete-$HA_CONTRACT_LANE.json"
        } >> "$GITHUB_ENV"
    - name: Stage seq-15 contract evidence paths
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'REAL_HA_HELPER_OPTIONS_RESULT=%s\n' "$RUNNER_TEMP/seq15-helper-options-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_INPUT_SELECT_OPTION_RESULT=%s\n' "$RUNNER_TEMP/seq15-input-select-option-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_SCRIPT_TRACES_RESULT=%s\n' "$RUNNER_TEMP/seq15-script-traces-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_DASHBOARD_METADATA_RESULT=%s\n' "$RUNNER_TEMP/seq15-dashboard-metadata-$HA_CONTRACT_LANE.json"
          printf 'REAL_HA_SCENE_CONFIGURATION_RESULT=%s\n' "$RUNNER_TEMP/seq15-scene-configuration-$HA_CONTRACT_LANE.json"
        } >> "$GITHUB_ENV"
    - name: Run real Home Assistant contracts
      env:
        REAL_HA_URL: http://127.0.0.1:8123
      run: python scripts/core_evidence_lanes.py run
    - name: Sanitize and remove disposable Home Assistant
      if: always()
      shell: bash
      run: |
        docker rm -f "$REAL_HA_UPSTREAM_CONTAINER" >/dev/null 2>&1 || true
        docker rm -f "$HA_CONTRACT_CONTAINER" >/dev/null 2>&1 || true
        docker rm -f "$HA_WRITER_CONTAINER" >/dev/null 2>&1 || true
        rm -f "$REAL_HA_TOKEN_FILE"
        python3 -I -S scripts/core_evidence_host.py remove-owned-dir --directory "$REAL_HA_CONTRACT_DIR"
        docker network rm "$HA_CONTRACT_NETWORK" >/dev/null 2>&1 || true
    - name: Verify all owned containers and network removed
      if: always()
      run: python scripts/core_evidence_lanes.py cleanup
    - name: Build unsigned candidate from passing groups
      id: candidate
      run: python scripts/core_evidence_workflow.py assemble --directory "$RUNNER_TEMP/core-evidence-input" --receipts "$CORE_EVIDENCE_RESULTS"
        --case "$CASE"
    - name: Retain group receipts and unsigned candidate
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: core-evidence-${{ matrix.case }}
        path: ${{ runner.temp }}/core-evidence-results/
        if-no-files-found: error
        retention-days: 14
    if: needs.prepare.outputs.run == 'true'
    permissions:
      contents: read
    concurrency:
      group: core-evidence-lanes-${{ needs.prepare.outputs.release }}-${{ matrix.case }}-${{ github.event_name == 'pull_request'
        && github.event.pull_request.number || 'main' }}
      cancel-in-progress: false
    outputs:
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
      evidence_sha256: ${{ steps.candidate.outputs.evidence_sha256 }}
  handoff:
    needs: [prepare, lanes]
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'jeter-1/hass-mcp-admin' &&
      github.event_name != 'pull_request' && needs.prepare.outputs.registry_exists == 'true' &&
      needs.prepare.outputs.run == 'true' &&
      (github.event_name == 'schedule' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_VERSION: ${{ needs.prepare.outputs.release }}
      DRY_RUN: 'false'
      CANDIDATE_SHA256: ${{ needs.lanes.outputs.candidate_sha256 }}
      EVIDENCE_SHA256: ${{ needs.lanes.outputs.evidence_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: core-evidence-release
          path: ${{ runner.temp }}/handoff
      - name: Push fixed candidate branch and dispatch the existing owner gate
        run: python3 scripts/core_evidence_handoff.py "$RUNNER_TEMP/handoff/candidate"
