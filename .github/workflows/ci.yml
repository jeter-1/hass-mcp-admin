name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hass_mcp_engineering_beta/requirements.txt
            tests/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt -r tests/requirements.txt
      - name: Regenerate historical compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail
          historical_sha="5c7eebf962837f85f2309b1b5099401fb075cd6e"
          historical_worktree="$RUNNER_TEMP/beta6-fixture-source"
          generated="$RUNNER_TEMP/beta6-generated-fixtures"
          cleanup() {
            git worktree remove "$historical_worktree" >/dev/null 2>&1 || true
            git worktree prune
          }
          trap cleanup EXIT
          git worktree add --detach "$historical_worktree" "$historical_sha"
          PYTHONDONTWRITEBYTECODE=1 \
            python scripts/generate_beta6_prohibited_compatibility_fixtures.py \
            --beta6-worktree "$historical_worktree" \
            --output-dir "$generated" \
            --generated-at 2026-08-02T22:00:00Z
          for fixture in \
            beta6_prohibited_superseded_contract_v2_a.json \
            beta6_prohibited_superseded_contract_v2_b.json \
            beta6_prohibited_superseded_contract_v2_provenance.json \
            beta6_legacy_prohibited_expired_automation_a.json \
            beta6_legacy_prohibited_expired_automation_b.json \
            beta6_legacy_prohibited_expired_automation_provenance.json
          do
            cmp "$generated/$fixture" "tests/fixtures/$fixture"
          done
      - name: Audit Engineering dependencies
        run: python -m pip_audit --strict --progress-spinner off --requirement hass_mcp_engineering_beta/requirements.txt
      - name: Compile Python
        run: python -m compileall -q hass_mcp_admin hass_mcp_engineering_beta tests
      - name: Validate deployment metadata
        run: python scripts/validate_addon_metadata.py --repo-root . --base-ref origin/main
      - name: Validate reviewed upstream registry evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_upstream_read_release.py validate
          python scripts/review_upstream_read_release.py generate \
            --output "$RUNNER_TEMP/generated-upstream-release-registry.json"
          python scripts/review_upstream_read_release.py registry-diff \
            --expected hass_mcp_engineering_beta/ha_mcp_engineering/upstream_release_registry.json \
            --actual "$RUNNER_TEMP/generated-upstream-release-registry.json"
      - name: Validate PowerShell deployment script syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "scripts/deploy-beta.ps1")) | Out-Null'
      - name: Run Engineering unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate add-on YAML
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('hass_mcp_admin/config.yaml').read_text()); yaml.safe_load(pathlib.Path('hass_mcp_engineering_beta/config.yaml').read_text()); yaml.safe_load(pathlib.Path('repository.yaml').read_text())"
      - name: Set up QEMU for declared RC architectures
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64,arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build retired stable-v1 image packaging
        run: docker build -t hass-mcp-admin:test ./hass_mcp_admin
      - name: Build beta image
        shell: bash
        run: |
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            -t hass-mcp-engineering-beta:test \
            ./hass_mcp_engineering_beta
          docker run --rm --entrypoint python \
            -e "EXPECTED_BUILD_SHA=$build_sha" \
            -e "EXPECTED_BUILD_VERSION=$beta_version" \
            hass-mcp-engineering-beta:test -c \
            'import os; from ha_mcp_engineering.version import BUILD_DIRTY, BUILD_SHA, SERVER_VERSION; assert BUILD_SHA == os.environ["EXPECTED_BUILD_SHA"]; assert SERVER_VERSION == os.environ["EXPECTED_BUILD_VERSION"]; assert BUILD_DIRTY is False'
      - name: Validate beta image on every declared architecture without pushing
        shell: bash
        run: |
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker buildx build \
            --platform "linux/amd64,linux/arm64,linux/arm/v7" \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            --output=type=cacheonly \
            ./hass_mcp_engineering_beta

  real-ha-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HA_CONTRACT_VERSION: "2026.7.2"
      HA_CONTRACT_IMAGE: "ghcr.io/home-assistant/home-assistant:2026.7.2@sha256:1476924357b46e80735c13e94232ba5c853cac052e9df4bb28d50fa56348097b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.txt
      - name: Install Engineering client dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt
      - name: Start disposable pinned Home Assistant Core
        shell: bash
        run: |
          set -euo pipefail
          contract_dir="$RUNNER_TEMP/beta25-real-ha"
          mkdir -p "$contract_dir"
          printf '%s\n' \
            'default_config:' \
            'automation: !include automations.yaml' \
            'input_boolean: {}' \
            'input_number: {}' \
            'script: !include scripts.yaml' \
            > "$contract_dir/configuration.yaml"
          : > "$contract_dir/automations.yaml"
          : > "$contract_dir/scripts.yaml"
          docker pull "$HA_CONTRACT_IMAGE"
          docker run -d --name beta25-real-ha -p 8123:8123 \
            -v "$contract_dir:/config" "$HA_CONTRACT_IMAGE"
          echo "HA contract version: $HA_CONTRACT_VERSION"
          docker image inspect "$HA_CONTRACT_IMAGE" \
            --format='HA contract image digest: {{index .RepoDigests 0}}'
      - name: Run real Home Assistant contracts
        env:
          REAL_HA_URL: http://127.0.0.1:8123
        run: python scripts/real_ha_contract_tests.py
      - name: Sanitize and remove disposable Home Assistant
        if: always()
        shell: bash
        run: |
          docker rm -f beta25-real-ha >/dev/null 2>&1 || true
          sudo rm -rf "$RUNNER_TEMP/beta25-real-ha"

  prepare_exact_image_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reviewed-registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact-image matrix from reviewed registry
        id: reviewed-registry
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/review_upstream_read_release.py ci-matrix)"
          test -n "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  exact-image-read-gateway:
    needs: prepare_exact_image_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_exact_image_matrix.outputs.matrix) }}
    env:
      UPSTREAM_IMAGE: ${{ matrix.upstream_image }}
      UPSTREAM_VERSION: ${{ matrix.upstream_version }}
      EXPECTED_IMAGE_INDEX_DIGEST: ${{ matrix.image_index_digest }}
      EXPECTED_IMAGE_REVISION: ${{ matrix.image_revision }}
      EXPECTED_ARCHITECTURE_IMAGE_DIGESTS: ${{ toJSON(matrix.architecture_image_digests) }}
      ENGINEERING_ACCESS_SECRET: synthetic-engineering-access-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.txt
      - name: Install transport acceptance dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt
      - name: Start synthetic read-only Home Assistant fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fake_ha_read_gateway_contract_server.py \
            --port 18123 --upstream-version "$UPSTREAM_VERSION" \
            > "$RUNNER_TEMP/read-gateway-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/read-gateway-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18123/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Start exact reviewed ha-mcp image
        shell: bash
        run: |
          set -euo pipefail
          resolved_index_digest="$(
            docker buildx imagetools inspect "$UPSTREAM_IMAGE" |
              sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' |
              head -n 1
          )"
          test "$resolved_index_digest" = "$EXPECTED_IMAGE_INDEX_DIGEST"
          docker buildx imagetools inspect "$UPSTREAM_IMAGE" --raw \
            > "$RUNNER_TEMP/reviewed-upstream-index.json"
          python3 - "$RUNNER_TEMP/reviewed-upstream-index.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = json.loads(
              os.environ["EXPECTED_ARCHITECTURE_IMAGE_DIGESTS"]
          )
          observed = {}
          for item in manifest.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              variant = platform.get("variant")
              if not isinstance(os_name, str) or not isinstance(
                  architecture, str
              ):
                  continue
              if os_name == "unknown" and architecture == "unknown":
                  continue
              name = f"{os_name}/{architecture}"
              if isinstance(variant, str) and variant:
                  name += f"/{variant}"
              observed[name] = item.get("digest")
          if observed != expected:
              raise SystemExit(
                  "reviewed platform digest map does not match OCI index"
              )
          PY
          docker pull "$UPSTREAM_IMAGE"
          test "$(
            docker image inspect "$UPSTREAM_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
          )" = "$UPSTREAM_VERSION"
          test "$(
            docker image inspect "$UPSTREAM_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )" = "$EXPECTED_IMAGE_REVISION"
          docker run --detach --rm --network host --name exact-read-gateway-upstream \
            --read-only --tmpfs /tmp --tmpfs /home/mcpuser/.ha-mcp \
            -e HOMEASSISTANT_URL=http://127.0.0.1:18123 \
            -e HOMEASSISTANT_TOKEN=synthetic-read-gateway-token \
            -e MCP_HOST=127.0.0.1 -e MCP_PORT=18086 \
            -e MCP_SECRET_PATH=/synthetic-upstream-secret/mcp \
            -e HA_MCP_DISABLE_SETTINGS_UI=true \
            "$UPSTREAM_IMAGE" ha-mcp-web
          for attempt in $(seq 1 60); do
            status="$(curl --max-time 1 --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18086/synthetic-upstream-secret/mcp || true)"
            test "$status" != "000" && exit 0
            sleep 1
          done
          exit 1
      - name: Build and start Engineering through its production discovery path
        shell: bash
        run: |
          set -euo pipefail
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            -t engineering-read-gateway-acceptance:test \
            ./hass_mcp_engineering_beta
          mkdir -p "$RUNNER_TEMP/read-gateway-data"
          printf '%s\n' \
            '{' \
            '  "access_secret": "synthetic-engineering-access-secret",' \
            '  "audit_enabled": true,' \
            '  "prewarm_enabled": false,' \
            '  "upstream_trust_registry_enabled": false' \
            '}' > "$RUNNER_TEMP/read-gateway-data/options.json"
          docker run --detach --rm --network host \
            --add-host abcdef12-ha-mcp:127.0.0.1 \
            --name engineering-read-gateway-acceptance \
            -v "$RUNNER_TEMP/read-gateway-data:/data" \
            -e HA_URL=http://127.0.0.1:18123 \
            -e HA_TOKEN=synthetic-read-gateway-token \
            -e MCP_PORT=18100 -e APPROVAL_INGRESS_PORT=18110 \
            -e UPSTREAM_DASHBOARD_MCP_URL=http://abcdef12-ha-mcp:18086/synthetic-upstream-secret/mcp \
            engineering-read-gateway-acceptance:test
          for attempt in $(seq 1 90); do
            status="$(curl --max-time 1 --silent --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:18100/ready || true)"
            test "$status" = "200" && exit 0
            sleep 1
          done
          exit 1
      - name: Run exact-image authenticated gateway acceptance
        if: always()
        shell: bash
        run: |
          python scripts/exact_image_read_gateway_acceptance.py \
            --upstream-endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --configured-upstream-endpoint http://abcdef12-ha-mcp:18086/synthetic-upstream-secret/mcp \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --ha-url http://127.0.0.1:18123 \
            --ha-token synthetic-read-gateway-token \
            --output "$RUNNER_TEMP/exact-image-read-gateway-result.json"
      - name: Verify deterministic upstream contract capture
        if: always()
        shell: bash
        run: |
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --output "$RUNNER_TEMP/upstream-contract-capture-1.json"
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --output "$RUNNER_TEMP/upstream-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/upstream-contract-capture-1.json" \
            "$RUNNER_TEMP/upstream-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/upstream-contract-capture-1.json" \
            "docs/evidence/upstream-read-compatibility/ha-mcp-${UPSTREAM_VERSION}.json"
      - name: Upload bounded exact-image result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-image-read-gateway-${{ matrix.upstream_version }}
          path: |
            ${{ runner.temp }}/exact-image-read-gateway-result.json
            ${{ runner.temp }}/upstream-contract-capture-1.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable exact-image environment
        if: always()
        shell: bash
        run: |
          docker rm -f engineering-read-gateway-acceptance exact-read-gateway-upstream >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/read-gateway-ha.pid"; then
            kill "$(cat "$RUNNER_TEMP/read-gateway-ha.pid")" >/dev/null 2>&1 || true
          fi
          sudo rm -rf "$RUNNER_TEMP/read-gateway-data"

  exact-addon-runtime-acceptance:
    name: Exact ha-mcp 8.0.0 add-on runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADDON_AMD64_IMAGE: ghcr.io/homeassistant-ai/ha-mcp-addon-amd64@sha256:693ecd5c68f98e64111fbf58e02547a51b2168a942056684dbe262c550aff9cd
      ADDON_AMD64_INDEX_DIGEST: sha256:693ecd5c68f98e64111fbf58e02547a51b2168a942056684dbe262c550aff9cd
      ADDON_AMD64_MANIFEST_DIGEST: sha256:65856752c37e4c1f9093060fbbc4a1a826cac1cbd6a76e856af5f5672a96c404
      ADDON_ARM64_IMAGE: ghcr.io/homeassistant-ai/ha-mcp-addon-aarch64@sha256:150ee09078919a47db19639deaa8c27ec064390054e27b4e618f82eea9cf7f50
      ADDON_ARM64_INDEX_DIGEST: sha256:150ee09078919a47db19639deaa8c27ec064390054e27b4e618f82eea9cf7f50
      ADDON_ARM64_MANIFEST_DIGEST: sha256:a4bc83ed6f1a531d445e8107c77b7e7d5289d25510316dc6698d65383bf2fedb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.txt
      - name: Install exact add-on runtime acceptance dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt
      - name: Verify immutable add-on indexes and platform manifests
        shell: bash
        run: |
          set -euo pipefail
          verify_index() {
            local image="$1"
            local expected_index="$2"
            local expected_platform="$3"
            local expected_manifest="$4"
            local output="$5"
            local resolved_index
            resolved_index="$(
              docker buildx imagetools inspect "$image" |
                sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' |
                head -n 1
            )"
            test "$resolved_index" = "$expected_index"
            docker buildx imagetools inspect "$image" --raw > "$output"
            python3 - "$output" "$expected_platform" "$expected_manifest" <<'PY'
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_platform = sys.argv[2]
          expected_digest = sys.argv[3]
          observed = {}
          for item in value.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              if not isinstance(os_name, str) or not isinstance(
                  architecture, str
              ):
                  continue
              name = f"{os_name}/{architecture}"
              variant = platform.get("variant")
              if isinstance(variant, str) and variant:
                  name += f"/{variant}"
              observed[name] = item.get("digest")
          if observed.get(expected_platform) != expected_digest:
              raise SystemExit(
                  "immutable add-on platform manifest did not match evidence"
              )
          PY
          }
          verify_index \
            "$ADDON_AMD64_IMAGE" \
            "$ADDON_AMD64_INDEX_DIGEST" \
            linux/amd64 \
            "$ADDON_AMD64_MANIFEST_DIGEST" \
            "$RUNNER_TEMP/addon-amd64-index.json"
          verify_index \
            "$ADDON_ARM64_IMAGE" \
            "$ADDON_ARM64_INDEX_DIGEST" \
            linux/arm64 \
            "$ADDON_ARM64_MANIFEST_DIGEST" \
            "$RUNNER_TEMP/addon-arm64-index.json"
      - name: Start synthetic Home Assistant contract fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fake_ha_read_gateway_contract_server.py \
            --port 18123 --upstream-version 8.0.0 \
            > "$RUNNER_TEMP/addon-runtime-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/addon-runtime-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18123/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Execute immutable ha-mcp 8.0.0 add-on runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ADDON_AMD64_IMAGE"
          test "$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{index .Config.Labels "io.hass.version"}}'
          )" = "8.0.0"
          docker run --detach --rm --network host --read-only \
            --name exact-addon-runtime-upstream \
            --tmpfs /tmp \
            --entrypoint /app/.venv/bin/ha-mcp-web \
            -e ENABLE_TOOL_SECURITY_POLICIES=true \
            -e HA_MCP_BUILD_VERSION=8.0.0 \
            -e HA_MCP_CONFIG_DIR=/tmp/ha-mcp-config \
            -e HA_MCP_DISABLE_SETTINGS_UI=1 \
            -e HOME=/tmp/ha-mcp-home \
            -e HOMEASSISTANT_TOKEN=synthetic-read-gateway-token \
            -e HOMEASSISTANT_URL=http://127.0.0.1:18123 \
            -e MCP_HOST=127.0.0.1 \
            -e MCP_PORT=18087 \
            -e MCP_SECRET_PATH=/beta14-synthetic/mcp \
            -e SUPERVISOR_TOKEN=synthetic-read-gateway-token \
            "$ADDON_AMD64_IMAGE"
          for attempt in $(seq 1 60); do
            status="$(curl --max-time 1 --silent --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:18087/beta14-synthetic/mcp || true)"
            test "$status" != "000" && exit 0
            sleep 1
          done
          exit 1
      - name: Run planning-only exact add-on runtime acceptance
        shell: bash
        run: |
          python scripts/exact_addon_runtime_acceptance.py \
            --upstream-endpoint http://127.0.0.1:18087/beta14-synthetic/mcp \
            --configured-upstream-endpoint http://abcdef12-ha-mcp:18087/beta14-synthetic/mcp \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --ha-url http://127.0.0.1:18123 \
            --ha-token synthetic-read-gateway-token \
            --expected-image-index-digest "$ADDON_AMD64_INDEX_DIGEST" \
            --expected-image-manifest-digest "$ADDON_AMD64_MANIFEST_DIGEST" \
            --output "$RUNNER_TEMP/exact-addon-runtime-result.json"
      - name: Upload bounded exact add-on runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-ha-mcp-8.0.0-addon-runtime
          path: ${{ runner.temp }}/exact-addon-runtime-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable exact add-on runtime environment
        if: always()
        shell: bash
        run: |
          docker rm -f exact-addon-runtime-upstream >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/addon-runtime-ha.pid"; then
            kill "$(cat "$RUNNER_TEMP/addon-runtime-ha.pid")" >/dev/null 2>&1 || true
          fi
