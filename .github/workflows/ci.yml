name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_call:
    outputs:
      source_validation:
        description: Exact same-run successful full-discovery receipt; complete CI success is separately required.
        value: ${{ jobs.validate_source.outputs.source_validation }}

permissions:
  contents: read

# Standalone PR CI may replace only earlier runs for that PR. Reusable calls
# inherit the caller's github context; isolate their pending and running work.
concurrency:
  group: >-
    ${{ format('hass-mcp-ci-{0}-{1}', github.repository,
        github.event_name == 'pull_request' &&
        github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
        format('pr-{0}', github.event.pull_request.number) ||
        format('run-{0}-{1}', github.run_id, github.run_attempt)) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) }}

jobs:
  validate:
    name: validate
    if: ${{ always() }}
    needs:
      - validate_prerequisites
      - validate_source
      - validate_packaging
      - real-ha-contract-tests
      - prepare_exact_image_matrix
      - exact-image-read-gateway
      - exact-addon-runtime-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job family to succeed
        if: ${{ always() }}
        shell: python
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os
          import sys

          required_jobs = (
              "validate_prerequisites",
              "validate_source",
              "validate_packaging",
              "real-ha-contract-tests",
              "prepare_exact_image_matrix",
              "exact-image-read-gateway",
              "exact-addon-runtime-acceptance",
          )
          try:
              results = json.loads(os.environ["REQUIRED_JOB_RESULTS"])
          except (KeyError, ValueError):
              sys.exit("Required CI refused: job results are unavailable or malformed.")
          if not isinstance(results, dict) or set(results) != set(required_jobs):
              sys.exit("Required CI refused: job result set does not match required jobs.")
          unsuccessful = [
              name for name in required_jobs
              if not isinstance(results[name], dict)
              or results[name].get("result") != "success"
          ]
          if unsuccessful:
              sys.exit("Required CI did not succeed: " + ", ".join(unsuccessful))
          print("All required CI job families succeeded.")

      - name: Refuse workflow cancellation
        if: ${{ cancelled() }}
        shell: python
        run: |
          import sys
          sys.exit("Required CI refused: workflow was cancelled.")

  validate_prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            hass_mcp_engineering_beta/requirements.lock
            tests/requirements.lock
      - name: Install dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r tests/requirements.lock
      - name: Regenerate historical compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail
          historical_sha="5c7eebf962837f85f2309b1b5099401fb075cd6e"
          historical_worktree="$RUNNER_TEMP/beta6-fixture-source"
          generated="$RUNNER_TEMP/beta6-generated-fixtures"
          cleanup() {
            git worktree remove "$historical_worktree" >/dev/null 2>&1 || true
            git worktree prune
          }
          trap cleanup EXIT
          git worktree add --detach "$historical_worktree" "$historical_sha"
          PYTHONDONTWRITEBYTECODE=1 \
            python scripts/generate_beta6_prohibited_compatibility_fixtures.py \
            --beta6-worktree "$historical_worktree" \
            --output-dir "$generated" \
            --generated-at 2026-08-02T22:00:00Z
          for fixture in \
            beta6_prohibited_superseded_contract_v2_a.json \
            beta6_prohibited_superseded_contract_v2_b.json \
            beta6_prohibited_superseded_contract_v2_provenance.json \
            beta6_legacy_prohibited_expired_automation_a.json \
            beta6_legacy_prohibited_expired_automation_b.json \
            beta6_legacy_prohibited_expired_automation_provenance.json
          do
            cmp "$generated/$fixture" "tests/fixtures/$fixture"
          done
      - name: Verify committed build inputs
        run: python hass_mcp_engineering_beta/build_inputs.py source
      - name: Audit Engineering dependencies
        run: python -m pip_audit --strict --progress-spinner off --requirement hass_mcp_engineering_beta/requirements.lock
      - name: Compile Python
        run: python -m compileall -q hass_mcp_admin hass_mcp_engineering_beta tests
      - name: Validate deployment metadata
        run: python scripts/validate_addon_metadata.py --repo-root . --base-ref origin/main
      - name: Validate exact materialized release transition
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(
            git show origin/main:hass_mcp_engineering_beta/config.yaml \
              | sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p'
          )"
          candidate_version="$(
            sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' \
              hass_mcp_engineering_beta/config.yaml
          )"
          if [[ -z "$base_version" || -z "$candidate_version" ]]; then
            echo "::error::Unable to derive the base-to-head Engineering version transition."
            exit 1
          fi
          if [[ "$candidate_version" != "$base_version" ]]; then
            python scripts/promote_next_release.py \
              --validate-transition "$base_version" "$candidate_version"
          else
            echo "Engineering version is unchanged at ${candidate_version}."
          fi
      - name: Validate staged promotion candidate
        run: >-
          python scripts/validate_promotion_candidate.py
          --repo-root .
          --require-materialized
      - name: Validate reviewed upstream registry evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_upstream_read_release.py validate
          python scripts/review_upstream_read_release.py generate \
            --output "$RUNNER_TEMP/generated-upstream-release-registry.json"
          python scripts/review_upstream_read_release.py registry-diff \
            --expected hass_mcp_engineering_beta/ha_mcp_engineering/upstream_release_registry.json \
            --actual "$RUNNER_TEMP/generated-upstream-release-registry.json"
      - name: Validate PowerShell deployment script syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "scripts/deploy-beta.ps1")) | Out-Null'
      - name: Validate add-on YAML
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('hass_mcp_admin/config.yaml').read_text()); yaml.safe_load(pathlib.Path('hass_mcp_engineering_beta/config.yaml').read_text()); yaml.safe_load(pathlib.Path('repository.yaml').read_text())"

  validate_source:
    needs: validate_prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      source_validation: ${{ steps.source_receipt.outputs.source_validation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            hass_mcp_engineering_beta/requirements.lock
            tests/requirements.lock
      - name: Install dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r tests/requirements.lock
      - name: Run Engineering unit tests
        id: unit_tests
        run: python -m unittest discover -s tests -v
      - name: Bind successful full-discovery identity
        id: source_receipt
        env:
          FULL_SUITE_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: python scripts/publication_validation.py record --github-output "$GITHUB_OUTPUT"

  validate_packaging:
    needs: validate_prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Set up QEMU for declared RC architectures
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build retired stable-v1 image packaging
        run: docker build -t hass-mcp-admin:test ./hass_mcp_admin
      - name: Build beta image
        shell: bash
        run: |
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            -t hass-mcp-engineering-beta:test \
            ./hass_mcp_engineering_beta
          docker run --rm --entrypoint python \
            -e "EXPECTED_BUILD_SHA=$build_sha" \
            -e "EXPECTED_BUILD_VERSION=$beta_version" \
            hass-mcp-engineering-beta:test -c \
            'import os; from ha_mcp_engineering.version import BUILD_DIRTY, BUILD_SHA, SERVER_VERSION; assert BUILD_SHA == os.environ["EXPECTED_BUILD_SHA"]; assert SERVER_VERSION == os.environ["EXPECTED_BUILD_VERSION"]; assert BUILD_DIRTY is False'
      - name: Validate beta image on every declared architecture without pushing
        shell: bash
        run: |
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p "$RUNNER_TEMP/build-input-evidence"
          for architecture in amd64 arm64; do
            platform="linux/$architecture"
            image="hass-mcp-engineering-beta:inputs-$architecture"
            docker buildx build \
              --platform "$platform" \
              --build-arg "BUILD_VERSION=$beta_version" \
              --build-arg "HAMCP_BUILD_SHA=$build_sha" \
              --build-arg "HAMCP_BUILD_TIME=$build_time" \
              --build-arg "HAMCP_BUILD_DIRTY=false" \
              --load --tag "$image" ./hass_mcp_engineering_beta
            container="engineering-build-smoke-$architecture"
            trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
            timeout --signal=TERM --kill-after=10s 120s docker run --rm \
              --name "$container" --platform "$platform" --network none \
              --read-only --cap-drop ALL --security-opt no-new-privileges \
              --entrypoint python "$image" /app/build_inputs.py smoke \
              --expected-platform "$platform" \
              > "$RUNNER_TEMP/build-input-evidence/$architecture.json"
            trap - EXIT
          done
          printf '%s\n' "$build_sha" > "$RUNNER_TEMP/build-input-evidence/source-sha.txt"
      - name: Retain per-architecture build input evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: engineering-build-inputs
          path: ${{ runner.temp }}/build-input-evidence/
          if-no-files-found: error
          retention-days: 14

  real-ha-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ha-2026-7-2
            ha_version: "2026.7.2"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.7.2@sha256:1476924357b46e80735c13e94232ba5c853cac052e9df4bb28d50fa56348097b"
            ha_mcp_version: "8.2.0"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.2.0@sha256:dbcfc0ee8ad02d2190ebde69e5cc6167175c79608bbf1d55cff9034e256face1"
            ha_mcp_source_commit: 098540ba22d495fdb1701daf830d54762350fd46
            ha_mcp_source_sha256: 945faf6eb7a10c9b687fd6c45f50b09d997d41f5549784f8835f2b29fda181ff
          - lane: ha-2026-8-0
            ha_version: "2026.8.0"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.8.0@sha256:a21689ef0510df9760ee11bab4d6b2fef3ed5c1a29ed9c3224271597a23729eb"
            ha_mcp_version: "8.2.0"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.2.0@sha256:dbcfc0ee8ad02d2190ebde69e5cc6167175c79608bbf1d55cff9034e256face1"
            ha_mcp_source_commit: 098540ba22d495fdb1701daf830d54762350fd46
            ha_mcp_source_sha256: 945faf6eb7a10c9b687fd6c45f50b09d997d41f5549784f8835f2b29fda181ff
          - lane: ha-2026-8-1
            ha_version: "2026.8.1"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.8.1@sha256:6340a3de3917a9b19368e767310a96dd090f6a19aca8aeadf87fd1145cec9682"
            ha_mcp_version: "8.2.0"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.2.0@sha256:dbcfc0ee8ad02d2190ebde69e5cc6167175c79608bbf1d55cff9034e256face1"
            ha_mcp_source_commit: 098540ba22d495fdb1701daf830d54762350fd46
            ha_mcp_source_sha256: 945faf6eb7a10c9b687fd6c45f50b09d997d41f5549784f8835f2b29fda181ff
          - lane: ha-2026-9-0
            ha_version: "2026.9.0"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.9.0@sha256:372d991e58882a1d8c68c07e9aa3f3b509276e695355f73ccdb03baa70407293"
            ha_mcp_version: "8.4.3"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.4.3@sha256:d5cea47a0115e5d161c2b319ee637b1b0a5bcfafe1597cb490299bbbc6329456"
            ha_mcp_source_commit: eac7a3aa7063432e9af17e7d7726040e909c7b8f
            ha_mcp_source_sha256: 4504b0f086f20b21350269ed330886ed5398a96a671a30af97444ece412cf3cc
          - lane: ha-2026-9-1
            ha_version: "2026.9.1"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.9.1@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918"
            ha_mcp_version: "8.4.3"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.4.3@sha256:d5cea47a0115e5d161c2b319ee637b1b0a5bcfafe1597cb490299bbbc6329456"
            ha_mcp_source_commit: eac7a3aa7063432e9af17e7d7726040e909c7b8f
            ha_mcp_source_sha256: 4504b0f086f20b21350269ed330886ed5398a96a671a30af97444ece412cf3cc
          - lane: ha-2026-9-2
            ha_version: "2026.9.2"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe"
            ha_mcp_version: "8.4.3"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.4.3@sha256:d5cea47a0115e5d161c2b319ee637b1b0a5bcfafe1597cb490299bbbc6329456"
            ha_mcp_source_commit: eac7a3aa7063432e9af17e7d7726040e909c7b8f
            ha_mcp_source_sha256: 4504b0f086f20b21350269ed330886ed5398a96a671a30af97444ece412cf3cc
          - lane: ha-2026-9-3
            ha_version: "2026.9.3"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.9.3@sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196"
            ha_mcp_version: "8.5.0"
            ha_mcp_image: "ghcr.io/homeassistant-ai/ha-mcp:8.5.0@sha256:e1538bcdadb13a5467bbb8258fba3262a05518585e18115742da638adec7057c"
            ha_mcp_source_commit: 311d6dc273fb4e9a5b8cde0de15f69472a64fe44
            ha_mcp_source_sha256: 02a0f9d8534d7265a21cf52daac193c405c703aac013be0c808ebd8fb9aa056e
    env:
      HA_CONTRACT_LANE: ${{ matrix.lane }}
      HA_CONTRACT_VERSION: ${{ matrix.ha_version }}
      HA_CONTRACT_IMAGE: ${{ matrix.ha_image }}
      HA_FIXTURE_WRITER_IMAGE: "ghcr.io/home-assistant/home-assistant:2026.7.2@sha256:1476924357b46e80735c13e94232ba5c853cac052e9df4bb28d50fa56348097b"
      REAL_HA_EXPECTED_VERSION: ${{ matrix.ha_version }}
      REAL_HA_UPSTREAM_IMAGE: ${{ matrix.ha_mcp_image }}
      REAL_HA_UPSTREAM_VERSION: ${{ matrix.ha_mcp_version }}
      REAL_HA_UPSTREAM_SOURCE_COMMIT: ${{ matrix.ha_mcp_source_commit }}
      REAL_HA_UPSTREAM_SOURCE_SHA256: ${{ matrix.ha_mcp_source_sha256 }}
      REAL_HA_UPSTREAM_CONTAINER: beta25-real-ha-upstream-${{ matrix.lane }}
      REAL_HA_UPSTREAM_PORT: "18086"
      HA_WRITER_CONTAINER: beta25-real-ha-writer-${{ matrix.lane }}
      HA_CONTRACT_CONTAINER: beta25-real-ha-${{ matrix.lane }}
      HA_CONTRACT_NETWORK: beta-rc2-contract-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.lock
      - name: Install Engineering client dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock
      - name: Prepare exact source and disposable migration configuration
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$RUNNER_TEMP/ha-mcp-source-$HA_CONTRACT_LANE.tar.gz"
          source_parent="$RUNNER_TEMP/ha-mcp-source-$HA_CONTRACT_LANE"
          contract_dir="$RUNNER_TEMP/beta25-real-ha-$HA_CONTRACT_LANE"
          device_fixture="$contract_dir/beta23-device-fixture.json"
          token_file="$RUNNER_TEMP/beta25-real-ha-$HA_CONTRACT_LANE.token"
          {
            echo "REAL_HA_CONTRACT_DIR=$contract_dir"
            echo "REAL_HA_DEVICE_FIXTURE=$device_fixture"
            echo "REAL_HA_TOKEN_FILE=$token_file"
          } >> "$GITHUB_ENV"
          mkdir -p "$source_parent" "$contract_dir/custom_components"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://codeload.github.com/homeassistant-ai/ha-mcp/legacy.tar.gz/$REAL_HA_UPSTREAM_SOURCE_COMMIT" \
            --output "$source_archive"
          printf '%s  %s\n' \
            "$REAL_HA_UPSTREAM_SOURCE_SHA256" \
            "$source_archive" | sha256sum --check --strict
          tar -xzf "$source_archive" -C "$source_parent"
          source_root="$(find "$source_parent" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          test "$(find "$source_parent" -mindepth 1 -maxdepth 1 -type d | wc -l)" = 1
          printf 'HA_MCP_SOURCE_ROOT=%s\n' "$source_root" >> "$GITHUB_ENV"
          if test "$REAL_HA_UPSTREAM_VERSION" = "8.2.0"; then
            python scripts/verify_ha_mcp_8_2_0_packaging.py \
              --source-root "$source_root" \
              --output "$RUNNER_TEMP/ha-mcp-8.2.0-packaging-$HA_CONTRACT_LANE.json"
          fi
          cp -R \
            tests/fixtures/real_ha_device_migration/custom_components/beta23_device_fixture \
            "$contract_dir/custom_components/"
          cp -R "$source_root/custom_components/ha_mcp_tools" \
            "$contract_dir/custom_components/"
          printf '%s\n' \
            'default_config:' \
            'automation: !include automations.yaml' \
            'http:' \
            '  server_port: 8123' \
            'input_boolean: {}' \
            'input_number: {}' \
            'script: !include scripts.yaml' \
            > "$contract_dir/configuration.yaml"
          : > "$contract_dir/automations.yaml"
          : > "$contract_dir/scripts.yaml"
          # A dedicated bridge isolates this disposable topology from every
          # unrelated container while the explicit loopback-only published
          # ports let the bounded host-side contract client reach Core and
          # ha-mcp. Docker's --internal networks intentionally suppress those
          # published-port routes and therefore cannot serve this acceptance
          # topology.
          docker network create --driver bridge "$HA_CONTRACT_NETWORK"
          expected_network_internal="$(
            python -c 'import json,pathlib; print(str(json.loads(pathlib.Path("tests/fixtures/ha_core_2026_9_disposable_lane.json").read_text(encoding="utf-8"))["docker_internal"]).lower())'
          )"
          actual_network_internal="$(
            docker network inspect --format '{{.Internal}}' "$HA_CONTRACT_NETWORK"
          )"
          test "$actual_network_internal" = "$expected_network_internal"
      - name: Persist migration fixture with exact Home Assistant 2026.7.2
        shell: bash
        env:
          REAL_HA_URL: http://127.0.0.1:18123
        run: |
          set -euo pipefail
          docker pull "$HA_FIXTURE_WRITER_IMAGE"
          docker run -d --name "$HA_WRITER_CONTAINER" \
            --network "$HA_CONTRACT_NETWORK" -p 127.0.0.1:18123:8123 \
            -v "$REAL_HA_CONTRACT_DIR:/config" "$HA_FIXTURE_WRITER_IMAGE"
          python scripts/real_ha_contract_tests.py --prepare-migration-fixture
          docker stop --time 30 "$HA_WRITER_CONTAINER"
          docker rm "$HA_WRITER_CONTAINER"
      - name: Start disposable exact target Home Assistant Core
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HA_CONTRACT_VERSION" == 2026.9.* ]]; then
            printf '%s\n' 'kitchen_sink:' >> "$REAL_HA_CONTRACT_DIR/configuration.yaml"
          fi
          docker pull "$HA_CONTRACT_IMAGE"
          docker run -d --name "$HA_CONTRACT_CONTAINER" \
            --network "$HA_CONTRACT_NETWORK" -p 127.0.0.1:8123:8123 \
            -v "$REAL_HA_CONTRACT_DIR:/config" "$HA_CONTRACT_IMAGE"
          echo "HA contract version: $HA_CONTRACT_VERSION"
          docker image inspect "$HA_CONTRACT_IMAGE" \
            --format='HA contract image digest: {{index .RepoDigests 0}}'
      - name: Verify exact ha-mcp component inside disposable Home Assistant
        shell: bash
        run: |
          set -euo pipefail
          source_root="$HA_MCP_SOURCE_ROOT"
          docker pull "$REAL_HA_UPSTREAM_IMAGE"
          docker cp "$source_root" \
            "$HA_CONTRACT_CONTAINER:/tmp/ha-mcp-source"
          docker cp scripts/disposable_ha_websockets_probe.py \
            "$HA_CONTRACT_CONTAINER:/tmp/disposable_ha_websockets_probe.py"
          docker exec "$HA_CONTRACT_CONTAINER" python \
            /tmp/disposable_ha_websockets_probe.py \
            --source-root /tmp/ha-mcp-source \
            --upstream-version "$REAL_HA_UPSTREAM_VERSION" \
            --output /tmp/ha-mcp-disposable-ha.json
          docker cp \
            "$HA_CONTRACT_CONTAINER:/tmp/ha-mcp-disposable-ha.json" \
            "$RUNNER_TEMP/ha-mcp-$REAL_HA_UPSTREAM_VERSION-disposable-$HA_CONTRACT_LANE.json"
      - name: Run real Home Assistant contracts
        env:
          REAL_HA_URL: http://127.0.0.1:8123
        run: python scripts/real_ha_contract_tests.py
      - name: Upload bounded disposable Home Assistant packaging evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ha-mcp-${{ matrix.ha_mcp_version }}-disposable-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/ha-mcp-8.2.0-packaging-${{ matrix.lane }}.json
            ${{ runner.temp }}/ha-mcp-${{ matrix.ha_mcp_version }}-disposable-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Sanitize and remove disposable Home Assistant
        if: always()
        shell: bash
        run: |
          docker rm -f "$REAL_HA_UPSTREAM_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$HA_CONTRACT_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$HA_WRITER_CONTAINER" >/dev/null 2>&1 || true
          rm -f "$REAL_HA_TOKEN_FILE"
          sudo rm -rf "$REAL_HA_CONTRACT_DIR"
          docker network rm "$HA_CONTRACT_NETWORK" >/dev/null 2>&1 || true

  prepare_exact_image_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.reviewed-registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.lock
      - name: Install reviewed registry runtime dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock
      - name: Derive exact-image matrix from reviewed registry
        id: reviewed-registry
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/review_upstream_read_release.py ci-matrix)"
          test -n "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  exact-image-read-gateway:
    needs: prepare_exact_image_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_exact_image_matrix.outputs.matrix) }}
    env:
      UPSTREAM_IMAGE: ${{ matrix.upstream_image }}
      UPSTREAM_VERSION: ${{ matrix.upstream_version }}
      EXPECTED_IMAGE_INDEX_DIGEST: ${{ matrix.image_index_digest }}
      EXPECTED_SOURCE_COMMIT: ${{ matrix.source_commit }}
      EXPECTED_IMAGE_REVISION: ${{ matrix.image_revision }}
      EXPECTED_ARCHITECTURE_IMAGE_DIGESTS: ${{ toJSON(matrix.architecture_image_digests) }}
      ENGINEERING_ACCESS_SECRET: synthetic-engineering-access-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.lock
      - name: Install transport acceptance dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock
      - name: Start synthetic read-only Home Assistant fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fake_ha_read_gateway_contract_server.py \
            --port 18123 --upstream-version "$UPSTREAM_VERSION" \
            > "$RUNNER_TEMP/read-gateway-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/read-gateway-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18123/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Start exact reviewed ha-mcp image
        shell: bash
        run: |
          set -euo pipefail
          resolved_index_digest="$(
            docker buildx imagetools inspect "$UPSTREAM_IMAGE" |
              sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' |
              head -n 1
          )"
          test "$resolved_index_digest" = "$EXPECTED_IMAGE_INDEX_DIGEST"
          docker buildx imagetools inspect "$UPSTREAM_IMAGE" --raw \
            > "$RUNNER_TEMP/reviewed-upstream-index.json"
          python3 - "$RUNNER_TEMP/reviewed-upstream-index.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = json.loads(
              os.environ["EXPECTED_ARCHITECTURE_IMAGE_DIGESTS"]
          )
          observed = {}
          for item in manifest.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              variant = platform.get("variant")
              if not isinstance(os_name, str) or not isinstance(
                  architecture, str
              ):
                  continue
              if os_name == "unknown" and architecture == "unknown":
                  continue
              name = f"{os_name}/{architecture}"
              if isinstance(variant, str) and variant:
                  name += f"/{variant}"
              observed[name] = item.get("digest")
          if observed != expected:
              raise SystemExit(
                  "reviewed platform digest map does not match OCI index"
              )
          PY
          docker pull "$UPSTREAM_IMAGE"
          test "$(
            docker image inspect "$UPSTREAM_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
          )" = "$UPSTREAM_VERSION"
          test "$(
            docker image inspect "$UPSTREAM_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )" = "$EXPECTED_IMAGE_REVISION"
          docker run --detach --network host --name exact-read-gateway-upstream \
            --read-only --tmpfs /tmp --tmpfs /home/mcpuser/.ha-mcp \
            -e HOMEASSISTANT_URL=http://127.0.0.1:18123 \
            -e HOMEASSISTANT_TOKEN=synthetic-read-gateway-token \
            -e MCP_HOST=127.0.0.1 -e MCP_PORT=18086 \
            -e MCP_SECRET_PATH=/synthetic-upstream-secret/mcp \
            -e HA_MCP_DISABLE_SETTINGS_UI=true \
            "$UPSTREAM_IMAGE" ha-mcp-web
          status="000"
          for attempt in $(seq 1 60); do
            status="$(curl --max-time 1 --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18086/synthetic-upstream-secret/mcp || true)"
            if test "$status" != "000"; then
              break
            fi
            sleep 1
          done
          test "$status" != "000"
          observed_package_version="$(
            docker exec exact-read-gateway-upstream python -c \
              'from importlib.metadata import version; print(version("ha-mcp"))'
          )"
          test "$observed_package_version" = "$UPSTREAM_VERSION"
      - name: Build and start Engineering through its production discovery path
        shell: bash
        run: |
          set -euo pipefail
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            -t engineering-read-gateway-acceptance:test \
            ./hass_mcp_engineering_beta
          mkdir -p "$RUNNER_TEMP/read-gateway-data"
          printf '%s\n' \
            '{' \
            '  "access_secret": "synthetic-engineering-access-secret",' \
            '  "audit_enabled": true,' \
            '  "prewarm_enabled": false,' \
            '  "rate_limit_per_minute": 600,' \
            '  "rate_limit_burst": 100,' \
            '  "approval_notification_service": "notify.mobile_app_beta31_fixture",' \
            '  "upstream_trust_registry_enabled": false' \
            '}' > "$RUNNER_TEMP/read-gateway-data/options.json"
          docker run --detach --rm --network host \
            --add-host abcdef12-ha-mcp:127.0.0.1 \
            --add-host supervisor:127.0.0.1 \
            --name engineering-read-gateway-acceptance \
            -v "$RUNNER_TEMP/read-gateway-data:/data" \
            -e HA_URL=http://supervisor:18123/core \
            -e HA_TOKEN=synthetic-read-gateway-token \
            -e SUPERVISOR_TOKEN=synthetic-read-gateway-token \
            -e MCP_PORT=18100 -e APPROVAL_INGRESS_PORT=18110 \
            -e UPSTREAM_DASHBOARD_MCP_URL=http://abcdef12-ha-mcp:18086/synthetic-upstream-secret/mcp \
            engineering-read-gateway-acceptance:test
          for attempt in $(seq 1 90); do
            status="$(curl --max-time 1 --silent --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:18100/ready || true)"
            test "$status" = "200" && exit 0
            sleep 1
          done
          exit 1
      - name: Run exact-image authenticated gateway acceptance
        if: always()
        shell: bash
        run: |
          python scripts/exact_image_read_gateway_acceptance.py \
            --upstream-endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --configured-upstream-endpoint http://abcdef12-ha-mcp:18086/synthetic-upstream-secret/mcp \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --ha-url http://127.0.0.1:18123 \
            --ha-token synthetic-read-gateway-token \
            --output "$RUNNER_TEMP/exact-image-read-gateway-result.json"
      - name: Verify exact 8.2.0 dashboard target resolution
        if: matrix.upstream_version == '8.2.0'
        shell: bash
        run: |
          python scripts/exact_8_2_dashboard_setter_acceptance.py \
            --upstream-endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --output "$RUNNER_TEMP/exact-8.2.0-dashboard-setter-result.json"
      - name: Verify exact reviewed dashboard authority
        if: matrix.upstream_version == '8.4.1' || matrix.upstream_version == '8.4.3' || matrix.upstream_version == '8.5.0'
        shell: bash
        run: |
          python scripts/exact_8_2_dashboard_setter_acceptance.py \
            --expected-version "$UPSTREAM_VERSION" \
            --upstream-endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --output "$RUNNER_TEMP/exact-${UPSTREAM_VERSION}-dashboard-setter-result.json"
          python scripts/exact_8_4_1_dashboard_quarantine_acceptance.py \
            --expected-version "$UPSTREAM_VERSION" \
            --upstream-endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --output "$RUNNER_TEMP/exact-${UPSTREAM_VERSION}-dashboard-authority-result.json"
      - name: Verify exact 8.1+ stdio lifecycle
        if: matrix.upstream_version == '8.1.0' || matrix.upstream_version == '8.1.1' || matrix.upstream_version == '8.2.0' || matrix.upstream_version == '8.4.1' || matrix.upstream_version == '8.4.3' || matrix.upstream_version == '8.5.0'
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i \
            --env HA_MCP_DISABLE_SETTINGS_UI=false \
            exact-read-gateway-upstream \
            python - \
              --expected-version "$UPSTREAM_VERSION" \
              --output /dev/stdout \
            < scripts/exact_image_sidecar_lifecycle_acceptance.py \
            > "$RUNNER_TEMP/exact-image-sidecar-lifecycle-result.json"
      - name: Verify exact 8.1.0 custom-component worker shutdown
        if: matrix.upstream_version == '8.1.0'
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$EXPECTED_SOURCE_COMMIT"
          source_sha256=d1ea2b571e5737c59e459d155163ae750228c2e455796e38f848c543720ba108
          test "$source_commit" = 0683f5ff34e5c71f35bce08d1cedcdee3c0a60b2
          test "$EXPECTED_IMAGE_REVISION" = 6213fc8047171a2731af6299f9bcecd73e96fcad
          test "$EXPECTED_IMAGE_REVISION" != "$source_commit"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 \
            "https://raw.githubusercontent.com/homeassistant-ai/ha-mcp/${source_commit}/custom_components/ha_mcp_tools/embedded_server.py" \
            --output "$RUNNER_TEMP/reviewed-embedded-server.py"
          printf '%s  %s\n' \
            "$source_sha256" "$RUNNER_TEMP/reviewed-embedded-server.py" |
            sha256sum --check --strict
          python scripts/exact_custom_component_shutdown_acceptance.py \
            --source "$RUNNER_TEMP/reviewed-embedded-server.py" \
            --expected-source-sha256 "$source_sha256" \
            --expected-source-commit "$source_commit" \
            --output "$RUNNER_TEMP/exact-custom-component-shutdown-result.json"
      - name: Verify exact 8.1+ disconnect and readmission
        if: matrix.upstream_version == '8.1.0' || matrix.upstream_version == '8.1.1' || matrix.upstream_version == '8.2.0' || matrix.upstream_version == '8.4.1' || matrix.upstream_version == '8.4.3' || matrix.upstream_version == '8.5.0'
        shell: bash
        run: |
          set -euo pipefail
          docker stop --time 10 exact-read-gateway-upstream
          python scripts/exact_image_readmission_acceptance.py \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --phase disconnected \
            --output "$RUNNER_TEMP/exact-image-disconnected-result.json"
          docker start exact-read-gateway-upstream
          python scripts/exact_image_readmission_acceptance.py \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --phase readmitted \
            --output "$RUNNER_TEMP/exact-image-readmitted-result.json"
      - name: Verify deterministic upstream contract capture
        if: always()
        shell: bash
        run: |
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --output "$RUNNER_TEMP/upstream-contract-capture-1.json"
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --output "$RUNNER_TEMP/upstream-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/upstream-contract-capture-1.json" \
            "$RUNNER_TEMP/upstream-contract-capture-2.json"
          if [[ "$UPSTREAM_VERSION" == "8.5.0" ]]; then
            python - "$RUNNER_TEMP/upstream-contract-capture-1.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from exact_image_read_gateway_acceptance import verify_850_gateway_fixture_capture
          verify_850_gateway_fixture_capture(
              json.loads(Path(sys.argv[1]).read_text()),
              json.loads(Path("docs/evidence/upstream-read-compatibility/ha-mcp-8.5.0.json").read_text()),
          )
          PY
          else
            cmp \
              "$RUNNER_TEMP/upstream-contract-capture-1.json" \
              "docs/evidence/upstream-read-compatibility/ha-mcp-${UPSTREAM_VERSION}.json"
          fi
      - name: Upload bounded exact-image result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-image-read-gateway-${{ matrix.upstream_version }}
          path: |
            ${{ runner.temp }}/exact-image-read-gateway-result.json
            ${{ runner.temp }}/upstream-contract-capture-1.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact 8.2.0 dashboard resolver evidence
        if: always() && matrix.upstream_version == '8.2.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-8.2.0-dashboard-setter
          path: ${{ runner.temp }}/exact-8.2.0-dashboard-setter-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact reviewed dashboard authority evidence
        if: always() && (matrix.upstream_version == '8.4.1' || matrix.upstream_version == '8.4.3' || matrix.upstream_version == '8.5.0')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-${{ matrix.upstream_version }}-dashboard-authority
          path: |
            ${{ runner.temp }}/exact-${{ matrix.upstream_version }}-dashboard-setter-result.json
            ${{ runner.temp }}/exact-${{ matrix.upstream_version }}-dashboard-authority-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded 8.1+ lifecycle evidence
        if: always() && (matrix.upstream_version == '8.1.0' || matrix.upstream_version == '8.1.1' || matrix.upstream_version == '8.2.0' || matrix.upstream_version == '8.4.1' || matrix.upstream_version == '8.4.3' || matrix.upstream_version == '8.5.0')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-image-readmission-${{ matrix.upstream_version }}
          path: |
            ${{ runner.temp }}/exact-image-sidecar-lifecycle-result.json
            ${{ runner.temp }}/exact-custom-component-shutdown-result.json
            ${{ runner.temp }}/exact-image-disconnected-result.json
            ${{ runner.temp }}/exact-image-readmitted-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable exact-image environment
        if: always()
        shell: bash
        run: |
          docker rm -f engineering-read-gateway-acceptance exact-read-gateway-upstream >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/read-gateway-ha.pid"; then
            kill "$(cat "$RUNNER_TEMP/read-gateway-ha.pid")" >/dev/null 2>&1 || true
          fi
          sudo rm -rf "$RUNNER_TEMP/read-gateway-data"

