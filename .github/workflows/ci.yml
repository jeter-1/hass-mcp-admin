name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            hass_mcp_engineering_beta/requirements.txt
            tests/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt -r tests/requirements.txt
      - name: Regenerate historical compatibility fixtures
        shell: bash
        run: |
          set -euo pipefail
          historical_sha="5c7eebf962837f85f2309b1b5099401fb075cd6e"
          historical_worktree="$RUNNER_TEMP/beta6-fixture-source"
          generated="$RUNNER_TEMP/beta6-generated-fixtures"
          cleanup() {
            git worktree remove "$historical_worktree" >/dev/null 2>&1 || true
            git worktree prune
          }
          trap cleanup EXIT
          git worktree add --detach "$historical_worktree" "$historical_sha"
          PYTHONDONTWRITEBYTECODE=1 \
            python scripts/generate_beta6_prohibited_compatibility_fixtures.py \
            --beta6-worktree "$historical_worktree" \
            --output-dir "$generated" \
            --generated-at 2026-08-02T22:00:00Z
          for fixture in \
            beta6_prohibited_superseded_contract_v2_a.json \
            beta6_prohibited_superseded_contract_v2_b.json \
            beta6_prohibited_superseded_contract_v2_provenance.json \
            beta6_legacy_prohibited_expired_automation_a.json \
            beta6_legacy_prohibited_expired_automation_b.json \
            beta6_legacy_prohibited_expired_automation_provenance.json
          do
            cmp "$generated/$fixture" "tests/fixtures/$fixture"
          done
      - name: Audit Engineering dependencies
        run: python -m pip_audit --strict --progress-spinner off --requirement hass_mcp_engineering_beta/requirements.txt
      - name: Compile Python
        run: python -m compileall -q hass_mcp_admin hass_mcp_engineering_beta tests
      - name: Validate deployment metadata
        run: python scripts/validate_addon_metadata.py --repo-root . --base-ref origin/main
      - name: Validate reviewed upstream registry evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_upstream_read_release.py validate
          python scripts/review_upstream_read_release.py generate \
            --output "$RUNNER_TEMP/generated-upstream-release-registry.json"
          python scripts/review_upstream_read_release.py registry-diff \
            --expected hass_mcp_engineering_beta/ha_mcp_engineering/upstream_release_registry.json \
            --actual "$RUNNER_TEMP/generated-upstream-release-registry.json"
      - name: Validate PowerShell deployment script syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw "scripts/deploy-beta.ps1")) | Out-Null'
      - name: Run Engineering unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate add-on YAML
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('hass_mcp_admin/config.yaml').read_text()); yaml.safe_load(pathlib.Path('hass_mcp_engineering_beta/config.yaml').read_text()); yaml.safe_load(pathlib.Path('repository.yaml').read_text())"
      - name: Set up QEMU for declared RC architectures
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64,arm
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build retired stable-v1 image packaging
        run: docker build -t hass-mcp-admin:test ./hass_mcp_admin
      - name: Build beta image
        shell: bash
        run: |
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            -t hass-mcp-engineering-beta:test \
            ./hass_mcp_engineering_beta
          docker run --rm --entrypoint python \
            -e "EXPECTED_BUILD_SHA=$build_sha" \
            -e "EXPECTED_BUILD_VERSION=$beta_version" \
            hass-mcp-engineering-beta:test -c \
            'import os; from ha_mcp_engineering.version import BUILD_DIRTY, BUILD_SHA, SERVER_VERSION; assert BUILD_SHA == os.environ["EXPECTED_BUILD_SHA"]; assert SERVER_VERSION == os.environ["EXPECTED_BUILD_VERSION"]; assert BUILD_DIRTY is False'
      - name: Validate beta image on every declared architecture without pushing
        shell: bash
        run: |
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker buildx build \
            --platform "linux/amd64,linux/arm64,linux/arm/v7" \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            --output=type=cacheonly \
            ./hass_mcp_engineering_beta

  real-ha-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ha-2026-7-2
            ha_version: "2026.7.2"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.7.2@sha256:1476924357b46e80735c13e94232ba5c853cac052e9df4bb28d50fa56348097b"
          - lane: ha-2026-8-0
            ha_version: "2026.8.0"
            ha_image: "ghcr.io/home-assistant/home-assistant:2026.8.0@sha256:a21689ef0510df9760ee11bab4d6b2fef3ed5c1a29ed9c3224271597a23729eb"
    env:
      HA_CONTRACT_LANE: ${{ matrix.lane }}
      HA_CONTRACT_VERSION: ${{ matrix.ha_version }}
      HA_CONTRACT_IMAGE: ${{ matrix.ha_image }}
      HA_FIXTURE_WRITER_IMAGE: "ghcr.io/home-assistant/home-assistant:2026.7.2@sha256:1476924357b46e80735c13e94232ba5c853cac052e9df4bb28d50fa56348097b"
      REAL_HA_EXPECTED_VERSION: ${{ matrix.ha_version }}
      REAL_HA_CONTRACT_DIR: ${{ runner.temp }}/beta25-real-ha-${{ matrix.lane }}
      REAL_HA_DEVICE_FIXTURE: ${{ runner.temp }}/beta25-real-ha-${{ matrix.lane }}/beta23-device-fixture.json
      REAL_HA_TOKEN_FILE: ${{ runner.temp }}/beta25-real-ha-${{ matrix.lane }}.token
      REAL_HA_UPSTREAM_IMAGE: "ghcr.io/homeassistant-ai/ha-mcp:8.1.1@sha256:e1d76a6ee54e26054a13a6c04089824b76d4d370246239591a02a2e4445ad2c9"
      REAL_HA_UPSTREAM_VERSION: "8.1.1"
      REAL_HA_UPSTREAM_CONTAINER: beta25-real-ha-upstream-${{ matrix.lane }}
      REAL_HA_UPSTREAM_PORT: "18086"
      HA_WRITER_CONTAINER: beta25-real-ha-writer-${{ matrix.lane }}
      HA_CONTRACT_CONTAINER: beta25-real-ha-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.txt
      - name: Install Engineering client dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt
      - name: Prepare exact source and disposable migration configuration
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$RUNNER_TEMP/ha-mcp-v8.1.1-source.tar.gz"
          source_parent="$RUNNER_TEMP/ha-mcp-v8.1.1-source"
          source_root="$source_parent/ha-mcp-8.1.1"
          mkdir -p "$source_parent" "$REAL_HA_CONTRACT_DIR/custom_components"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://codeload.github.com/homeassistant-ai/ha-mcp/tar.gz/refs/tags/v8.1.1 \
            --output "$source_archive"
          printf '%s  %s\n' \
            bc631f50d3efd22234430891bbf66f55bbcd1cdea775e2eb7ae1b41b5feabe79 \
            "$source_archive" | sha256sum --check --strict
          tar -xzf "$source_archive" -C "$source_parent"
          python scripts/verify_ha_mcp_8_1_1_packaging.py \
            --source-root "$source_root" \
            --output "$RUNNER_TEMP/ha-mcp-8.1.1-packaging-$HA_CONTRACT_LANE.json"
          cp -R \
            tests/fixtures/real_ha_device_migration/custom_components/beta23_device_fixture \
            "$REAL_HA_CONTRACT_DIR/custom_components/"
          cp -R "$source_root/custom_components/ha_mcp_tools" \
            "$REAL_HA_CONTRACT_DIR/custom_components/"
          printf '%s\n' \
            'default_config:' \
            'automation: !include automations.yaml' \
            'http:' \
            '  server_port: 8123' \
            'input_boolean: {}' \
            'input_number: {}' \
            'script: !include scripts.yaml' \
            > "$REAL_HA_CONTRACT_DIR/configuration.yaml"
          : > "$REAL_HA_CONTRACT_DIR/automations.yaml"
          : > "$REAL_HA_CONTRACT_DIR/scripts.yaml"
      - name: Persist migration fixture with exact Home Assistant 2026.7.2
        shell: bash
        env:
          REAL_HA_URL: http://127.0.0.1:18123
        run: |
          set -euo pipefail
          docker pull "$HA_FIXTURE_WRITER_IMAGE"
          docker run -d --name "$HA_WRITER_CONTAINER" -p 18123:8123 \
            -v "$REAL_HA_CONTRACT_DIR:/config" "$HA_FIXTURE_WRITER_IMAGE"
          python scripts/real_ha_contract_tests.py --prepare-migration-fixture
          docker stop --time 30 "$HA_WRITER_CONTAINER"
          docker rm "$HA_WRITER_CONTAINER"
      - name: Start disposable exact target Home Assistant Core
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$HA_CONTRACT_IMAGE"
          docker run -d --name "$HA_CONTRACT_CONTAINER" -p 8123:8123 \
            -v "$REAL_HA_CONTRACT_DIR:/config" "$HA_CONTRACT_IMAGE"
          echo "HA contract version: $HA_CONTRACT_VERSION"
          docker image inspect "$HA_CONTRACT_IMAGE" \
            --format='HA contract image digest: {{index .RepoDigests 0}}'
      - name: Verify exact ha-mcp 8.1.1 packaging inside disposable Home Assistant
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/ha-mcp-v8.1.1-source/ha-mcp-8.1.1"
          docker pull "$REAL_HA_UPSTREAM_IMAGE"
          docker cp "$source_root" \
            "$HA_CONTRACT_CONTAINER:/tmp/ha-mcp-8.1.1-source"
          docker cp scripts/disposable_ha_websockets_probe.py \
            "$HA_CONTRACT_CONTAINER:/tmp/disposable_ha_websockets_probe.py"
          docker exec "$HA_CONTRACT_CONTAINER" python \
            /tmp/disposable_ha_websockets_probe.py \
            --source-root /tmp/ha-mcp-8.1.1-source \
            --output /tmp/ha-mcp-8.1.1-disposable-ha.json
          docker cp \
            "$HA_CONTRACT_CONTAINER:/tmp/ha-mcp-8.1.1-disposable-ha.json" \
            "$RUNNER_TEMP/ha-mcp-8.1.1-disposable-$HA_CONTRACT_LANE.json"
      - name: Run real Home Assistant contracts
        env:
          REAL_HA_URL: http://127.0.0.1:8123
        run: python scripts/real_ha_contract_tests.py
      - name: Upload bounded disposable Home Assistant packaging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ha-mcp-8.1.1-disposable-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/ha-mcp-8.1.1-packaging-${{ matrix.lane }}.json
            ${{ runner.temp }}/ha-mcp-8.1.1-disposable-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Sanitize and remove disposable Home Assistant
        if: always()
        shell: bash
        run: |
          docker rm -f "$REAL_HA_UPSTREAM_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$HA_CONTRACT_CONTAINER" >/dev/null 2>&1 || true
          docker rm -f "$HA_WRITER_CONTAINER" >/dev/null 2>&1 || true
          rm -f "$REAL_HA_TOKEN_FILE"
          sudo rm -rf "$REAL_HA_CONTRACT_DIR"

  prepare_exact_image_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reviewed-registry.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive exact-image matrix from reviewed registry
        id: reviewed-registry
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 scripts/review_upstream_read_release.py ci-matrix)"
          test -n "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  exact-image-read-gateway:
    needs: prepare_exact_image_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_exact_image_matrix.outputs.matrix) }}
    env:
      UPSTREAM_IMAGE: ${{ matrix.upstream_image }}
      UPSTREAM_VERSION: ${{ matrix.upstream_version }}
      EXPECTED_IMAGE_INDEX_DIGEST: ${{ matrix.image_index_digest }}
      EXPECTED_SOURCE_COMMIT: ${{ matrix.source_commit }}
      EXPECTED_IMAGE_REVISION: ${{ matrix.image_revision }}
      EXPECTED_ARCHITECTURE_IMAGE_DIGESTS: ${{ toJSON(matrix.architecture_image_digests) }}
      ENGINEERING_ACCESS_SECRET: synthetic-engineering-access-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.txt
      - name: Install transport acceptance dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt
      - name: Start synthetic read-only Home Assistant fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fake_ha_read_gateway_contract_server.py \
            --port 18123 --upstream-version "$UPSTREAM_VERSION" \
            > "$RUNNER_TEMP/read-gateway-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/read-gateway-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18123/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Start exact reviewed ha-mcp image
        shell: bash
        run: |
          set -euo pipefail
          resolved_index_digest="$(
            docker buildx imagetools inspect "$UPSTREAM_IMAGE" |
              sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' |
              head -n 1
          )"
          test "$resolved_index_digest" = "$EXPECTED_IMAGE_INDEX_DIGEST"
          docker buildx imagetools inspect "$UPSTREAM_IMAGE" --raw \
            > "$RUNNER_TEMP/reviewed-upstream-index.json"
          python3 - "$RUNNER_TEMP/reviewed-upstream-index.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = json.loads(
              os.environ["EXPECTED_ARCHITECTURE_IMAGE_DIGESTS"]
          )
          observed = {}
          for item in manifest.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              variant = platform.get("variant")
              if not isinstance(os_name, str) or not isinstance(
                  architecture, str
              ):
                  continue
              if os_name == "unknown" and architecture == "unknown":
                  continue
              name = f"{os_name}/{architecture}"
              if isinstance(variant, str) and variant:
                  name += f"/{variant}"
              observed[name] = item.get("digest")
          if observed != expected:
              raise SystemExit(
                  "reviewed platform digest map does not match OCI index"
              )
          PY
          docker pull "$UPSTREAM_IMAGE"
          test "$(
            docker image inspect "$UPSTREAM_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
          )" = "$UPSTREAM_VERSION"
          test "$(
            docker image inspect "$UPSTREAM_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )" = "$EXPECTED_IMAGE_REVISION"
          docker run --detach --network host --name exact-read-gateway-upstream \
            --read-only --tmpfs /tmp --tmpfs /home/mcpuser/.ha-mcp \
            -e HOMEASSISTANT_URL=http://127.0.0.1:18123 \
            -e HOMEASSISTANT_TOKEN=synthetic-read-gateway-token \
            -e MCP_HOST=127.0.0.1 -e MCP_PORT=18086 \
            -e MCP_SECRET_PATH=/synthetic-upstream-secret/mcp \
            -e HA_MCP_DISABLE_SETTINGS_UI=true \
            "$UPSTREAM_IMAGE" ha-mcp-web
          status="000"
          for attempt in $(seq 1 60); do
            status="$(curl --max-time 1 --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18086/synthetic-upstream-secret/mcp || true)"
            if test "$status" != "000"; then
              break
            fi
            sleep 1
          done
          test "$status" != "000"
          observed_package_version="$(
            docker exec exact-read-gateway-upstream python -c \
              'from importlib.metadata import version; print(version("ha-mcp"))'
          )"
          test "$observed_package_version" = "$UPSTREAM_VERSION"
      - name: Build and start Engineering through its production discovery path
        shell: bash
        run: |
          set -euo pipefail
          beta_version="$(sed -nE 's/^version:[[:space:]]*"?([^"[:space:]]+)"?[[:space:]]*$/\1/p' hass_mcp_engineering_beta/config.yaml)"
          build_sha="$(git rev-parse HEAD)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "BUILD_VERSION=$beta_version" \
            --build-arg "HAMCP_BUILD_SHA=$build_sha" \
            --build-arg "HAMCP_BUILD_TIME=$build_time" \
            --build-arg "HAMCP_BUILD_DIRTY=false" \
            -t engineering-read-gateway-acceptance:test \
            ./hass_mcp_engineering_beta
          mkdir -p "$RUNNER_TEMP/read-gateway-data"
          printf '%s\n' \
            '{' \
            '  "access_secret": "synthetic-engineering-access-secret",' \
            '  "audit_enabled": true,' \
            '  "prewarm_enabled": false,' \
            '  "rate_limit_per_minute": 600,' \
            '  "rate_limit_burst": 100,' \
            '  "upstream_trust_registry_enabled": false' \
            '}' > "$RUNNER_TEMP/read-gateway-data/options.json"
          docker run --detach --rm --network host \
            --add-host abcdef12-ha-mcp:127.0.0.1 \
            --name engineering-read-gateway-acceptance \
            -v "$RUNNER_TEMP/read-gateway-data:/data" \
            -e HA_URL=http://127.0.0.1:18123 \
            -e HA_TOKEN=synthetic-read-gateway-token \
            -e MCP_PORT=18100 -e APPROVAL_INGRESS_PORT=18110 \
            -e UPSTREAM_DASHBOARD_MCP_URL=http://abcdef12-ha-mcp:18086/synthetic-upstream-secret/mcp \
            engineering-read-gateway-acceptance:test
          for attempt in $(seq 1 90); do
            status="$(curl --max-time 1 --silent --output /dev/null \
              --write-out '%{http_code}' http://127.0.0.1:18100/ready || true)"
            test "$status" = "200" && exit 0
            sleep 1
          done
          exit 1
      - name: Run exact-image authenticated gateway acceptance
        if: always()
        shell: bash
        run: |
          python scripts/exact_image_read_gateway_acceptance.py \
            --upstream-endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --configured-upstream-endpoint http://abcdef12-ha-mcp:18086/synthetic-upstream-secret/mcp \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --fixture-stats-url http://127.0.0.1:18123/__fixture__/stats \
            --ha-url http://127.0.0.1:18123 \
            --ha-token synthetic-read-gateway-token \
            --output "$RUNNER_TEMP/exact-image-read-gateway-result.json"
      - name: Verify exact 8.1 stdio lifecycle
        if: matrix.upstream_version == '8.1.0' || matrix.upstream_version == '8.1.1'
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i \
            --env HA_MCP_DISABLE_SETTINGS_UI=false \
            exact-read-gateway-upstream \
            python - \
              --expected-version "$UPSTREAM_VERSION" \
              --output /dev/stdout \
            < scripts/exact_image_sidecar_lifecycle_acceptance.py \
            > "$RUNNER_TEMP/exact-image-sidecar-lifecycle-result.json"
      - name: Verify exact 8.1.0 custom-component worker shutdown
        if: matrix.upstream_version == '8.1.0'
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$EXPECTED_SOURCE_COMMIT"
          source_sha256=d1ea2b571e5737c59e459d155163ae750228c2e455796e38f848c543720ba108
          test "$source_commit" = 0683f5ff34e5c71f35bce08d1cedcdee3c0a60b2
          test "$EXPECTED_IMAGE_REVISION" = 6213fc8047171a2731af6299f9bcecd73e96fcad
          test "$EXPECTED_IMAGE_REVISION" != "$source_commit"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 60 \
            "https://raw.githubusercontent.com/homeassistant-ai/ha-mcp/${source_commit}/custom_components/ha_mcp_tools/embedded_server.py" \
            --output "$RUNNER_TEMP/reviewed-embedded-server.py"
          printf '%s  %s\n' \
            "$source_sha256" "$RUNNER_TEMP/reviewed-embedded-server.py" |
            sha256sum --check --strict
          python scripts/exact_custom_component_shutdown_acceptance.py \
            --source "$RUNNER_TEMP/reviewed-embedded-server.py" \
            --expected-source-sha256 "$source_sha256" \
            --expected-source-commit "$source_commit" \
            --output "$RUNNER_TEMP/exact-custom-component-shutdown-result.json"
      - name: Verify exact 8.1 disconnect and readmission
        if: matrix.upstream_version == '8.1.0' || matrix.upstream_version == '8.1.1'
        shell: bash
        run: |
          set -euo pipefail
          docker stop --time 10 exact-read-gateway-upstream
          python scripts/exact_image_readmission_acceptance.py \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --phase disconnected \
            --output "$RUNNER_TEMP/exact-image-disconnected-result.json"
          docker start exact-read-gateway-upstream
          python scripts/exact_image_readmission_acceptance.py \
            --engineering-endpoint "http://127.0.0.1:18100/${ENGINEERING_ACCESS_SECRET}/mcp" \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --phase readmitted \
            --output "$RUNNER_TEMP/exact-image-readmitted-result.json"
      - name: Verify deterministic upstream contract capture
        if: always()
        shell: bash
        run: |
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --output "$RUNNER_TEMP/upstream-contract-capture-1.json"
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/synthetic-upstream-secret/mcp \
            --output "$RUNNER_TEMP/upstream-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/upstream-contract-capture-1.json" \
            "$RUNNER_TEMP/upstream-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/upstream-contract-capture-1.json" \
            "docs/evidence/upstream-read-compatibility/ha-mcp-${UPSTREAM_VERSION}.json"
      - name: Upload bounded exact-image result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-image-read-gateway-${{ matrix.upstream_version }}
          path: |
            ${{ runner.temp }}/exact-image-read-gateway-result.json
            ${{ runner.temp }}/upstream-contract-capture-1.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded 8.1 lifecycle evidence
        if: always() && (matrix.upstream_version == '8.1.0' || matrix.upstream_version == '8.1.1')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-image-readmission-${{ matrix.upstream_version }}
          path: |
            ${{ runner.temp }}/exact-image-sidecar-lifecycle-result.json
            ${{ runner.temp }}/exact-custom-component-shutdown-result.json
            ${{ runner.temp }}/exact-image-disconnected-result.json
            ${{ runner.temp }}/exact-image-readmitted-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable exact-image environment
        if: always()
        shell: bash
        run: |
          docker rm -f engineering-read-gateway-acceptance exact-read-gateway-upstream >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/read-gateway-ha.pid"; then
            kill "$(cat "$RUNNER_TEMP/read-gateway-ha.pid")" >/dev/null 2>&1 || true
          fi
          sudo rm -rf "$RUNNER_TEMP/read-gateway-data"

  exact-addon-runtime-acceptance:
    name: Exact ha-mcp ${{ matrix.upstream_version }} add-on runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream_version: "8.0.0"
            addon_detail_profile: live-8.0.0
            secret_path: /beta14-synthetic/mcp
            addon_amd64_index_digest: sha256:693ecd5c68f98e64111fbf58e02547a51b2168a942056684dbe262c550aff9cd
            addon_amd64_manifest_digest: sha256:65856752c37e4c1f9093060fbbc4a1a826cac1cbd6a76e856af5f5672a96c404
            addon_arm64_index_digest: sha256:150ee09078919a47db19639deaa8c27ec064390054e27b4e618f82eea9cf7f50
            addon_arm64_manifest_digest: sha256:a4bc83ed6f1a531d445e8107c77b7e7d5289d25510316dc6698d65383bf2fedb
          - upstream_version: "8.1.0"
            addon_detail_profile: live-8.1.0
            secret_path: /beta21-synthetic/mcp
            addon_amd64_index_digest: sha256:2744a11c90f7a66e61fabe8166d058191d236094393c50d976978407c039d45d
            addon_amd64_manifest_digest: sha256:f415b72351d79414a3133c227622633d9c190a3f4f6b849eed93ac524ac1c2d5
            addon_arm64_index_digest: sha256:71bd08ac7ab4272bc226b91d299929949fa24b674e164121566bc1d84666e273
            addon_arm64_manifest_digest: sha256:2dad5c7f8afcfb8c5624d82a7d9c322fc70351d32d9697e07a162ec7015250b0
          - upstream_version: "8.1.1"
            addon_detail_profile: live-8.1.1
            secret_path: /beta23-synthetic/mcp
            addon_amd64_index_digest: sha256:f5186360a6cdf66ce9a7f94f1096609ca966d4c159dedcca1b562fd0ccf7e429
            addon_amd64_manifest_digest: sha256:9b051abf89667209dcc3f3d77614e0b914b69b4aa20350637569193eea23e7f2
            addon_arm64_index_digest: sha256:013ce6faff9b197634a346d5654854859d40aab1a1b1a9423f5e9e77ca38c176
            addon_arm64_manifest_digest: sha256:8a14c856be38d621ee99807fde76406b7cabf99935fa2869686aaf205fed71fb
    env:
      UPSTREAM_VERSION: ${{ matrix.upstream_version }}
      ADDON_DETAIL_PROFILE: ${{ matrix.addon_detail_profile }}
      MCP_SECRET_PATH: ${{ matrix.secret_path }}
      ADDON_AMD64_IMAGE: ghcr.io/homeassistant-ai/ha-mcp-addon-amd64@${{ matrix.addon_amd64_index_digest }}
      ADDON_AMD64_INDEX_DIGEST: ${{ matrix.addon_amd64_index_digest }}
      ADDON_AMD64_MANIFEST_DIGEST: ${{ matrix.addon_amd64_manifest_digest }}
      ADDON_ARM64_IMAGE: ghcr.io/homeassistant-ai/ha-mcp-addon-aarch64@${{ matrix.addon_arm64_index_digest }}
      ADDON_ARM64_INDEX_DIGEST: ${{ matrix.addon_arm64_index_digest }}
      ADDON_ARM64_MANIFEST_DIGEST: ${{ matrix.addon_arm64_manifest_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.txt
      - name: Install exact add-on runtime acceptance dependencies
        run: python -m pip install -r hass_mcp_engineering_beta/requirements.txt
      - name: Verify immutable add-on indexes and platform manifests
        shell: bash
        run: |
          set -euo pipefail
          verify_index() {
            local image="$1"
            local expected_index="$2"
            local expected_platform="$3"
            local expected_manifest="$4"
            local output="$5"
            local resolved_index
            resolved_index="$(
              docker buildx imagetools inspect "$image" |
                sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' |
                head -n 1
            )"
            test "$resolved_index" = "$expected_index"
            docker buildx imagetools inspect "$image" --raw > "$output"
            python3 - "$output" "$expected_platform" "$expected_manifest" <<'PY'
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_platform = sys.argv[2]
          expected_digest = sys.argv[3]
          observed = {}
          for item in value.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              if not isinstance(os_name, str) or not isinstance(
                  architecture, str
              ):
                  continue
              name = f"{os_name}/{architecture}"
              variant = platform.get("variant")
              if isinstance(variant, str) and variant:
                  name += f"/{variant}"
              observed[name] = item.get("digest")
          if observed.get(expected_platform) != expected_digest:
              raise SystemExit(
                  "immutable add-on platform manifest did not match evidence"
              )
          PY
          }
          verify_index \
            "$ADDON_AMD64_IMAGE" \
            "$ADDON_AMD64_INDEX_DIGEST" \
            linux/amd64 \
            "$ADDON_AMD64_MANIFEST_DIGEST" \
            "$RUNNER_TEMP/addon-amd64-index.json"
          verify_index \
            "$ADDON_ARM64_IMAGE" \
            "$ADDON_ARM64_INDEX_DIGEST" \
            linux/arm64 \
            "$ADDON_ARM64_MANIFEST_DIGEST" \
            "$RUNNER_TEMP/addon-arm64-index.json"
      - name: Start synthetic Home Assistant contract fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python)" \
            scripts/fake_ha_read_gateway_contract_server.py \
            --port 80 --upstream-version "$UPSTREAM_VERSION" \
            --addon-detail-profile "$ADDON_DETAIL_PROFILE" \
            > "$RUNNER_TEMP/addon-runtime-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/addon-runtime-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Execute immutable ha-mcp add-on runtime
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ADDON_AMD64_IMAGE"
          observed_label_version="$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{index .Config.Labels "io.hass.version"}}'
          )"
          observed_default_command="$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{json .Config.Cmd}}'
          )"
          observed_build_version="$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' |
              sed -n 's/^HA_MCP_BUILD_VERSION=//p'
          )"
          test "$observed_label_version" = "$UPSTREAM_VERSION"
          test "$observed_build_version" = "$UPSTREAM_VERSION"
          test "$observed_default_command" = '["python3","/start.py"]'
          install -d -m 0700 "$RUNNER_TEMP/exact-addon-data"
          jq -n --arg secret_path "$MCP_SECRET_PATH" '{
            backup_hint: "normal",
            secret_path: $secret_path,
            enable_tool_search: false,
            tool_search_max_results: 5,
            enable_tool_security_policies: true,
            read_only_mode: false,
            enable_mandatory_bps: true,
            enable_strict_mandatory_bps: true,
            disabled_tools: "",
            pinned_tools: "",
            enable_auto_backup: true,
            auto_backup_throttle_minutes: 0,
            auto_backup_retain_per_entity: 100,
            enable_snapshot_delete: false,
            snapshot_delete_min_age_days: 7,
            verify_ssl: true
          }' > "$RUNNER_TEMP/exact-addon-data/options.json"
          docker run --detach --network host --read-only \
            --name exact-addon-runtime-upstream \
            --add-host supervisor:127.0.0.1 \
            --volume "$RUNNER_TEMP/exact-addon-data:/data" \
            --tmpfs /tmp \
            -e MCP_HOST=127.0.0.1 \
            -e SUPERVISOR_TOKEN=synthetic-read-gateway-token \
            "$ADDON_AMD64_IMAGE"
          for attempt in $(seq 1 60); do
            status="$(curl --max-time 1 --silent --output /dev/null \
              --write-out '%{http_code}' \
              "http://127.0.0.1:9583${MCP_SECRET_PATH}" || true)"
            if test "$status" != "000"; then
              break
            fi
            sleep 1
          done
          test "$status" != "000"
          observed_package_version="$(
            docker exec exact-addon-runtime-upstream \
              /app/.venv/bin/python -c \
              'from importlib.metadata import version; print(version("ha-mcp"))'
          )"
          test "$observed_package_version" = "$UPSTREAM_VERSION"
          jq -n \
            --arg expected_version "$UPSTREAM_VERSION" \
            --arg label_version "$observed_label_version" \
            --arg build_version "$observed_build_version" \
            --arg package_version "$observed_package_version" \
            --arg default_command "$observed_default_command" \
            '{
              result: "PASS",
              expected_version: $expected_version,
              image_label_version: $label_version,
              baked_build_version: $build_version,
              package_version: $package_version,
              default_command: $default_command,
              injected_build_version: false,
              default_addon_startup: true
            }' > "$RUNNER_TEMP/exact-addon-runtime-identity.json"
      - name: Run planning-only exact add-on runtime acceptance
        shell: bash
        run: |
          python scripts/exact_addon_runtime_acceptance.py \
            --upstream-endpoint "http://127.0.0.1:9583${MCP_SECRET_PATH}" \
            --configured-upstream-endpoint "http://abcdef12-ha-mcp:9583${MCP_SECRET_PATH}" \
            --fixture-stats-url http://127.0.0.1/__fixture__/stats \
            --ha-url http://127.0.0.1 \
            --ha-token synthetic-read-gateway-token \
            --expected-image-index-digest "$ADDON_AMD64_INDEX_DIGEST" \
            --expected-image-manifest-digest "$ADDON_AMD64_MANIFEST_DIGEST" \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --output "$RUNNER_TEMP/exact-addon-runtime-result.json"
      - name: Verify deterministic exact add-on catalog capture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_upstream_read_release.py capture \
            --endpoint "http://127.0.0.1:9583${MCP_SECRET_PATH}" \
            --output "$RUNNER_TEMP/exact-addon-contract-capture-1.json"
          python scripts/review_upstream_read_release.py capture \
            --endpoint "http://127.0.0.1:9583${MCP_SECRET_PATH}" \
            --output "$RUNNER_TEMP/exact-addon-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/exact-addon-contract-capture-1.json" \
            "$RUNNER_TEMP/exact-addon-contract-capture-2.json"
      - name: Stop immutable add-on runtime gracefully
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if ! docker inspect exact-addon-runtime-upstream >/dev/null 2>&1; then
            jq -n '{result:"FAIL",reason:"container_missing"}' \
              > "$RUNNER_TEMP/exact-addon-runtime-shutdown.json"
            exit 1
          fi
          docker stop --time 20 exact-addon-runtime-upstream >/dev/null
          exit_code="$(
            docker inspect exact-addon-runtime-upstream \
              --format '{{.State.ExitCode}}'
          )"
          jq -n --argjson exit_code "$exit_code" '{
            result: (if $exit_code == 0 then "PASS" else "FAIL" end),
            graceful_stop_requested: true,
            exit_code: $exit_code,
            container_running: false
          }' > "$RUNNER_TEMP/exact-addon-runtime-shutdown.json"
          test "$exit_code" = 0
      - name: Upload bounded exact add-on runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-ha-mcp-${{ matrix.upstream_version }}-addon-runtime
          path: |
            ${{ runner.temp }}/exact-addon-runtime-identity.json
            ${{ runner.temp }}/exact-addon-runtime-result.json
            ${{ runner.temp }}/exact-addon-runtime-shutdown.json
            ${{ runner.temp }}/exact-addon-contract-capture-1.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable exact add-on runtime environment
        if: always()
        shell: bash
        run: |
          docker rm -f exact-addon-runtime-upstream >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/addon-runtime-ha.pid"; then
            sudo kill "$(cat "$RUNNER_TEMP/addon-runtime-ha.pid")" >/dev/null 2>&1 || true
          fi
          sudo rm -rf "$RUNNER_TEMP/exact-addon-data"
