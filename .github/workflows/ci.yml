    env:
      UPSTREAM_VERSION: ${{ matrix.upstream_version }}
      ADDON_DETAIL_PROFILE: ${{ matrix.addon_detail_profile }}
      MCP_SECRET_PATH: ${{ matrix.secret_path }}
      ADDON_AMD64_IMAGE: ghcr.io/homeassistant-ai/ha-mcp-addon-amd64@${{ matrix.addon_amd64_index_digest }}
      ADDON_AMD64_INDEX_DIGEST: ${{ matrix.addon_amd64_index_digest }}
      ADDON_AMD64_MANIFEST_DIGEST: ${{ matrix.addon_amd64_manifest_digest }}
      ADDON_ARM64_IMAGE: ghcr.io/homeassistant-ai/ha-mcp-addon-aarch64@${{ matrix.addon_arm64_index_digest }}
      ADDON_ARM64_INDEX_DIGEST: ${{ matrix.addon_arm64_index_digest }}
      ADDON_ARM64_MANIFEST_DIGEST: ${{ matrix.addon_arm64_manifest_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: hass_mcp_engineering_beta/requirements.lock
      - name: Install exact add-on runtime acceptance dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock
      - name: Verify immutable add-on indexes and platform manifests
        if: matrix.candidate_power != true
        shell: bash
        run: |
          set -euo pipefail
          verify_index() {
            local image="$1"
            local expected_index="$2"
            local expected_platform="$3"
            local expected_manifest="$4"
            local output="$5"
            local resolved_index
            resolved_index="$(
              docker buildx imagetools inspect "$image" |
                sed -nE 's/^Digest:[[:space:]]*(sha256:[0-9a-f]{64})$/\1/p' |
                head -n 1
            )"
            test "$resolved_index" = "$expected_index"
            docker buildx imagetools inspect "$image" --raw > "$output"
            python3 - "$output" "$expected_platform" "$expected_manifest" <<'PY'
          import json
          from pathlib import Path
          import sys

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_platform = sys.argv[2]
          expected_digest = sys.argv[3]
          observed = {}
          for item in value.get("manifests", []):
              platform = item.get("platform") or {}
              os_name = platform.get("os")
              architecture = platform.get("architecture")
              if not isinstance(os_name, str) or not isinstance(
                  architecture, str
              ):
                  continue
              name = f"{os_name}/{architecture}"
              variant = platform.get("variant")
              if isinstance(variant, str) and variant:
                  name += f"/{variant}"
              observed[name] = item.get("digest")
          if observed.get(expected_platform) != expected_digest:
              raise SystemExit(
                  "immutable add-on platform manifest did not match evidence"
              )
          PY
          }
          verify_index \
            "$ADDON_AMD64_IMAGE" \
            "$ADDON_AMD64_INDEX_DIGEST" \
            linux/amd64 \
            "$ADDON_AMD64_MANIFEST_DIGEST" \
            "$RUNNER_TEMP/addon-amd64-index.json"
          verify_index \
            "$ADDON_ARM64_IMAGE" \
            "$ADDON_ARM64_INDEX_DIGEST" \
            linux/arm64 \
            "$ADDON_ARM64_MANIFEST_DIGEST" \
            "$RUNNER_TEMP/addon-arm64-index.json"
      - name: Start synthetic Home Assistant contract fixture
        if: matrix.candidate_power != true
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python)" \
            scripts/fake_ha_read_gateway_contract_server.py \
            --port 80 --upstream-version "$UPSTREAM_VERSION" \
            --addon-detail-profile "$ADDON_DETAIL_PROFILE" \
            > "$RUNNER_TEMP/addon-runtime-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/addon-runtime-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Execute immutable ha-mcp add-on runtime
        if: matrix.candidate_power != true
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ADDON_AMD64_IMAGE"
          observed_label_version="$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{index .Config.Labels "io.hass.version"}}'
          )"
          observed_default_command="$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{json .Config.Cmd}}'
          )"
          observed_build_version="$(
            docker image inspect "$ADDON_AMD64_IMAGE" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' |
              sed -n 's/^HA_MCP_BUILD_VERSION=//p'
          )"
          test "$observed_label_version" = "$UPSTREAM_VERSION"
          test "$observed_build_version" = "$UPSTREAM_VERSION"
          test "$observed_default_command" = '["python3","/start.py"]'
          install -d -m 0700 "$RUNNER_TEMP/exact-addon-data"
          jq -n --arg secret_path "$MCP_SECRET_PATH" '{
            backup_hint: "normal",
            secret_path: $secret_path,
            enable_tool_search: false,
            tool_search_max_results: 5,
            enable_tool_security_policies: true,
            read_only_mode: false,
            enable_mandatory_bps: true,
            enable_strict_mandatory_bps: true,
            disabled_tools: "",
            pinned_tools: "",
            enable_auto_backup: true,
            auto_backup_throttle_minutes: 0,
            auto_backup_retain_per_entity: 100,
            enable_snapshot_delete: false,
            snapshot_delete_min_age_days: 7,
            verify_ssl: true
          }' > "$RUNNER_TEMP/exact-addon-data/options.json"
          docker run --detach --network host --read-only \
            --name exact-addon-runtime-upstream \
            --add-host supervisor:127.0.0.1 \
            --volume "$RUNNER_TEMP/exact-addon-data:/data" \
            --tmpfs /tmp \
            -e MCP_HOST=127.0.0.1 \
            -e SUPERVISOR_TOKEN=synthetic-read-gateway-token \
            "$ADDON_AMD64_IMAGE"
          for attempt in $(seq 1 60); do
            status="$(curl --max-time 1 --silent --output /dev/null \
              --write-out '%{http_code}' \
              "http://127.0.0.1:9583${MCP_SECRET_PATH}" || true)"
            if test "$status" != "000"; then
              break
            fi
            sleep 1
          done
          test "$status" != "000"
          observed_package_version="$(
            docker exec exact-addon-runtime-upstream \
              /app/.venv/bin/python -c \
              'from importlib.metadata import version; print(version("ha-mcp"))'
          )"
          test "$observed_package_version" = "$UPSTREAM_VERSION"
          jq -n \
            --arg expected_version "$UPSTREAM_VERSION" \
            --arg label_version "$observed_label_version" \
            --arg build_version "$observed_build_version" \
            --arg package_version "$observed_package_version" \
            --arg default_command "$observed_default_command" \
            '{
              result: "PASS",
              expected_version: $expected_version,
              image_label_version: $label_version,
              baked_build_version: $build_version,
              package_version: $package_version,
              default_command: $default_command,
              injected_build_version: false,
              default_addon_startup: true
            }' > "$RUNNER_TEMP/exact-addon-runtime-identity.json"
      - name: Run planning-only exact add-on runtime acceptance
        if: matrix.candidate_power != true
        shell: bash
        run: |
          python scripts/exact_addon_runtime_acceptance.py \
            --upstream-endpoint "http://127.0.0.1:9583${MCP_SECRET_PATH}" \
            --configured-upstream-endpoint "http://abcdef12-ha-mcp:9583${MCP_SECRET_PATH}" \
            --fixture-stats-url http://127.0.0.1/__fixture__/stats \
            --ha-url http://127.0.0.1 \
            --ha-token synthetic-read-gateway-token \
            --expected-image-index-digest "$ADDON_AMD64_INDEX_DIGEST" \
            --expected-image-manifest-digest "$ADDON_AMD64_MANIFEST_DIGEST" \
            --expected-upstream-version "$UPSTREAM_VERSION" \
            --output "$RUNNER_TEMP/exact-addon-runtime-result.json"
      - name: Verify deterministic exact add-on catalog capture
        if: matrix.candidate_power != true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_upstream_read_release.py capture \
            --endpoint "http://127.0.0.1:9583${MCP_SECRET_PATH}" \
            --output "$RUNNER_TEMP/exact-addon-contract-capture-1.json"
          python scripts/review_upstream_read_release.py capture \
            --endpoint "http://127.0.0.1:9583${MCP_SECRET_PATH}" \
            --output "$RUNNER_TEMP/exact-addon-contract-capture-2.json"
          cmp \
            "$RUNNER_TEMP/exact-addon-contract-capture-1.json" \
            "$RUNNER_TEMP/exact-addon-contract-capture-2.json"
      - name: Stop immutable add-on runtime gracefully
        if: always() && matrix.candidate_power != true
        shell: bash
        run: |
          set -euo pipefail
          if ! docker inspect exact-addon-runtime-upstream >/dev/null 2>&1; then
            jq -n '{result:"FAIL",reason:"container_missing"}' \
              > "$RUNNER_TEMP/exact-addon-runtime-shutdown.json"
            exit 1
          fi
          docker stop --time 20 exact-addon-runtime-upstream >/dev/null
          exit_code="$(
            docker inspect exact-addon-runtime-upstream \
              --format '{{.State.ExitCode}}'
          )"
          jq -n --argjson exit_code "$exit_code" '{
            result: (if $exit_code == 0 then "PASS" else "FAIL" end),
            graceful_stop_requested: true,
            exit_code: $exit_code,
            container_running: false
          }' > "$RUNNER_TEMP/exact-addon-runtime-shutdown.json"
          test "$exit_code" = 0
      - name: Upload bounded exact add-on runtime evidence
        if: always() && matrix.candidate_power != true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exact-ha-mcp-${{ matrix.upstream_version }}-addon-runtime
          path: |
            ${{ runner.temp }}/exact-addon-runtime-identity.json
            ${{ runner.temp }}/exact-addon-runtime-result.json
            ${{ runner.temp }}/exact-addon-runtime-shutdown.json
            ${{ runner.temp }}/exact-addon-contract-capture-1.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable exact add-on runtime environment
        if: always() && matrix.candidate_power != true
        shell: bash
        run: |
          docker rm -f exact-addon-runtime-upstream >/dev/null 2>&1 || true
          if test -f "$RUNNER_TEMP/addon-runtime-ha.pid"; then
            sudo kill "$(cat "$RUNNER_TEMP/addon-runtime-ha.pid")" >/dev/null 2>&1 || true
          fi
          sudo rm -rf "$RUNNER_TEMP/exact-addon-data"
      - if: matrix.candidate_power == true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: homeassistant-ai/ha-mcp
          ref: ${{ matrix.candidate_source }}
          path: .upstream-${{ matrix.candidate_code }}
          submodules: true
          persist-credentials: false
      - name: Verify power candidate with both exact upstream variants and Core
        if: matrix.candidate_power == true
        env:
          ASSESSMENT_ARCH: ${{ matrix.architecture }}
          ASSESSMENT_CORE: ${{ matrix.candidate_core_version }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/ha_mcp_850_container_acceptance.py --architecture "$ASSESSMENT_ARCH" --upstream-version "$UPSTREAM_VERSION" --core-version "$ASSESSMENT_CORE"
      - name: Always reconcile owned container cleanup
        if: always() && matrix.candidate_power == true
        env:
          ASSESSMENT_ARCH: ${{ matrix.architecture }}
          ASSESSMENT_CORE: ${{ matrix.candidate_core_version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ha_mcp_850_container_acceptance.py --cleanup --architecture "$ASSESSMENT_ARCH" --upstream-version "$UPSTREAM_VERSION" --core-version "$ASSESSMENT_CORE"
      - name: Remove disposable private runner files
        if: always() && matrix.candidate_power == true
        env:
          ASSESSMENT_ARCH: ${{ matrix.architecture }}
          ASSESSMENT_CORE: ${{ matrix.candidate_core_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$ASSESSMENT_ARCH" == amd64 || "$ASSESSMENT_ARCH" == arm64 ]]
          case "$UPSTREAM_VERSION" in
            8.4.3) code=843 ;;
            8.5.0) code=850 ;;
            *) exit 1 ;;
          esac
          case "$ASSESSMENT_CORE:$UPSTREAM_VERSION" in
            2026.9.2:8.4.3|2026.9.2:8.5.0) ;;
            2026.9.3:8.5.0) code=850c3 ;;
            *) exit 1 ;;
          esac
          prefix="h$code-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ASSESSMENT_ARCH-private-"
          # Only this run's synthetic, root-owned Core storage. Never upload it.
          find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d -name "$prefix*" -exec sudo rm -rf -- {} +
      - name: Retain bounded assessment evidence
        if: always() && matrix.candidate_power == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ha-mcp-${{ matrix.candidate_resource_code }}-candidate-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h${{ matrix.candidate_resource_code }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}-evidence/*.json
          if-no-files-found: error
          retention-days: 14
