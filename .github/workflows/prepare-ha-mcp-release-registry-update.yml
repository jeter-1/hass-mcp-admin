name: Prepare ha-mcp release-registry update

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Signed registry operation
        required: true
        default: add
        type: choice
        options:
          - add
          - revoke
      upstream_version:
        description: Exact stable homeassistant-ai/ha-mcp version (for example 8.4.3)
        required: true
        type: string
      revocation_reason:
        description: Bounded denial reason; required only for revoke
        required: false
        default: ""
        type: string

concurrency:
  group: ha-mcp-release-registry-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Upstream observation runs without the signing environment, its secret, or
  # any write token.  Its only output is a bounded, hash-bound artifact.
  evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      capture_sha256: ${{ steps.stage.outputs.capture_sha256 }}
      evidence_sha256: ${{ steps.stage.outputs.evidence_sha256 }}
    env:
      VERSION: ${{ inputs.upstream_version }}
      UPSTREAM_REPOSITORY: https://github.com/homeassistant-ai/ha-mcp.git
      UPSTREAM_IMAGE_REPOSITORY: ghcr.io/homeassistant-ai/ha-mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock

      - name: Validate protected-main request
        env:
          OPERATION: ${{ inputs.operation }}
          REVOCATION_REASON: ${{ inputs.revocation_reason }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$UPSTREAM_REPOSITORY" = "https://github.com/homeassistant-ai/ha-mcp.git"
          test "$UPSTREAM_IMAGE_REPOSITORY" = "ghcr.io/homeassistant-ai/ha-mcp"
          python - <<'PY'
          import os
          import unicodedata

          operation = os.environ["OPERATION"]
          reason = os.environ["REVOCATION_REASON"]
          if operation not in {"add", "revoke"}:
              raise SystemExit("operation is invalid")
          if operation == "add":
              if reason:
                  raise SystemExit("revocation reason must be empty for add")
          else:
              try:
                  encoded = reason.encode("utf-8", errors="strict")
              except UnicodeError as exc:
                  raise SystemExit("revocation reason is not valid UTF-8") from exc
              if not 1 <= len(encoded) <= 512:
                  raise SystemExit("a bounded revocation reason is required")
              if not reason.strip():
                  raise SystemExit("a bounded revocation reason is required")
              if any(unicodedata.category(character).startswith("C") for character in reason):
                  raise SystemExit("revocation reason contains a control character")
              if any(character in {"\u2028", "\u2029"} for character in reason):
                  raise SystemExit("revocation reason must be one line")
          PY

      - name: Resolve exact official source tag
        id: source
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/ha-mcp"
          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPOSITORY" "$repository"
          git -C "$repository" fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          tag_object="$(git -C "$repository" rev-parse "refs/tags/v${VERSION}")"
          source_commit="$(git -C "$repository" rev-parse "refs/tags/v${VERSION}^{commit}")"
          source_tree="$(git -C "$repository" rev-parse "refs/tags/v${VERSION}^{tree}")"
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          git -C "$repository" checkout --detach "$source_commit"
          {
            echo "tag_object=$tag_object"
            echo "source_commit=$source_commit"
            echo "source_tree=$source_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: inputs.operation == 'add'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve exact official image
        id: image
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          tagged="${UPSTREAM_IMAGE_REPOSITORY}:${VERSION}"
          raw="$RUNNER_TEMP/upstream-index.json"
          tagged_inspect="$RUNNER_TEMP/upstream-tagged-inspect.txt"
          immutable_inspect="$RUNNER_TEMP/upstream-immutable-inspect.txt"
          docker buildx imagetools inspect "$tagged" > "$tagged_inspect"
          index_digest="$(awk '$1 == "Digest:" {print $2; exit}' "$tagged_inspect")"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          immutable="${UPSTREAM_IMAGE_REPOSITORY}@${index_digest}"
          docker buildx imagetools inspect "$immutable" > "$immutable_inspect"
          reported_digest="$(awk '$1 == "Digest:" {print $2; exit}' "$immutable_inspect")"
          test "$reported_digest" = "$index_digest"
          docker buildx imagetools inspect --raw "$immutable" > "$raw"
          python - "$raw" "$RUNNER_TEMP/platforms.json" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          digests = {}
          for manifest in source.get("manifests", []):
              platform = manifest.get("platform", {})
              key = f"{platform.get('os')}/{platform.get('architecture')}"
              if key not in {"linux/amd64", "linux/arm64"}:
                  continue
              digest = manifest.get("digest")
              if key in digests or not isinstance(digest, str) or not re.fullmatch(
                  r"sha256:[0-9a-f]{64}", digest
              ):
                  raise SystemExit("ambiguous or invalid architecture manifest")
              digests[key] = digest
          if set(digests) != {"linux/amd64", "linux/arm64"}:
              raise SystemExit("required architecture manifests are missing")
          Path(sys.argv[2]).write_text(
              json.dumps(digests, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          # Provenance comes only from the digest-verified attestation payloads.
          python scripts/verify_upstream_image_provenance.py \
            --index-digest "$index_digest" \
            --version "$VERSION" \
            --source-commit "${{ steps.source.outputs.source_commit }}" \
            --output "$RUNNER_TEMP/upstream-provenance.json"
          python - "$RUNNER_TEMP/upstream-provenance.json" "$RUNNER_TEMP/platforms.json" "$index_digest" > "$RUNNER_TEMP/attested-revision.txt" <<'PY'
          import json
          from pathlib import Path
          import sys

          provenance = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          platforms = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if provenance["image_index_digest"] != sys.argv[3]:
              raise SystemExit("attested image index differs from the resolved index")
          if provenance["slsa_provenance"] != "present_per_platform":
              raise SystemExit("attested provenance is incomplete")
          attested = {key: provenance["platform_digests"].get(key) for key in platforms}
          if attested != platforms:
              raise SystemExit("attested platform digests differ from the index")
          print(provenance["workflow_sha"])
          PY
          revision="$(cat "$RUNNER_TEMP/attested-revision.txt")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          docker pull --platform linux/amd64 "$immutable"
          # Image labels are informational; they must agree with the attestation.
          label_revision="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          image_version="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          source_label="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
          dirty_label="$(docker image inspect "$immutable" --format '{{ index .Config.Labels "io.hass-mcp.build.dirty" }}')"
          test "$label_revision" = "$revision"
          test "$image_version" = "$VERSION"
          test "$source_label" = "https://github.com/homeassistant-ai/ha-mcp"
          if [[ -n "$dirty_label" && "$dirty_label" != "false" ]]; then
            echo "::error::The official upstream image reports a dirty build."
            exit 1
          fi
          git -C "$RUNNER_TEMP/ha-mcp" fetch origin "$revision"
          git -C "$RUNNER_TEMP/ha-mcp" merge-base --is-ancestor "${{ steps.source.outputs.source_commit }}" "$revision"
          unexpected="$(git -C "$RUNNER_TEMP/ha-mcp" diff --name-only "${{ steps.source.outputs.source_commit }}" "$revision" -- . ':!homeassistant-addon/CHANGELOG.md' ':!homeassistant-addon/config.yaml')"
          test -z "$unexpected"
          {
            echo "index_digest=$index_digest"
            echo "image_revision=$revision"
          } >> "$GITHUB_OUTPUT"

      - name: Start disposable read-only Home Assistant fixture
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fake_ha_read_gateway_contract_server.py \
            --port 18123 --upstream-version "$VERSION" \
            > "$RUNNER_TEMP/fake-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fake-ha.pid"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18123/api/ >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Capture exact runtime catalog twice
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          immutable="${UPSTREAM_IMAGE_REPOSITORY}@${{ steps.image.outputs.index_digest }}"
          docker run --detach --rm --network host --name ha-mcp-release-review \
            --read-only --tmpfs /tmp --tmpfs /home/mcpuser/.ha-mcp \
            -e HOMEASSISTANT_URL=http://127.0.0.1:18123 \
            -e HOMEASSISTANT_TOKEN=synthetic-release-registry-token \
            -e MCP_HOST=127.0.0.1 -e MCP_PORT=18086 -e MCP_SECRET_PATH=/mcp \
            -e HA_MCP_DISABLE_SETTINGS_UI=true \
            "$immutable" ha-mcp-web
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:18086/mcp; then
              break
            fi
            sleep 1
          done
          mkdir -p .compat
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/mcp \
            --output .compat/capture-1.json
          python scripts/review_upstream_read_release.py capture \
            --endpoint http://127.0.0.1:18086/mcp \
            --output .compat/capture-2.json
          cmp .compat/capture-1.json .compat/capture-2.json
          mv .compat/capture-1.json .compat/ha-mcp-runtime-capture.json
          rm .compat/capture-2.json
          python - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen("http://127.0.0.1:18123/__fixture__/stats", timeout=5) as response:
              stats = json.load(response)
          if any(
              (
                  stats["http_mutations"],
                  stats["websocket_mutations"],
                  stats["operational_backup_creates"],
                  stats["approval_notification_calls"],
              )
          ):
              raise SystemExit("runtime review reached a mutation surface")
          PY

      - name: Generate bounded immutable release evidence
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          python - "$VERSION" "${{ steps.source.outputs.tag_object }}" "${{ steps.source.outputs.source_commit }}" "${{ steps.source.outputs.source_tree }}" "${{ steps.image.outputs.index_digest }}" "${{ steps.image.outputs.image_revision }}" "$RUNNER_TEMP/platforms.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          version, tag_object, commit, tree, index, revision, platforms = sys.argv[1:]
          value = {
              "architecture_image_digests": json.loads(
                  Path(platforms).read_text(encoding="utf-8")
              ),
              "image_index_digest": index,
              "image_revision": revision,
              "source_commit": commit,
              "source_tag": f"v{version}",
              "source_tag_object": tag_object,
              "source_tree": tree,
              "version": version,
          }
          Path(".compat/ha-mcp-release-evidence.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Stage bounded release evidence for signing
        id: stage
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/release-evidence"
          mkdir -- "$staging"
          cp -- .compat/ha-mcp-runtime-capture.json .compat/ha-mcp-release-evidence.json "$staging/"
          {
            echo "capture_sha256=$(sha256sum -- "$staging/ha-mcp-runtime-capture.json" | cut -d ' ' -f 1)"
            echo "evidence_sha256=$(sha256sum -- "$staging/ha-mcp-release-evidence.json" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Retain bounded release evidence for signing
        id: upload
        if: inputs.operation == 'add'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ha-mcp-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: error
          retention-days: 1

      - name: Write bounded preparation summary
        if: always()
        env:
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          {
            echo "### ha-mcp release-registry preparation"
            echo "- Version: ${VERSION}"
            echo "- Operation: ${OPERATION}"
            echo "- Source: homeassistant-ai/ha-mcp"
            echo "- Image: ghcr.io/homeassistant-ai/ha-mcp"
            echo "- Dashboard authority: separate"
            echo "- Engineering image publication: false"
            echo "- Deployment or restart: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up disposable runtime
        if: ${{ always() && inputs.operation == 'add' }}
        shell: bash
        run: |
          docker rm -f ha-mcp-release-review >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/fake-ha.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/fake-ha.pid")" >/dev/null 2>&1 || true
          fi
          rm -rf .compat

  # Signing holds the environment-scoped seed but no write token.  It installs
  # only the hash-locked runtime parsers the signer re-validates evidence with.
  sign:
    needs: evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ha-mcp-release-registry-signing
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.stage.outputs.manifest_sha256 }}
    env:
      VERSION: ${{ inputs.upstream_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.14"

      - name: Install hash-locked runtime dependencies
        run: >-
          python -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r hass_mcp_engineering_beta/requirements.lock

      - name: Download bounded release evidence
        if: inputs.operation == 'add'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.evidence.outputs.artifact_id }}
          path: .compat

      - name: Verify bounded release evidence
        if: inputs.operation == 'add'
        env:
          CAPTURE_SHA256: ${{ needs.evidence.outputs.capture_sha256 }}
          EVIDENCE_SHA256: ${{ needs.evidence.outputs.evidence_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          present="$(cd .compat && find . -mindepth 1 -printf '%P\n' | sort)"
          test "$present" = "$(printf '%s\n' ha-mcp-release-evidence.json ha-mcp-runtime-capture.json)"
          test ! -L .compat/ha-mcp-runtime-capture.json
          test ! -L .compat/ha-mcp-release-evidence.json
          [[ "$CAPTURE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum -- .compat/ha-mcp-runtime-capture.json | cut -d ' ' -f 1)" = "$CAPTURE_SHA256"
          test "$(sha256sum -- .compat/ha-mcp-release-evidence.json | cut -d ' ' -f 1)" = "$EVIDENCE_SHA256"

      - name: Sign and verify data-only release-registry update
        env:
          HA_MCP_RELEASE_REGISTRY_SIGNING_KEY: ${{ secrets.HA_MCP_RELEASE_REGISTRY_SIGNING_KEY }}
          HA_MCP_RELEASE_REGISTRY_REVOCATION_REASON: ${{ inputs.revocation_reason }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HA_MCP_RELEASE_REGISTRY_SIGNING_KEY"
          python scripts/prepare_ha_mcp_release_registry_update.py \
            --version "$VERSION" \
            --operation "$OPERATION"

      - name: Remove bounded add preparation inputs
        if: inputs.operation == 'add'
        shell: bash
        run: |
          set -euo pipefail
          test -f .compat/ha-mcp-runtime-capture.json
          test -f .compat/ha-mcp-release-evidence.json
          rm -- \
            .compat/ha-mcp-runtime-capture.json \
            .compat/ha-mcp-release-evidence.json
          rmdir -- .compat

      - name: Stage exact signed data-only update
        id: stage
        env:
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "add" ]]; then
            expected="$(printf '%s\n' \
              "docs/evidence/ha-mcp-release-registry/ha-mcp-${VERSION}.json" \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md \
              upstream-trust/ha-mcp-release-registry.json | sort)"
          else
            expected="$(printf '%s\n' \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md \
              upstream-trust/ha-mcp-release-registry.json | sort)"
          fi
          changed="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          test "$changed" = "$expected"
          staging="$RUNNER_TEMP/signed"
          mkdir -p -- "$staging/files"
          while IFS= read -r relative; do
            test -f "$relative"
            test ! -L "$relative"
            install -D -m 0644 -- "$relative" "$staging/files/$relative"
          done <<< "$expected"
          (cd "$staging/files" && sha256sum -- $expected) > "$staging/SHA256SUMS"
          echo "manifest_sha256=$(sha256sum -- "$staging/SHA256SUMS" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Retain exact signed data-only update
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ha-mcp-release-registry-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 1

  # Publication holds the write token but no signing environment or secret,
  # and runs no Python or package installation.
  publish:
    needs: sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.upstream_version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact signed data-only update
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: ${{ runner.temp }}/signed

      - name: Verify and apply exact signed data-only update
        env:
          MANIFEST_SHA256: ${{ needs.sign.outputs.manifest_sha256 }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/signed"
          if [[ "$OPERATION" == "add" ]]; then
            expected="$(printf '%s\n' \
              "docs/evidence/ha-mcp-release-registry/ha-mcp-${VERSION}.json" \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md \
              upstream-trust/ha-mcp-release-registry.json | sort)"
          else
            expected="$(printf '%s\n' \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md \
              upstream-trust/ha-mcp-release-registry.json | sort)"
          fi
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test ! -L "$signed/SHA256SUMS"
          test "$(sha256sum -- "$signed/SHA256SUMS" | cut -d ' ' -f 1)" = "$MANIFEST_SHA256"
          test "$(cut -c 67- "$signed/SHA256SUMS" | sort)" = "$expected"
          test "$(cd "$signed/files" && find . -mindepth 1 ! -type d -printf '%P\n' | sort)" = "$expected"
          test -z "$(cd "$signed/files" && find . -mindepth 1 ! -type d ! -type f)"
          (cd "$signed/files" && sha256sum --strict --check --quiet ../SHA256SUMS)
          while IFS= read -r relative; do
            install -D -m 0644 -- "$signed/files/$relative" "$relative"
          done <<< "$expected"
          rm -rf -- "$signed"

      - name: Enforce data-only diff
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          branch="data/ha-mcp-release-${OPERATION}-${VERSION}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          if [[ "$OPERATION" == "add" ]]; then
            git add -- \
              upstream-trust/ha-mcp-release-registry.json \
              "docs/evidence/ha-mcp-release-registry/ha-mcp-${VERSION}.json" \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md
            expected_count=3
            commit_message="Authorize ha-mcp ${VERSION} compatible reads"
          else
            git add -- \
              upstream-trust/ha-mcp-release-registry.json \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md
            expected_count=2
            commit_message="Revoke ha-mcp ${VERSION} compatible-read authority"
          fi
          if [[ "$OPERATION" == "add" ]]; then
            expected="$(printf '%s\n' \
              "docs/evidence/ha-mcp-release-registry/ha-mcp-${VERSION}.json" \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md \
              upstream-trust/ha-mcp-release-registry.json | sort)"
          else
            expected="$(printf '%s\n' \
              docs/generated/HA_MCP_RELEASE_REGISTRY_INDEX.md \
              upstream-trust/ha-mcp-release-registry.json | sort)"
          fi
          staged="$(git diff --cached --name-only | sort)"
          changed="$(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )"
          test "$staged" = "$expected"
          test "$changed" = "$expected"
          test "$(git diff --cached --name-only | wc -l)" -eq "$expected_count"
          git commit -m "$commit_message"
          # Checkout credentials are not persisted; the token reaches git only
          # through the gh credential helper for this one push.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/${branch}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open data-only draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          if [[ "$OPERATION" == "add" ]]; then
            title="Authorize compatible ha-mcp ${VERSION} reads"
            body="Data-only signed release-registry add for exact ha-mcp ${VERSION}. It can select only compiled read profiles, keeps dashboard authority separate, and changes no Engineering image, route, tool, argument builder, fallback, or deployment."
          else
            title="Revoke compatible-read authority for ha-mcp ${VERSION}"
            body="Data-only denial-only revocation for exact ha-mcp ${VERSION}. It preserves existing release evidence and changes no Engineering image, route, tool, argument builder, fallback, or deployment."
          fi
          gh pr create --draft --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "$title" \
            --body "$body"
