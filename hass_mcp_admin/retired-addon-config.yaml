# RETIRED (HAMCP-203): stable v1 is not a Home Assistant add-on any more.
# This file was config.yaml. It is renamed so the Supervisor's add-on store
# discovery (glob "**/config.*") cannot find, list, or install it. Do not
# rename it back. Values are kept as the last shipped v1.1.2 metadata. See README.md.

name: HA MCP Engineering Server
version: "1.1.2"
slug: hass_mcp_admin
description: Focused Home Assistant engineering MCP server for diagnostics, analysis, and controlled administration
url: https://github.com/jeter-1/hass-mcp-admin
arch:
  - amd64
  - aarch64
  - armv7
init: false
homeassistant_api: true
map:
  - homeassistant_config:ro
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: MCP streamable-HTTP endpoint (point your Cloudflare Tunnel here)
options:
  access_secret: ""
  rate_limit_per_minute: 120
  rate_limit_burst: 25
  destructive_services:
    - lock.unlock
    - lock.open
    - cover.open_cover
    - alarm_control_panel.alarm_disarm
    - homeassistant.restart
    - homeassistant.stop
schema:
  access_secret: str
  rate_limit_per_minute: int
  rate_limit_burst: int
  destructive_services:
    - str
