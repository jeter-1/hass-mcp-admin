# Versioned, transport-free promotion regression sentinels.
#
# An authorized operator performs only the read-only observations below and
# records the allowlisted projections printed by:
#   python scripts/promotion_regression_check.py plan
# The checker makes no live calls. Captures are operator-attested evidence, not
# cryptographic provenance. Missing evidence is never success.

manifest_version: 2

target:
  release: 2.2.0-beta.39
  tag: v2.2.0-beta.39
  build_sha: bf4236cc99c9515325d7cba0fd8d2f909d3573cb
  evidence_captured_at: "2026-08-19"
  evidence_source: >-
    Bounded signatures derived from two manually reported Beta 39 live
    regression passes and rechecked against the reviewed Beta 39 source
    contracts. The committed fixture is synthetic and contains no production
    response body or credential.
  notes: >-
    Expected failures are informational only when every desired check fails in
    the recorded way and every bounded known-failure check matches. A different
    failure is a regression. No status is changed automatically.

observations:
  - id: server_identity
    tool: server_info
    arguments: {check_ha: true}
    effect_class: read_only
    procedure: >-
      Call server_info with check_ha=true. Copy only the allowlisted identity,
      version, build, Home Assistant, and tool-accounting fields.

  - id: server_health
    tool: get_server_health
    arguments: {check_ha: true}
    effect_class: read_only
    procedure: >-
      Call get_server_health with check_ha=true. Copy only the allowlisted
      health, provider, governance, storage, and fallback fields.

  - id: direct_entity_read
    tool: get_entity
    arguments: {entity_id: input_boolean.mcp_f2_standard_admin_test_flag}
    effect_class: read_only
    procedure: >-
      Read the exact disposable helper and copy only success, entity identity,
      state, and resource classification. Do not retain attributes.

  - id: native_dependency_read
    tool: entity_dependency_analysis
    arguments:
      entity_id: input_boolean.mcp_f2_standard_admin_test_flag
      detail_level: evidence
      include_indirect: true
      max_depth: 3
      source_types: [automation, blueprint]
      limit: 100
      cursor: ""
      refresh_index: true
    effect_class: read_only
    procedure: >-
      Force a fresh bounded dependency scan. Copy the allowlisted cache,
      coverage, count, fallback, and bounded failed-obligation projection only.
      The failed-obligation set fingerprint is the SHA-256 of the exact bounded
      signature containing source type, blueprint path, reason code, and count;
      never copy blueprint bodies.

  - id: delegated_overview_read
    tool: ha_get_overview
    arguments: {}
    effect_class: read_only
    procedure: >-
      Run the admitted upstream overview read and copy only success, provider,
      classification, and fallback attribution.

  - id: dashboard_map_read
    tool: get_dashboard_config
    arguments: {url_path: map, force_reload: true}
    effect_class: read_only
    procedure: >-
      Read the stock map dashboard and copy only identity, returned-status,
      provider, dispatch, and fallback fields. Do not retain dashboard content.

  - id: long_wait_template_automation_read
    tool: get_automation_config
    arguments: {}
    operator_arguments:
      automation_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$"}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Resolve the dedicated accepted long-wait-template canary automation id
      before invocation and record that exact id in capture arguments.
    procedure: >-
      Read the exact canary automation. Project its returned id plus a bounded
      structural summary: wait_template count, action index, template length,
      and SHA-256 semantic digest. Do not retain the automation body.

  - id: stale_state_canary_task
    tool: get_execution_task
    arguments: {}
    operator_arguments:
      task_id: {type: string, pattern: "^[a-f0-9]{32}$"}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Resolve the exact accepted stale-helper-state canary task id and record it
      in capture arguments. Do not substitute any other failed task.
    procedure: >-
      Read the exact task and copy only task identity, operation, target,
      terminal state, dispatch accounting, and bounded stale-state error fields.

  - id: f3_orphan_task
    tool: get_execution_task
    arguments: {task_id: ab8d7cd12aad48aab8307ca819c794ca}
    effect_class: read_only
    procedure: >-
      Read the exact recorded orphan task. Copy only parent/child lifecycle,
      dispatch count, and bounded selective-hold count.

  - id: execution_task_inventory
    tool: list_execution_tasks
    arguments: {state: "", terminal_outcome: "", plan_id: "", limit: 100}
    effect_class: read_only
    procedure: >-
      List the bounded task inventory and project only the exact orphan task's
      identity and parent state. Do not retain unrelated task records.

  - id: historical_policy_snapshot_plan
    tool: get_change_plan
    arguments: {plan_id: 00dbf0dfbd7f4f3e84d01a30d18ffdde}
    effect_class: read_only
    procedure: >-
      Read the exact historically failing plan and copy only success, top-level
      error taxonomy, and bounded resource identity.

  - id: historical_approval_sequence_plan
    tool: get_change_plan
    arguments: {plan_id: 72cd49adeeec492c91679ef2c78bc325}
    effect_class: read_only
    procedure: >-
      Read the exact historically failing plan and copy only success, top-level
      error taxonomy, and bounded resource identity.

  - id: home_assistant_configuration_validation
    tool: check_config
    arguments: {}
    effect_class: read_only
    procedure: >-
      Run Home Assistant's reviewed read-only full configuration check and copy
      only the normalized result/errors plus direct-provider and fallback data.

  - id: held_read_canary_not_found
    tool: run_held_read_canary
    arguments:
      upstream_tool_name: ha_get_operation_status
      arguments: {operation_id: hamcp-089-deliberately-nonexistent-operation}
    operator_arguments:
      expected_compatibility_entry_id: {type: string, minLength: 1, maxLength: 160}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Copy the active selected compatibility entry id from this run's health
      response into the exact invocation arguments.
    procedure: >-
      Run the held read against the deliberately nonexistent operation. Copy
      only the bounded contract, held-status, nested not-found, top-level
      taxonomy, dispatch, promotion, and fallback evidence.

