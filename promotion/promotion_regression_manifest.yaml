# Versioned, transport-free promotion regression sentinels.
#
# An authorized operator performs only the read-only observations below and
# records the allowlisted projections printed by:
#   python scripts/promotion_regression_check.py plan
# The checker makes no live calls. Captures are operator-attested evidence, not
# cryptographic provenance. Missing evidence is never success.

manifest_version: 2

target:
  release: 2.2.0-beta.39
  tag: v2.2.0-beta.39
  build_sha: bf4236cc99c9515325d7cba0fd8d2f909d3573cb
  evidence_captured_at: "2026-08-19"
  evidence_source: >-
    Bounded signatures derived from two manually reported Beta 39 live
    regression passes and rechecked against the reviewed Beta 39 source
    contracts. The committed fixture is synthetic and contains no production
    response body or credential.
  notes: >-
    Expected failures are informational only when every desired check fails in
    the recorded way and every bounded known-failure check matches. A different
    failure is a regression. No status is changed automatically.

projection_contracts:
  - id: dependency_evidence_projection_v2
    version: 1
    observation: native_dependency_read
    algorithm: dependency_public_evidence_v2
    maximum_source_bytes: 131072
    output_paths:
      - projection.observable_coverage_summary
      - projection.observable_evidence_fingerprint
      - projection.observable_dependency_source_count
    procedure: >-
      Supply the actual bounded public entity_dependency_analysis response.
      The evaluator reads only public overview, source_coverage, pagination,
      and freshness fields, validates their exact types, sorts coverage by
      source type, and fingerprints a versioned canonical JSON object. The
      human-readable summary is not the fingerprint preimage. Current public
      evidence exposes failure counts but not failed blueprint identities or
      reasons, so this contract truthfully binds the coarser observable state.

  - id: wait_template_structure_projection_v1
    version: 1
    observation: long_wait_template_automation_read
    algorithm: wait_template_structure_v1
    maximum_source_bytes: 131072
    expected_action_pointer: /action/2
    output_paths:
      - projection.wait_template_count
      - projection.wait_template_action_path
      - projection.wait_template_length
      - projection.wait_template_semantic_digest
    procedure: >-
      Supply a bounded source-shaped automation mapping containing only the
      returned id and material action structure. The evaluator resolves the
      reviewed /action/2 pointer, requires action to be a sequence and the
      selected item to contain a string wait_template, and ignores unrelated
      mappings elsewhere. It normalizes CRLF/CR to LF and Unicode to NFC
      without trimming whitespace. Length is normalized UTF-8 bytes. The digest is
      SHA-256 over UTF-8 bytes for "wait_template_structure_v1", one NUL byte,
      the JSON Pointer, one NUL byte, and the normalized template. Node, depth,
      candidate, template, and aggregate source bounds fail closed.

observations:
  - id: server_identity
    tool: server_info
    arguments: {check_ha: true}
    effect_class: read_only
    procedure: >-
      Call server_info with check_ha=true. Copy only the allowlisted identity,
      version, build, Home Assistant, and tool-accounting fields.

  - id: server_health
    tool: get_server_health
    arguments: {check_ha: true}
    effect_class: read_only
    procedure: >-
      Call get_server_health with check_ha=true. Copy only the allowlisted
      health, provider, governance, storage, and fallback fields.

  - id: direct_entity_read
    tool: get_entity
    arguments: {entity_id: input_boolean.mcp_f2_standard_admin_test_flag}
    effect_class: read_only
    procedure: >-
      Read the exact disposable helper and copy only success, entity identity,
      state, and resource classification. Do not retain attributes.

  - id: native_dependency_read
    tool: entity_dependency_analysis
    arguments:
      entity_id: input_boolean.mcp_f2_standard_admin_test_flag
      detail_level: evidence
      include_indirect: true
      max_depth: 3
      source_types: [automation, blueprint]
      limit: 100
      cursor: ""
      refresh_index: true
    effect_class: read_only
    procedure: >-
      Force a fresh bounded dependency scan. Feed its public response directly
      to the offline projector, then copy only the allowlisted cache, coverage,
      count, fallback, and coarser observable projection. The public response
      does not expose failed-blueprint identities or reason codes; do not invent
      or reconstruct them and never copy blueprint bodies.

  - id: delegated_overview_read
    tool: ha_get_overview
    arguments: {}
    effect_class: read_only
    procedure: >-
      Run the admitted upstream overview read and copy only success, provider,
      classification, and fallback attribution.

  - id: dashboard_map_read
    tool: get_dashboard_config
    arguments: {url_path: map, force_reload: true}
    effect_class: read_only
    procedure: >-
      Read the stock map dashboard and copy only identity, returned-status,
      provider, dispatch, and fallback fields. Do not retain dashboard content.

  - id: long_wait_template_automation_read
    tool: get_automation_config
    arguments: {}
    operator_arguments:
      automation_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$"}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Resolve the dedicated accepted long-wait-template canary automation id
      before invocation and record that exact id in capture arguments.
    procedure: >-
      Read the exact canary automation. Project its returned id plus a bounded
      structural summary: wait_template count, action index, template length,
      and SHA-256 semantic digest. Do not retain the automation body.

  - id: stale_state_canary_task
    tool: get_execution_task
    arguments: {}
    operator_arguments:
      task_id: {type: string, pattern: "^[a-f0-9]{32}$"}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Resolve the exact accepted stale-helper-state canary task id and record it
      in capture arguments. Do not substitute any other failed task.
    procedure: >-
      Read the exact task and copy only task identity, operation, target,
      terminal state, dispatch accounting, and bounded stale-state error fields.

  - id: f3_orphan_task
    tool: get_execution_task
    arguments: {task_id: ab8d7cd12aad48aab8307ca819c794ca}
    effect_class: read_only
    procedure: >-
      Read the exact recorded orphan task. Copy only parent/child lifecycle,
      task schema, and dispatch count. Active lock state comes independently
      from the bounded server-health observation.

  - id: historical_beta31_map_update_task
    tool: get_execution_task
    arguments: {}
    operator_arguments:
      task_id: {type: string, pattern: "^[a-f0-9]{32}$"}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Resolve the exact accepted Beta 31 map-update task id from approved
      historical acceptance evidence. If it cannot be resolved, leave this
      observation not_captured; never substitute a different dashboard task.
    procedure: >-
      Read the exact historical task and copy only identity, task schema,
      operation, target, terminal state, provider-attempt count, and bounded
      verification status. Do not retain lifecycle events or plan authority.

  - id: historical_beta31_map_cleanup_task
    tool: get_execution_task
    arguments: {}
    operator_arguments:
      task_id: {type: string, pattern: "^[a-f0-9]{32}$"}
    effect_class: read_only
    target_binding: operator_local
    target_note: >-
      Resolve the exact accepted Beta 31 map-cleanup task id from approved
      historical acceptance evidence. If it cannot be resolved, leave this
      observation not_captured; never substitute a different dashboard task.
    procedure: >-
      Read the exact historical cleanup task and copy only identity, task
