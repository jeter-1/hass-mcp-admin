  - id: held-read-contract-and-not-found-behavior
    title: Held read matches its reviewed contracts and stays held on not-found
    description: >-
      A canary call to the single held-for-canary upstream read must match the
      reviewed input schema, annotation, security, runtime, and output
      contracts; must surface a structured RESOURCE_NOT_FOUND for a
      deliberately nonexistent id; and must leave the tool held with no
      promotion and no fallback.
    register_section: minimum_permanent_sentinels
    observation: held_read_canary_not_found
    expected_status: expected_pass
    checks:
      - path: success
        operator: equals
        value: false
        note: >-
          The not-found probe is expected to return a failure envelope. The
          evidence being asserted lives in details.canary_evidence.
      - path: details.canary_evidence.upstream_tool
        operator: equals
        value: ha_get_operation_status
