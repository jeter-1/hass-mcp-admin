separately_authorized_canaries:
  - id: helper-no-change-path
    title: Helper no-change path remains dispatch-free
    tool: create_helper_state_plan
    effect_class: governed_write
    included_in_default_plan: false
    separate_authorization_required: true
    required_for_promotion: true
    availability: executable
    fixed_arguments:
      entity_id: input_boolean.mcp_f2_standard_admin_test_flag
      expiration_minutes: 10
    operator_arguments:
      desired_state: {type: string, enum: ["on", "off"]}
    preconditions:
      - Separately authorize this write-classified canary before invocation.
      - Read the exact helper immediately before planning and bind desired_state to that observed state.
      - Accept that a race may still create a governance plan; a preread does not make this call read-only.
    desired_checks:
      - {path: success, operator: equals, value: true}
      - {path: data.status, operator: equals, value: no_change}
      - {path: data.outcome, operator: equals, value: already_in_desired_state}
      - {path: data.plan_created, operator: equals, value: false}
      - {path: data.provider_dispatch_occurred, operator: equals, value: false}
      - {path: data.verified, operator: equals, value: true}
      - {path: data.target_id, operator: equals, value: input_boolean.mcp_f2_standard_admin_test_flag}
      - {path: data.provider, operator: equals, value: direct_home_assistant_state}
      - {path: data.fallback, operator: equals, value: none}
      - {path: data.fallback_occurred, operator: equals, value: false}
    procedure: >-
      This declaration represents the accepted helper no-change contract but is
      never rendered into the default read-only observation plan. It appears as
      not_captured in the capture template, and an unperformed required canary
      makes promotion evidence incomplete. A separately authorized operator
      may execute it only under the preconditions above and must review any plan
      created by a state race through the ordinary governance lifecycle.

  - id: beta39-jinja-helper-dependency-semantics
    title: Beta 39 Jinja helper-dependency semantics remain exact
    tool: create_helper_state_plan
    effect_class: governed_write
    included_in_default_plan: false
    separate_authorization_required: true
    required_for_promotion: true
    availability: unavailable_pending_reviewed_protocol
    fixed_arguments:
      expiration_minutes: 10
    operator_arguments:
      entity_id: {type: string, pattern: "^input_boolean\\.[a-z0-9_]+$"}
      desired_state: {type: string, enum: ["on", "off"]}
      fixture_contract_digest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
    preconditions:
      - Separately authorize this governed planning canary and its reviewed disposable fixture lifecycle.
      - Bind the exact fixture digest covering .get(), .items(), .keys(), .values(), and literal bracket access.
      - Do not approve or apply any generated plan; this canary verifies dependency/risk evidence only.
    procedure: >-
      This required canary represents the authoritative Beta 39 live-accepted
      Jinja/helper-dependency family. It is not a default observation and cannot
      be proven by the current generic read-only pack without a pre-existing
      reviewed fixture. A separately authorized operator must bind a reviewed
      disposable fixture contract and capture only the bounded per-family
      classification, exact fixture digest, no-dispatch, and no-fallback result.
      No mechanically obtainable protocol is declared in this PR; it is an
      explicit unavailable requirement. A separate bounded task must define
      and authorize that protocol before this requirement can be captured.
      Until then, promotion_eligible remains false.
