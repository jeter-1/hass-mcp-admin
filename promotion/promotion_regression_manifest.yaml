  - id: f3-ready-locks-and-recovery
    title: F3 lifecycle and orphan accounting agree
    description: The exact recorded parent and child must terminalize consistently with zero dispatch and no active locks.
    register_section: minimum_permanent_sentinels
    observation: server_health
    expected_status: expected_fail
    deficiency:
      register_item: 2
      related_register_items: [14]
      summary: The terminal parent retains one nonterminal F3 child while no task or lock authority is active.
      observed_evidence: >-
        Exact orphan task ab8d7cd12aad48aab8307ca819c794ca has a terminal
        parent, one bounded nonterminal child, zero dispatch, and zero active
        holds; F3 reports recovering/1 while task navigation reports 0.
    desired_checks:
      - {path: data.governance.f3.status, operator: equals, value: ready}
      - {path: data.governance.f3.nonterminal_execution_count, operator: equals, value: 0}
      - {path: data.governance.f3.execution_ready, operator: equals, value: true}
      - {path: data.governance.f3.active_conflict_hold_count, operator: equals, value: 0}
      - {path: data.governance.execution_tasks.storage.navigation.nonterminal_record_count, operator: equals, value: 0}
      - {path: data.task_id, operator: equals, value: ab8d7cd12aad48aab8307ca819c794ca, source_observation: f3_orphan_task}
      - {path: data.f3_children.0.state, operator: one_of, values: [succeeded_verified, failed_pre_dispatch, failed_post_dispatch, manual_review_required, cancelled_pre_dispatch], source_observation: f3_orphan_task}
    known_failure_checks:
      - {path: data.governance.f3.status, operator: equals, value: recovering}
      - {path: data.governance.f3.nonterminal_execution_count, operator: equals, value: 1}
      - {path: data.governance.f3.execution_ready, operator: equals, value: true}
      - {path: data.governance.f3.active_conflict_hold_count, operator: equals, value: 0}
      - {path: data.governance.execution_tasks.storage.navigation.nonterminal_record_count, operator: equals, value: 0}
      - {path: data.task_id, operator: equals, value: ab8d7cd12aad48aab8307ca819c794ca, source_observation: f3_orphan_task}
      - {path: data.state, operator: one_of, values: [succeeded_verified, failed_pre_dispatch, failed_post_dispatch, manual_review_required, cancelled_pre_dispatch], source_observation: f3_orphan_task}
      - {path: data.terminal_outcome, operator: one_of, values: [succeeded_verified, failed_pre_dispatch, failed_post_dispatch, manual_review_required, cancelled_pre_dispatch], source_observation: f3_orphan_task}
      - {path: data.provider_attempt_count, operator: equals, value: 0, source_observation: f3_orphan_task}
      - {path: data.dispatched_at, operator: equals, value: null, source_observation: f3_orphan_task}
      - {path: data.f3_children.0.state, operator: one_of, values: [created, preflight, dispatching, observing, verifying], source_observation: f3_orphan_task}
      - {path: data.f3_children.0.dispatch_count, operator: equals, value: 0, source_observation: f3_orphan_task}
      - {path: projection.active_selective_hold_count, operator: equals, value: 0, source_observation: f3_orphan_task}
      - {path: "data.tasks[task_id=ab8d7cd12aad48aab8307ca819c794ca].state", operator: equals_observation_path, source_observation: execution_task_inventory, observation: f3_orphan_task, reference_path: data.state}

