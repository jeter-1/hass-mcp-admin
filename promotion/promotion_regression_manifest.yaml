  - id: held-read-top-level-not-found-taxonomy
    title: Held read top-level taxonomy preserves RESOURCE_NOT_FOUND
    description: The top-level error must classify the structured upstream not-found instead of collapsing it to provider_error.
    register_section: minimum_permanent_sentinels
    observation: held_read_canary_not_found
    expected_status: expected_fail
    deficiency:
      register_item: 19
      summary: Engineering misclassifies an upstream RESOURCE_NOT_FOUND as retryable provider_error/upstream_error.
      observed_evidence: >-
        The nested reviewed error is RESOURCE_NOT_FOUND, while top-level
        error_code is provider_error, failure_category is upstream_error, and
        retryable is true. Held status, dispatch evidence, and fallback remain correct.
    desired_checks:
      - {path: error_code, operator: equals, value: RESOURCE_NOT_FOUND}
      - {path: details.failure_category, operator: equals, value: resource_not_found}
      - {path: retryable, operator: equals, value: false}
    known_failure_checks:
