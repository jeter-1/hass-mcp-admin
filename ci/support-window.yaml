# Compatibility support window for Engineering CI (HAMCP-154).
#
# Josh is the only consumer of the Engineering add-on, so compatibility CI covers
# only three slots per component:
#   current   - what is deployed now
#   candidate - the next version under evaluation (evaluation only; a passing lane
#               never admits anything, and admission policy, the signed registries
#               and any upstream HOLD are decided elsewhere)
#   rollback  - the version that ran immediately before current
#
# Tiers (scripts/support_window.py derives every lane matrix from this file):
#   pr   - pull_request runs: current + candidate
#   full - nightly schedule, workflow_dispatch and every workflow_call (the
#          release/publication gate): current + candidate + rollback
#
# Lane pairing varies one component at a time from the current deployment:
#   real-HA contract  : each Core slot in the tier, paired with ha_mcp.current
#   exact-image gateway: each ha-mcp slot in the tier (Core is synthetic there)
#   add-on runtime    : each ha-mcp slot's addon_runtime lanes, on core.current
#
# Rotation (contract amendment, Josh 2026-10-11): rotating Cores that are
# already in the window (candidate -> current, current -> rollback, rollback
# dropped) edits only this file. Adding a brand-new Core (normally as candidate)
# first adds its exact reviewed binding to the one consolidated list in
# scripts/core_lane_bindings.py, as a single deliberate review step; this window
# never supplies or derives a binding. scripts/support_window.py refuses any Core
# slot without a reviewed binding (core_<slot>_binding_unreviewed) or whose digest
# differs from it (core_<slot>_binding_mismatch) before any matrix is generated,
# so no row advertises Alarmo or baseline coverage the executable path would not
# run. All three slots are required and must be distinct; a missing, null or
# repeated slot refuses, except that core.candidate may be explicitly null (no
# Core under evaluation): then no candidate Core lane, Alarmo job or lane
# provenance is created or required.
# Every pin must be an immutable digest copied from reviewed evidence. A Core slot
# also needs tests/fixtures/core_<version>_lane_provenance.json, and the contract
# scripts must already support the new pairing: for example the add-on acceptance
# script must accept each ha-mcp version with the new current Core, or the window
# refuses (addon_<slot>_pair_unsupported). Alarmo acceptance and the automation
# baseline proof follow every non-empty Core slot in the tier (HAMCP-159), bound to
# the slot's exact version, digest and lane provenance, so rotation needs no
# Alarmo evidence edits; a Core outside the window refuses.
# The 2026.7.2 migration-fixture writer image in ci.yml is a deliberate constant
# (it writes the persisted fixture), not a window slot.
