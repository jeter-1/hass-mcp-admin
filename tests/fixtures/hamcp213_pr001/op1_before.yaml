id: pr001_op1_open_warning
alias: Anonymized alias 1
description: Anonymized description 2.
triggers:
- entity_id: cover.garage_main
  for: 00:15:00
  id: open_15m
  to: open
  trigger: state
- entity_id: cover.garage_main
  id: closed
  to: closed
  trigger: state
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: open_15m
    - condition: state
      entity_id: input_boolean.visitor_mode
      state: 'off'
    - condition: state
      entity_id: input_boolean.service_visit_mode
      state: 'off'
    sequence:
    - if:
      - condition: state
        entity_id: timer.alert_snooze
        state: idle
      then:
      - action: notify.mobile_app_owner_phone
        data:
          data:
            actions:
            - action: CLOSE_GARAGE
              title: Neutral title 3.
            - action: SNOOZE_ALERTS
              title: Neutral title 4.
            tag: garage_open_warning
          message: Neutral message 5.
          title: Neutral title 6.
      - action: logbook.log
        data:
          entity_id: cover.garage_main
          message: Neutral message 7.
          name: Neutral name 1.
  - conditions:
    - condition: trigger
      id: closed
    sequence:
    - action: notify.mobile_app_owner_phone
      continue_on_error: true
      data:
        data:
          tag: garage_open_warning
        message: Neutral message 8.
mode: single
